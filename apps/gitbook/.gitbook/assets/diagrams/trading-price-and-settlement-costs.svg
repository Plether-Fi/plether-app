<svg xmlns="http://www.w3.org/2000/svg" width="640" height="842" viewBox="0 0 640 842" role="img" aria-labelledby="trading-price-and-settlement-costs-title trading-price-and-settlement-costs-desc" focusable="false">
<title id="trading-price-and-settlement-costs-title">Price and costs are different inputs</title>
<desc id="trading-price-and-settlement-costs-desc">Oracle price determines price PnL. Fees, carry, VPI and frozen spread are separate action economics, not a synthetic execution price. Do not treat a displayed price change as net profit or a guarantee of immediately withdrawable USDC.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="842" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / TRADE ECONOMICS</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Price and costs are different</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">inputs</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<rect x="32" y="216" width="278" height="291" rx="12" fill="#FFAB96" stroke="none"/>
<text x="48" y="258" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Price PnL</text>
<path d="M48 279 L294 279" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="309" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Oracle price +</text>
<text x="48" y="342" font-size="26" font-weight="700" fill="#250917" data-max-width="246">position</text>
<text x="48" y="381" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Side, exact entry</text>
<text x="48" y="413" font-size="24" font-weight="400" fill="#250917" data-max-width="246">cost and quantity</text>
<text x="48" y="445" font-size="24" font-weight="400" fill="#250917" data-max-width="246">determine price gain</text>
<text x="48" y="477" font-size="24" font-weight="400" fill="#250917" data-max-width="246">or loss.</text>
<rect x="330" y="216" width="278" height="291" rx="12" fill="#F7E4B2" stroke="none"/>
<text x="346" y="258" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Action economics</text>
<path d="M346 279 L592 279" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="309" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Fees + carry + VPI</text>
<text x="346" y="348" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Add frozen-close</text>
<text x="346" y="380" font-size="24" font-weight="400" fill="#250917" data-max-width="246">spread when</text>
<text x="346" y="412" font-size="24" font-weight="400" fill="#250917" data-max-width="246">applicable. VPI can</text>
<text x="346" y="444" font-size="24" font-weight="400" fill="#250917" data-max-width="246">be signed.</text>
<circle cx="47" cy="548" r="14" fill="#9A8890"/>
<circle cx="47" cy="548" r="5" fill="#250917"/>
<text x="80" y="557" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Separate settlement paths</text>
<text x="80" y="594" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Costs may offset a gain. Price losses and</text>
<text x="80" y="626" font-size="24" font-weight="400" fill="#250917" data-max-width="528">remaining action charges use different</text>
<text x="80" y="658" font-size="24" font-weight="400" fill="#250917" data-max-width="528">backing.</text>
<rect x="32" y="682" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="720" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Do not treat a displayed price change as net</text>
<text x="50" y="752" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">profit or a guarantee of immediately</text>
<text x="50" y="784" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">withdrawable USDC.</text>
</svg>
