<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="preview-commit-finalize-title preview-commit-finalize-desc" focusable="false">
<title id="preview-commit-finalize-title">One review, two onchain stages</title>
<desc id="preview-commit-finalize-desc">Preview is not a transaction. Commitment and later keeper execution are separate onchain stages. The requested trade happens only if execution succeeds.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="680" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / ORDER LIFECYCLE</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">One review, two onchain stages</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Preview</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Review an estimate. Nothing has been</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">committed.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Commit</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Authorize an order and reserve its required</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">funds.</text>
<path d="M47 340 V421 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="450" r="14" fill="#00FF99"/>
<circle cx="47" cy="450" r="5" fill="#250917"/>
<text x="80" y="459" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Execute later</text>
<text x="80" y="496" font-size="24" font-weight="400" fill="#250917" data-max-width="528">A keeper processes the eligible queued</text>
<text x="80" y="528" font-size="24" font-weight="400" fill="#250917" data-max-width="528">order.</text>
<rect x="32" y="552" width="576" height="96" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="590" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">The requested trade happens only if</text>
<text x="50" y="622" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">execution succeeds.</text>
</svg>
