<svg xmlns="http://www.w3.org/2000/svg" width="640" height="923" viewBox="0 0 640 923" role="img" aria-labelledby="quickstart-sponsored-operation-lifecycle-title quickstart-sponsored-operation-lifecycle-desc" focusable="false">
<title id="quickstart-sponsored-operation-lifecycle-title">From preparation to confirmation</title>
<desc id="quickstart-sponsored-operation-lifecycle-desc">Preparation and sponsorship precede the wallet signature. Successful operation confirmation is separate from delayed-order execution. For an order, confirmed means committed — not filled. Errors or an unknown outcome require receipt reconciliation.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="923" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / SPONSORED TRANSACTIONS</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">From preparation to</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">confirmation</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="233" r="14" fill="#9A8890"/>
<circle cx="47" cy="233" r="5" fill="#250917"/>
<text x="80" y="242" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Prepare</text>
<text x="80" y="279" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Build the operation, estimate gas and obtain</text>
<text x="80" y="311" font-size="24" font-weight="400" fill="#250917" data-max-width="528">sponsorship.</text>
<path d="M47 254 V335 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="364" r="14" fill="#FF512F"/>
<circle cx="47" cy="364" r="5" fill="#250917"/>
<text x="80" y="373" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Confirm in wallet</text>
<text x="80" y="410" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Sign the exact prepared operation.</text>
<path d="M47 385 V434 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="463" r="14" fill="#9A8890"/>
<circle cx="47" cy="463" r="5" fill="#250917"/>
<text x="80" y="472" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Submit</text>
<text x="80" y="509" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Send the signed operation to the bundler.</text>
<path d="M47 484 V533 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="562" r="14" fill="#F7D977"/>
<circle cx="47" cy="562" r="5" fill="#250917"/>
<text x="80" y="571" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Pending onchain</text>
<text x="80" y="608" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Wait for an inclusion receipt.</text>
<path d="M47 583 V632 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="661" r="14" fill="#00FF99"/>
<circle cx="47" cy="661" r="5" fill="#250917"/>
<text x="80" y="670" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Confirmed</text>
<text x="80" y="707" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Verify that the operation succeeded</text>
<text x="80" y="739" font-size="24" font-weight="400" fill="#250917" data-max-width="528">onchain.</text>
<rect x="32" y="763" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="801" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">For an order, confirmed means committed —</text>
<text x="50" y="833" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">not filled. Errors or an unknown outcome</text>
<text x="50" y="865" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">require receipt reconciliation.</text>
</svg>
