<svg xmlns="http://www.w3.org/2000/svg" width="640" height="779" viewBox="0 0 640 779" role="img" aria-labelledby="open-increase-sponsored-submission-title open-increase-sponsored-submission-desc" focusable="false">
<title id="open-increase-sponsored-submission-title">Authorize an opening order</title>
<desc id="open-increase-sponsored-submission-desc">Preparation and sponsorship precede the wallet signature. Successful operation confirmation is separate from delayed-order execution. Opens and increases reserve submitted margin plus a 0.01–0.25 USDG opening execution reward until executed or cleared.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="779" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · SPONSORED TRANSACTIONS</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Authorize an opening order</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Prepare</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Build the operation, estimate gas and obtain</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">sponsorship.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#FFAB96"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Confirm in wallet</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Sign the exact prepared operation.</text>
<path d="M47 315 V362 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="385" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="385" r="5" fill="#9A8890"/>
<text x="78" y="394" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Submit</text>
<text x="78" y="427" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Send the signed operation to the bundler.</text>
<path d="M47 404 V451 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="474" r="13" fill="#3B212D" stroke="#F7D977" stroke-width="2.5"/>
<circle cx="47" cy="474" r="5" fill="#F7D977"/>
<text x="78" y="483" font-size="24" font-weight="700" fill="#F7D977" data-max-width="530">Pending onchain</text>
<text x="78" y="516" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Wait for an inclusion receipt.</text>
<path d="M47 493 V540 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="563" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="563" r="5" fill="#00FF99"/>
<text x="78" y="572" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Confirmed</text>
<text x="78" y="605" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Verify that the operation succeeded onchain.</text>
<rect x="32" y="629" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="639" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="663" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Opens and increases reserve submitted margin</text>
<text x="56" y="693" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">plus a 0.01–0.25 USDG opening execution</text>
<text x="56" y="723" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">reward until executed or cleared.</text>
</svg>
