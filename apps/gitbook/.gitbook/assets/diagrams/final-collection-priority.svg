<svg xmlns="http://www.w3.org/2000/svg" width="640" height="979" viewBox="0 0 640 979" role="img" aria-labelledby="final-collection-priority-title final-collection-priority-desc" focusable="false">
<title id="final-collection-priority-title">Two separate collection paths</title>
<desc id="final-collection-priority-desc">Price losses consume same-account trader claims, then collectible PnL pledge. Action charges use separate sources and cannot consume PnL pledge. A partial close cannot waive action charges. PnL pledge and protected execution bounties are not general fee collateral.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="979" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / V2 CLOSE ACCOUNTING</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Two separate collection paths</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<rect x="32" y="171" width="278" height="624" rx="12" fill="#FFAB96" stroke="none"/>
<text x="48" y="213" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Price loss</text>
<path d="M48 234 L294 234" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="264" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Net own claims</text>
<text x="48" y="303" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Only this account’s</text>
<text x="48" y="335" font-size="24" font-weight="400" fill="#250917" data-max-width="246">trader claims.</text>
<path d="M56 352 V371 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="415" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Consume PnL</text>
<text x="48" y="448" font-size="26" font-weight="700" fill="#250917" data-max-width="246">pledge</text>
<text x="48" y="487" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Within the terminal</text>
<text x="48" y="519" font-size="24" font-weight="400" fill="#250917" data-max-width="246">collectible cap.</text>
<path d="M56 536 V555 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="599" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Write off excess</text>
<text x="48" y="638" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Any price loss</text>
<text x="48" y="670" font-size="24" font-weight="400" fill="#250917" data-max-width="246">beyond that cap.</text>
<rect x="330" y="171" width="278" height="624" rx="12" fill="#FFAB96" stroke="none"/>
<text x="346" y="213" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Action charges</text>
<path d="M346 234 L592 234" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="264" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Withhold from gain</text>
<text x="346" y="303" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Offset a positive</text>
<text x="346" y="335" font-size="24" font-weight="400" fill="#250917" data-max-width="246">price gain first.</text>
<path d="M354 352 V371 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="415" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Use eligible funds</text>
<text x="346" y="454" font-size="24" font-weight="400" fill="#250917" data-max-width="246">VPI clawback</text>
<text x="346" y="486" font-size="24" font-weight="400" fill="#250917" data-max-width="246">reserve, spendable</text>
<text x="346" y="518" font-size="24" font-weight="400" fill="#250917" data-max-width="246">action reserve, then</text>
<text x="346" y="550" font-size="24" font-weight="400" fill="#250917" data-max-width="246">free settlement.</text>
<path d="M354 567 V586 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="630" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Full-close fallback</text>
<text x="346" y="669" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Committed-order</text>
<text x="346" y="701" font-size="24" font-weight="400" fill="#250917" data-max-width="246">margin, then waive</text>
<text x="346" y="733" font-size="24" font-weight="400" fill="#250917" data-max-width="246">uncollectible</text>
<text x="346" y="765" font-size="24" font-weight="400" fill="#250917" data-max-width="246">charges.</text>
<rect x="32" y="819" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="857" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">A partial close cannot waive action charges.</text>
<text x="50" y="889" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">PnL pledge and protected execution bounties</text>
<text x="50" y="921" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">are not general fee collateral.</text>
</svg>
