name: Browser test coverage

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read
  packages: read

concurrency:
  group: browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-e2e:
    name: ${{ matrix.suite == 'e2e' && 'Frontend E2E (app)' || (matrix.suite == 'privy-sdk-1' && 'Frontend E2E (Privy SDK 1/2)' || 'Frontend E2E (Privy SDK 2/2)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, privy-sdk-1, privy-sdk-2]
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'
      - name: Pin npm
        run: npm install -g npm@11.6.2
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-playwright-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Run asserted app E2E coverage
        if: matrix.suite == 'e2e'
        run: npm run test:e2e
      - name: Run actual Privy SDK wallet lifecycle coverage (shard 1/2)
        if: matrix.suite == 'privy-sdk-1'
        run: npm run test:e2e:privy-sdk -- --shard=1/2
      - name: Run actual Privy SDK wallet lifecycle coverage (shard 2/2)
        if: matrix.suite == 'privy-sdk-2'
        run: npm run test:e2e:privy-sdk -- --shard=2/2
      - name: Preserve results, traces and assertion failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.suite }}-${{ github.run_attempt }}
          path: apps/frontend/.test-results/
          include-hidden-files: true
          if-no-files-found: warn

  e2e-gate:
    name: Frontend E2E
    needs: [browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All frontend E2E suites passed."

  storybook:
    name: Storybook interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/insights/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'
      - name: Pin npm
        run: npm install -g npm@11.6.2
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies used by Insights stories
        run: npm ci --no-audit --no-fund
        working-directory: apps/insights
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-playwright-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Run asserted browser coverage
        run: npm run test:storybook
      - name: Preserve results, traces and assertion failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-storybook-${{ github.run_attempt }}
          path: apps/frontend/.test-results/
          include-hidden-files: true
          if-no-files-found: warn
