<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1126" viewBox="0 0 640 1126" role="img" aria-labelledby="usdg-account-flow-title usdg-account-flow-desc" focusable="false">
<title id="usdg-account-flow-title">USDG has distinct places to live</title>
<desc id="usdg-account-flow-desc">Trading Account wallet USDG can be deposited into clearinghouse settlement custody. Free funds, PnL pledge and action reserves have different permissions; withdrawal does not require first making a trade. Carry consumes active position margin before free USDG. A deposit need not pass through a trade before withdrawal, but account-health checks still apply.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1126" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / ACCOUNT BALANCES</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">USDG has distinct places to live</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Trading Account wallet</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Fund with a token transfer or the testnet</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">faucet.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Deposit margin</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">USDG enters the Margin Clearinghouse.</text>
<text x="32" y="415" font-size="26" font-weight="700" fill="#250917" data-max-width="576">Internal account balances</text>
<rect x="32" y="438" width="576" height="88" rx="8" fill="#FFAB96" stroke="none"/>
<text x="52" y="472" font-size="24" font-weight="400" fill="#250917" data-max-width="536">Free USDG — eligible for actions and carry</text>
<text x="52" y="504" font-size="24" font-weight="400" fill="#250917" data-max-width="536">after active margin</text>
<rect x="32" y="536" width="576" height="88" rx="8" fill="#FFAB96" stroke="none"/>
<text x="52" y="570" font-size="24" font-weight="400" fill="#250917" data-max-width="536">Position margin — backs price risk and pays</text>
<text x="52" y="602" font-size="24" font-weight="400" fill="#250917" data-max-width="536">carry first</text>
<rect x="32" y="634" width="576" height="56" rx="8" fill="#FFAB96" stroke="none"/>
<text x="52" y="668" font-size="24" font-weight="400" fill="#250917" data-max-width="536">Action, order and liquidation reserves</text>
<rect x="32" y="716" width="576" height="160" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="754" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Carry consumes active position margin before</text>
<text x="50" y="786" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">free USDG. A deposit need not pass through</text>
<text x="50" y="818" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">a trade before withdrawal, but</text>
<text x="50" y="850" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">account-health checks still apply.</text>
<circle cx="47" cy="917" r="14" fill="#9A8890"/>
<circle cx="47" cy="917" r="5" fill="#250917"/>
<text x="80" y="926" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Withdraw eligible free USDG</text>
<text x="80" y="963" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Subject to reserves, carry and</text>
<text x="80" y="995" font-size="24" font-weight="400" fill="#250917" data-max-width="528">account-health checks.</text>
<path d="M47 938 V1019 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="1048" r="14" fill="#00FF99"/>
<circle cx="47" cy="1048" r="5" fill="#250917"/>
<text x="80" y="1057" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Owner wallet receives USDG</text>
<text x="80" y="1094" font-size="24" font-weight="400" fill="#250917" data-max-width="528">After the sponsored withdrawal succeeds.</text>
</svg>
