name: Singapore AA preparation (no deployment)
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read

jobs:
  mocked-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25.2.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Test RPC mode and release contracts
        env:
          AA_TERRAFORM_TEST_REQUIRED: '1'
        run: node --test scripts/aa-rpc-mode.test.mjs scripts/aa-sepolia.test.mjs scripts/aa-deployment-approval.test.mjs
      - name: Test AA admin audit lifecycle and readback
        run: python3 .github/scripts/test-aa-admin-audit-lifecycle.py
      - name: Initialize provider schema without state
        run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate and exercise mocked AWS plans
        run: |
          terraform -chdir=infra/terraform validate -no-color
          terraform -chdir=infra/terraform test -filter=tests/sepolia.tftest.hcl -var-file=sepolia-aa-canary-preparation.tfvars -no-color
