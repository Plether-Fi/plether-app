name: Database Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sepolia
          - mainnet
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - init-schema
          - connect-info
      skip_pre_migration_snapshot:
        description: Skip pre-migration RDS snapshot (Sepolia only; ignored on mainnet)
        required: false
        type: boolean
        default: false

concurrency:
  group: plether-db-mutation-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ENV: ${{ inputs.environment }}
  DB_ADMIN_ENVIRONMENT: db-admin-${{ inputs.environment }}

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: db-admin-${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write

    steps:
      - name: Verify protected database environment and master-only policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PREVENT_SELF_REVIEW: ${{ inputs.environment == 'mainnet' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          umask 077

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error title=Unsupported workflow ref::Database management must be dispatched from master."
            exit 1
          fi

          environment_file="$RUNNER_TEMP/db-admin-environment.json"
          branch_policy_file="$RUNNER_TEMP/db-admin-branch-policies.json"
          if ! gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/environments/$DB_ADMIN_ENVIRONMENT" \
              > "$environment_file"; then
            echo "::error title=Database environment unavailable::Provision and protect $DB_ADMIN_ENVIRONMENT before running database management."
            exit 1
          fi
          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/environments/$DB_ADMIN_ENVIRONMENT/deployment-branch-policies?per_page=100" \
            > "$branch_policy_file"

          jq --exit-status \
            --arg name "$DB_ADMIN_ENVIRONMENT" \
            --argjson prevent_self "$REQUIRE_PREVENT_SELF_REVIEW" \
            '.name == $name
             and .can_admins_bypass == false
             and ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 1
             and ([.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review == $prevent_self)
             and ([.protection_rules[]? | select(.type == "required_reviewers")][0].reviewers | length) > 0
             and .deployment_branch_policy.custom_branch_policies == true' \
            "$environment_file" >/dev/null
          jq --exit-status \
            '.branch_policies | length == 1 and .[0].name == "master" and .[0].type == "branch"' \
            "$branch_policy_file" >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.EXPECTED_AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          role-session-name: plether-db-${{ github.run_id }}

      - name: Create pre-migration RDS snapshot
        if: inputs.action == 'init-schema' && (inputs.environment == 'mainnet' || inputs.skip_pre_migration_snapshot != true)
        run: |
          set -euo pipefail
          SNAPSHOT_ID="plether-${ENV}-pre-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Creating RDS snapshot ${SNAPSHOT_ID} before schema execution..."
          aws rds create-db-snapshot \
            --db-instance-identifier "plether-${ENV}" \
            --db-snapshot-identifier "$SNAPSHOT_ID" \
            --tags Key=Project,Value=plether Key=Environment,Value="${ENV}" Key=Reason,Value=pre-migration >/dev/null
          aws rds wait db-snapshot-available \
            --db-instance-identifier "plether-${ENV}" \
            --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "Pre-migration snapshot ready: ${SNAPSHOT_ID}"

      - name: Init schema
        if: inputs.action == 'init-schema'
        run: |
          set -euo pipefail

          CLUSTER="plether-${{ env.ENV }}"
          SERVICE_FILE="$RUNNER_TEMP/db-manage-service.json"
          NETWORK_FILE="$RUNNER_TEMP/db-manage-network.json"
          SOURCE_TASK_DEFINITION_FILE="$RUNNER_TEMP/db-manage-source-task-definition.json"
          ADMIN_TASK_DEFINITION_FILE="$RUNNER_TEMP/db-manage-task-definition.json"

          aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services plether-api > "$SERVICE_FILE"

          jq --exit-status \
            '(.failures | length) == 0
             and (.services | length) == 1
             and .services[0].status == "ACTIVE"
             and (.services[0].taskDefinition | type == "string")' \
            "$SERVICE_FILE" >/dev/null

          SOURCE_TASK_DEFINITION=$(jq -r '.services[0].taskDefinition' "$SERVICE_FILE")
          jq '
            .services[0].networkConfiguration.awsvpcConfiguration
            | {awsvpcConfiguration: {
                subnets: .subnets,
                securityGroups: .securityGroups,
                assignPublicIp: (.assignPublicIp // "DISABLED")
              }}
          ' "$SERVICE_FILE" > "$NETWORK_FILE"

          aws ecs describe-task-definition \
            --task-definition "$SOURCE_TASK_DEFINITION" > "$SOURCE_TASK_DEFINITION_FILE"
          jq --exit-status \
            --arg databaseParameterSuffix ":parameter/plether/${{ env.ENV }}/database-url" \
            '
            (.taskDefinition.containerDefinitions
             | map(select(.name == "plether-api"))
             | length) == 1
            and (.taskDefinition.runtimePlatform.cpuArchitecture == "ARM64")
            and (.taskDefinition.containerDefinitions[]
                 | select(.name == "plether-api")
                 | .image
                 | (type == "string" and length > 0))
            and ([.taskDefinition.containerDefinitions[]
                  | select(.name == "plether-api")
                  | .secrets[]?
                  | select(
                      .name == "DATABASE_URL"
                      and (.valueFrom | endswith($databaseParameterSuffix))
                    )]
                 | length) == 1
          ' "$SOURCE_TASK_DEFINITION_FILE" >/dev/null

          jq \
            --arg environment "${{ env.ENV }}" \
            --arg region "$AWS_REGION" \
            '
            .taskDefinition as $source
            | ($source.containerDefinitions[] | select(.name == "plether-api")) as $api
            | ($api.secrets[] | select(.name == "DATABASE_URL")) as $databaseSecret
            | {
                family: ("plether-" + $environment + "-db-manage"),
                executionRoleArn: $source.executionRoleArn,
                taskRoleArn: $source.taskRoleArn,
                networkMode: "awsvpc",
                requiresCompatibilities: ["FARGATE"],
                cpu: "256",
                memory: "512",
                runtimePlatform: $source.runtimePlatform,
                containerDefinitions: [{
                  name: "plether-db-manage",
                  image: $api.image,
                  essential: true,
                  command: [
                    "sh",
                    "-c",
                    "exec psql --set=ON_ERROR_STOP=1 --variable=VERBOSITY=terse -c \"SET lock_timeout = '\''15s'\''; SET statement_timeout = '\''10min'\'';\" --file=/app/schema.sql \"$DATABASE_URL\""
                  ],
                  secrets: [$databaseSecret],
                  environment: [],
                  portMappings: [],
                  mountPoints: [],
                  volumesFrom: [],
                  logConfiguration: {
                    logDriver: "awslogs",
                    options: {
                      "awslogs-group": ("/ecs/plether-" + $environment),
                      "awslogs-region": $region,
                      "awslogs-stream-prefix": "db-manage"
                    }
                  }
                }]
              }
          ' "$SOURCE_TASK_DEFINITION_FILE" > "$ADMIN_TASK_DEFINITION_FILE"

          TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json "file://$ADMIN_TASK_DEFINITION_FILE" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          trap 'aws ecs deregister-task-definition --task-definition "$TASK_DEFINITION" >/dev/null 2>&1 || true' EXIT

          RUN_RESULT=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --network-configuration "file://$NETWORK_FILE" \
            --task-definition "$TASK_DEFINITION")

          if [ "$(jq -r '.failures | length' <<< "$RUN_RESULT")" != "0" ]; then
            echo "::error title=ECS rejected database task::Inspect the private ECS failure response."
            exit 1
          fi

          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<< "$RUN_RESULT")
          if [ -z "$TASK_ARN" ]; then
            echo "::error title=Database task was not started::ECS returned no task ARN."
            exit 1
          fi

          echo "Running task $TASK_ARN..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`plether-db-manage`].exitCode | [0]' \
            --output text)
          echo "Task exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      - name: Show connection info
        if: inputs.action == 'connect-info'
        run: |
          ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier plether-${{ env.ENV }} --query 'DBInstances[0].Endpoint' --output json)
          echo "RDS Endpoint: $(echo $ENDPOINT | jq -r '.Address'):$(echo $ENDPOINT | jq -r '.Port')"
          echo "Database: plether"
          echo ""
          echo "Note: RDS is not publicly accessible. Connect via ECS exec or a bastion host."
