<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1269" viewBox="0 0 640 1269" role="img" aria-labelledby="lp-hourly-epoch-timeline-title lp-hourly-epoch-timeline-desc" focusable="false">
<title id="lp-hourly-epoch-timeline-title">Hourly epochs and 4-phase settlement</title>
<desc id="lp-hourly-epoch-timeline-desc">Owner-wallet LP requests queue before the five-minute hourly cutoff, settle in strict four-phase order (Senior withdraw, Junior withdraw, Junior deposit, Senior deposit), and age a one-hour cooldown. Trader reserves and Senior backlog always settle ahead of Junior withdrawals. Positive NAV does not guarantee instant cash.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1269" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · HOURLY LP EPOCHS</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Hourly epochs and 4-phase</text>
<text x="32" y="150" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">settlement</text>
<path d="M32 180 L608 180" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 180 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="221" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="221" r="5" fill="#9A8890"/>
