# Parse the services' JSON lines into OTLP log attributes. Invalid JSON is left
# unchanged by the parser, then renamed below so third-party/plaintext output
# remains searchable and has a valid OTLP body.
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       plether_json
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name      modify
    Match     *
    Condition Key_exists log
    Rename    log message

# FireLens adds container_name and ECS task metadata before these filters run.
# Build a standards-compliant OTLP Resource map for PostHog's service facets.
[FILTER]
    Name      modify
    Match     *
    Set       otel.resource.service.name unknown_service
    Set       otel.resource.service.version ${SERVICE_VERSION}
    Set       otel.resource.deployment.environment.name ${DEPLOYMENT_ENVIRONMENT}
    Set       otel.resource.cloud.provider aws
    Set       otel.resource.cloud.platform aws_ecs
    Set       otel.resource.cloud.region ${AWS_REGION}
    Set       otel.resource.aws.ecs.cluster.name ${ECS_CLUSTER_NAME}
    Add       SeverityText INFO
    Add       SeverityNumber 9

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals container_name plether-api
    Set       otel.resource.service.name plether-api

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals container_name plether-keeper
    Set       otel.resource.service.name plether-keeper

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals container_name plether-perps-indexer
    Set       otel.resource.service.name plether-indexer

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals container_name plether-basket-worker
    Set       otel.resource.service.name plether-basket-worker

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals container_name plether-oracle-worker
    Set       otel.resource.service.name plether-oracle-worker

# Structured records carry an explicit level. Plaintext fallback records still
# receive a best-effort severity based on their message vocabulary.
[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals level DEBUG
    Set       SeverityText DEBUG
    Set       SeverityNumber 5

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals level WARN
    Set       SeverityText WARN
    Set       SeverityNumber 13

[FILTER]
    Name      modify
    Match     *
    Condition Key_value_equals level ERROR
    Set       SeverityText ERROR
    Set       SeverityNumber 17

[FILTER]
    Name      modify
    Match     *
    Condition Key_does_not_exist level
    Condition Key_value_matches message (?i)(warn|warning|retry|skipped|mismatch)
    Set       SeverityText WARN
    Set       SeverityNumber 13

[FILTER]
    Name      modify
    Match     *
    Condition Key_does_not_exist level
    Condition Key_value_matches message (?i)(error|failed|failure|exception|fatal)
    Set       SeverityText ERROR
    Set       SeverityNumber 17

# The modify filter writes assigned values as strings. OTLP requires
# SeverityNumber to be an integer in the 1..24 range.
[FILTER]
    Name    type_converter
    Match   *
    str_key SeverityNumber SeverityNumber int

[FILTER]
    Name          nest
    Match         *
    Operation     nest
    Wildcard      otel.resource.*
    Nest_under    attributes
    Remove_prefix otel.resource.

[FILTER]
    Name       nest
    Match      *
    Operation  nest
    Wildcard   attributes
    Nest_under resource

# Keep the existing CloudWatch copy while the generated FireLens output sends
# the same records to PostHog over OTLP/HTTP.
[OUTPUT]
    Name              cloudwatch_logs
    Match             *
    region            ${AWS_REGION}
    log_group_name    ${CLOUDWATCH_LOG_GROUP}
    log_stream_prefix firelens-
    auto_create_group false
    log_suppress_interval 60
    workers           1
