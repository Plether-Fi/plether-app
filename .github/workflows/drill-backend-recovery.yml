name: Qualify isolated backend image recovery
run-name: Isolated non-signing recovery drill / ${{ github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/drill-backend-recovery.yml
      - scripts/backend-recovery-engine*
      - scripts/drill-backend-recovery*
      - scripts/recover-backend*
      - config/operations/backend-recovery-drill.json
  workflow_dispatch:
    inputs:
      expected_task_definition:
        description: Exact FAILED isolated fixture task-definition ARN from read-only inspect
        required: true
        type: string
      expected_configuration_sha256:
        description: Isolated fixture configuration fingerprint from read-only inspect
        required: true
        type: string
      operator_note:
        description: Non-secret drill reference (1-512 printable ASCII characters)
        required: true
        type: string
      confirmation:
        description: Type RECOVER ISOLATED FIXTURE ON SEPOLIA
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'plether-backend-recovery-drill' || format('isolated-recovery-tests-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_PAGER: ''
  AWS_MAX_ATTEMPTS: '3'
  EXPECTED_TASK_DEFINITION: ${{ inputs.expected_task_definition }}
  EXPECTED_CONFIGURATION_SHA256: ${{ inputs.expected_configuration_sha256 }}
  OPERATOR_NOTE: ${{ inputs.operator_note }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test scripts/recover-backend.test.mjs scripts/drill-backend-recovery.test.mjs

  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      id-token: write
    outputs:
      fingerprint: ${{ steps.inputs.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require the protected master-only backend environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/drill-backend-recovery.mjs environment
      - name: Record isolated fixture inputs before approval
        id: inputs
        run: |
          set -euo pipefail
          result="$(node scripts/drill-backend-recovery.mjs fingerprint)"
          fingerprint="${result##*:}"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "$result"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Isolated drill input fingerprint: \`sha256:$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Require the existing read-only inventory role
        env:
          RUNTIME_AUDIT_ROLE: ${{ vars.AWS_RUNTIME_IMAGE_AUDIT_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$RUNTIME_AUDIT_ROLE" = arn:aws:iam::932542905614:role/plether-sepolia-runtime-image-audit
      - name: Configure read-only Linux baseline inspection
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_IMAGE_AUDIT_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '932542905614'
          role-session-name: isolated-drill-inspect-${{ github.run_id }}
      - name: Diagnose fixed fixture baseline before mutation approval
        run: node scripts/drill-backend-recovery.mjs diagnose > "$RUNNER_TEMP/drill-baseline.json"
      - name: Preserve bounded read-only baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-drill-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drill-baseline.json
          if-no-files-found: warn
          retention-days: 90

  recover-isolated-fixture:
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: backend-admin-sepolia
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      EXPECTED_INPUT_FINGERPRINT: ${{ needs.preflight.outputs.fingerprint }}
    steps:
      - name: Check out the exact reviewed isolated policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Revalidate protection and dedicated role before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_RECOVERY_DRILL_ROLE_ARN: ${{ vars.AWS_RECOVERY_DRILL_ROLE_ARN }}
        run: node scripts/drill-backend-recovery.mjs environment-credentials
      - name: Set private isolated evidence directory
        run: echo "RECOVERY_EVIDENCE_DIR=$RUNNER_TEMP/isolated-backend-recovery" >> "$GITHUB_ENV"
      - name: Configure fixture-only AWS capability
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RECOVERY_DRILL_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '932542905614'
          role-session-name: isolated-recovery-${{ github.run_id }}
      - name: Exercise the shared recovery engine on the non-signing fixture
        run: node scripts/drill-backend-recovery.mjs recover
      - name: Preserve isolated runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-backend-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/isolated-backend-recovery/recovery.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove private fixture-definition scratch file
        if: always()
        run: |
          if [ -n "${RECOVERY_EVIDENCE_DIR:-}" ]; then
            rm -f "$RECOVERY_EVIDENCE_DIR/task-definition.private.json"
          fi
