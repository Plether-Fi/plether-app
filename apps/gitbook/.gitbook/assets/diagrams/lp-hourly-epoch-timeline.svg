<text x="48" y="455" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="248">Funded first from</text>
<text x="48" y="485" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="248">free cash</text>
