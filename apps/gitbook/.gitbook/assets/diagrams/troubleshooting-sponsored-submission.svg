<svg xmlns="http://www.w3.org/2000/svg" width="640" height="878" viewBox="0 0 640 878" role="img" aria-labelledby="troubleshooting-sponsored-submission-title troubleshooting-sponsored-submission-desc" focusable="false">
<title id="troubleshooting-sponsored-submission-title">Check the submission stage</title>
<desc id="troubleshooting-sponsored-submission-desc">Preparation and sponsorship precede the wallet signature. Successful operation confirmation is separate from delayed-order execution. For an order, confirmed means committed — not filled. Errors or an unknown outcome require receipt reconciliation.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="878" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / SPONSORED TRANSACTIONS</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Check the submission stage</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Prepare</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Build the operation, estimate gas and obtain</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">sponsorship.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Confirm in wallet</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Sign the exact prepared operation.</text>
<path d="M47 340 V389 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="418" r="14" fill="#9A8890"/>
<circle cx="47" cy="418" r="5" fill="#250917"/>
<text x="80" y="427" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Submit</text>
<text x="80" y="464" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Send the signed operation to the bundler.</text>
<path d="M47 439 V488 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="517" r="14" fill="#F7D977"/>
<circle cx="47" cy="517" r="5" fill="#250917"/>
<text x="80" y="526" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Pending onchain</text>
<text x="80" y="563" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Wait for an inclusion receipt.</text>
<path d="M47 538 V587 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="616" r="14" fill="#00FF99"/>
<circle cx="47" cy="616" r="5" fill="#250917"/>
<text x="80" y="625" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Confirmed</text>
<text x="80" y="662" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Verify that the operation succeeded</text>
<text x="80" y="694" font-size="24" font-weight="400" fill="#250917" data-max-width="528">onchain.</text>
<rect x="32" y="718" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="756" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">For an order, confirmed means committed —</text>
<text x="50" y="788" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">not filled. Errors or an unknown outcome</text>
<text x="50" y="820" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">require receipt reconciliation.</text>
</svg>
