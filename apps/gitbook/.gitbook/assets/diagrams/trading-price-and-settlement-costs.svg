<svg xmlns="http://www.w3.org/2000/svg" width="640" height="909" viewBox="0 0 640 909" role="img" aria-labelledby="trading-price-and-settlement-costs-title trading-price-and-settlement-costs-desc" focusable="false">
<title id="trading-price-and-settlement-costs-title">Price and costs are different inputs</title>
<desc id="trading-price-and-settlement-costs-desc">Oracle price determines price PnL. Fees, carry, VPI and frozen spread are separate action economics, not a synthetic execution price. Do not treat a displayed price change as net profit or a guarantee of immediately withdrawable USDG.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="909" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · TRADE ECONOMICS</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Price and costs are different</text>
<text x="32" y="150" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">inputs</text>
<path d="M32 180 L608 180" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 180 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<rect x="32" y="206" width="278" height="271" rx="12" fill="#3B212D" stroke="#FFAB96" stroke-width="1.5"/>
<rect x="44" y="209" width="254" height="5" rx="3" fill="#FFAB96" stroke="none"/>
<text x="48" y="248" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="246">Price PnL</text>
<path d="M48 265 L294 265" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="291" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Oracle price +</text>
<text x="48" y="321" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">position</text>
<text x="48" y="357" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Side, exact entry</text>
<text x="48" y="387" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">cost and quantity</text>
<text x="48" y="417" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">determine price gain</text>
<text x="48" y="447" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">or loss.</text>
<rect x="330" y="206" width="278" height="271" rx="12" fill="#3B212D" stroke="#F7D977" stroke-width="1.5"/>
<rect x="342" y="209" width="254" height="5" rx="3" fill="#F7D977" stroke="none"/>
<text x="346" y="248" font-size="24" font-weight="700" fill="#F7D977" data-max-width="246">Action economics</text>
<path d="M346 265 L592 265" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="291" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Fees + carry + VPI</text>
<text x="346" y="327" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Add frozen-close</text>
<text x="346" y="357" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">spread when</text>
<text x="346" y="387" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">applicable. VPI can be</text>
<text x="346" y="417" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">signed.</text>
<circle cx="47" cy="514" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="514" r="5" fill="#9A8890"/>
<text x="78" y="523" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Collect carry first</text>
<text x="78" y="556" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Active position margin first, then eligible free</text>
<text x="78" y="586" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">USDG.</text>
<path d="M47 533 V610 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="633" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="633" r="5" fill="#9A8890"/>
<text x="78" y="642" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Settle the close</text>
<text x="78" y="675" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Unpaid carry joins fees, VPI and spread.</text>
<text x="78" y="705" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Remaining price losses and action charges use</text>
<text x="78" y="735" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">their respective backing.</text>
<rect x="32" y="759" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="769" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="793" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Do not treat a displayed price change as net</text>
<text x="56" y="823" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">profit or a guarantee of immediately</text>
<text x="56" y="853" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">withdrawable USDG.</text>
</svg>
