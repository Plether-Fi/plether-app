name: Deploy Backend

on:
  push:
    branches: [master]
    paths: [apps/backend/**]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sepolia
          - mainnet

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TARGET_ENV: ${{ github.event_name == 'push' && 'mainnet' || inputs.environment }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      log_router_image: ${{ steps.build.outputs.log_router_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application and log router images
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$TARGET_ENV" = "mainnet" ]; then
            ECR_REPOSITORY=plether-api
            LOG_ROUTER_REPOSITORY=plether-otel-log-router
          else
            ECR_REPOSITORY=plether-api-$TARGET_ENV
            LOG_ROUTER_REPOSITORY=plether-otel-log-router-$TARGET_ENV
          fi

          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          LOG_ROUTER_IMAGE=$ECR_REGISTRY/$LOG_ROUTER_REPOSITORY:$IMAGE_TAG
          docker buildx build \
            --platform linux/arm64 \
            -f apps/backend/Dockerfile \
            -t $IMAGE \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            .

          docker buildx build \
            --platform linux/arm64 \
            -f apps/backend/otel-log-router/Dockerfile \
            -t $LOG_ROUTER_IMAGE \
            -t $ECR_REGISTRY/$LOG_ROUTER_REPOSITORY:latest \
            --push \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "log_router_image=$LOG_ROUTER_IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJson((github.event_name == 'push' || inputs.environment == 'mainnet') && '[{"environment":"mainnet","task_suffix":"","service_name":"plether-api","container_name":"plether-api"},{"environment":"mainnet","task_suffix":"-workers","service_name":"plether-workers","container_name":"plether-keeper"}]' || '[{"environment":"sepolia","task_suffix":"","service_name":"plether-api","container_name":"plether-api"},{"environment":"sepolia","task_suffix":"-workers","service_name":"plether-workers","container_name":"plether-keeper"}]') }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition plether-${{ matrix.environment }}${{ matrix.task_suffix }} \
            --query taskDefinition > task-def.json

      - name: Patch Sepolia task definition network
        if: matrix.environment == 'sepolia' && matrix.task_suffix == ''
        run: |
          jq \
            --arg container "${{ matrix.container_name }}" \
            '
            def upsert_env($name; $value):
              .environment = (
                ((.environment // []) | map(select(.name != $name)))
                + [{"name": $name, "value": $value}]
              );
            def upsert_secret($name; $valueFrom):
              .secrets = (
                ((.secrets // []) | map(select(.name != $name)))
                + [{"name": $name, "valueFrom": $valueFrom}]
              );

            .containerDefinitions |= map(
              if .name == $container then
                (.secrets // [] | map(select(.name == "PERPS_RPC_URL")) | .[0].valueFrom) as $rpcSecret
                |
                upsert_env("CHAIN_ID"; "421614")
                | upsert_env("INDEXER_START_BLOCK"; "280884700")
                | upsert_secret("RPC_URL"; $rpcSecret)
              else
                .
              end
            )
            ' task-def.json > task-def.patched.json
          mv task-def.patched.json task-def.json

      - name: Update application images and service version
        env:
          APPLICATION_IMAGE: ${{ needs.build.outputs.image }}
          SERVICE_VERSION: ${{ github.sha }}
        run: |
          jq \
            --arg applicationImage "$APPLICATION_IMAGE" \
            --arg serviceVersion "$SERVICE_VERSION" \
            '
            def upsert_env($name; $value):
              .environment = (
                ((.environment // []) | map(select(.name != $name)))
                + [{"name": $name, "value": $value}]
              );

            .containerDefinitions |= map(
              if .name == "otel-log-router" then
                upsert_env("SERVICE_VERSION"; $serviceVersion)
              else
                .image = $applicationImage
              end
            )
            ' task-def.json > task-def.updated.json
          mv task-def.updated.json task-def.json

      - name: Update log router image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: otel-log-router
          image: ${{ needs.build.outputs.log_router_image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service_name }}
          cluster: plether-${{ matrix.environment }}
          wait-for-service-stability: true
