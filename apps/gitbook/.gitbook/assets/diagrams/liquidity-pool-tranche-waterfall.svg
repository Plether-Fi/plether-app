<svg xmlns="http://www.w3.org/2000/svg" width="640" height="852" viewBox="0 0 640 852" role="img" aria-labelledby="liquidity-pool-tranche-waterfall-title liquidity-pool-tranche-waterfall-desc" focusable="false">
<title id="liquidity-pool-tranche-waterfall-title">The Senior–Junior waterfall</title>
<desc id="liquidity-pool-tranche-waterfall-desc">Reconciliation compares distributable assets after trader liabilities with claimant principal. Losses hit Junior first; revenue restores Senior impairment before reaching Junior. The Senior coupon is a separate Junior-to-Senior transfer, capped by available Junior principal. Senior is last-loss, not risk-free.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="852" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / LIQUIDITY PROVIDERS</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">The Senior–Junior waterfall</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Distributable pool value</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Reconcile value after trader liabilities.</text>
<rect x="32" y="258" width="278" height="378" rx="12" fill="#FFAB96" stroke="none"/>
<text x="48" y="300" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Loss</text>
<path d="M48 321 L294 321" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="351" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Junior first</text>
<text x="48" y="390" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Absorb loss up to</text>
<text x="48" y="422" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Junior principal.</text>
<path d="M56 439 V458 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="502" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Senior second</text>
<text x="48" y="541" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Absorb only the</text>
<text x="48" y="573" font-size="24" font-weight="400" fill="#250917" data-max-width="246">remaining loss.</text>
<rect x="330" y="258" width="278" height="378" rx="12" fill="#FFF5F9" stroke="#9A8890"/>
<rect x="342" y="262" width="254" height="6" rx="3" fill="#00FF99" stroke="none"/>
<text x="346" y="300" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Revenue</text>
<path d="M346 321 L592 321" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="351" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Restore Senior</text>
<text x="346" y="390" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Fill impairment up to</text>
<text x="346" y="422" font-size="24" font-weight="400" fill="#250917" data-max-width="246">its high-water mark.</text>
<path d="M354 439 V458 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="502" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Junior receives</text>
<text x="346" y="535" font-size="26" font-weight="700" fill="#250917" data-max-width="246">the rest</text>
<text x="346" y="574" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Residual revenue</text>
<text x="346" y="606" font-size="24" font-weight="400" fill="#250917" data-max-width="246">accrues to Junior.</text>
<rect x="32" y="660" width="576" height="160" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="698" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">The Senior coupon is a separate</text>
<text x="50" y="730" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Junior-to-Senior transfer, capped by</text>
<text x="50" y="762" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">available Junior principal. Senior is last-loss,</text>
<text x="50" y="794" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">not risk-free.</text>
</svg>
