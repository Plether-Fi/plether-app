<text x="214" y="248" font-size="22" font-weight="700" fill="#250917" data-max-width="68" text-anchor="middle">30m</text>
<rect x="254" y="216" width="162" height="46" rx="6" fill="#FF512F" stroke="none"/>
<text x="335" y="248" font-size="22" font-weight="700" fill="#250917" data-max-width="158" text-anchor="middle">Frozen</text>
<rect x="420" y="216" width="72" height="46" rx="6" fill="#F7D977" stroke="none"/>
<text x="456" y="248" font-size="22" font-weight="700" fill="#250917" data-max-width="68" text-anchor="middle">15m</text>
<rect x="496" y="216" width="92" height="46" rx="6" fill="#00FF99" stroke="none"/>
<text x="542" y="248" font-size="22" font-weight="700" fill="#250917" data-max-width="88" text-anchor="middle">Open</text>
<path d="M176 264 L176 278" stroke="#F7D977" stroke-width="2" fill="none"/>
<path d="M252 264 L252 310" stroke="#FF512F" stroke-width="2" fill="none"/>
<path d="M418 264 L418 278" stroke="#FF512F" stroke-width="2" fill="none"/>
<path d="M494 264 L494 310" stroke="#00FF99" stroke-width="2" fill="none"/>
<text x="176" y="302" font-size="22" font-weight="700" fill="#F7D977" data-max-width="130" text-anchor="middle">Fri 16:30</text>
<text x="252" y="334" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="130" text-anchor="middle">Fri 17:00</text>
<text x="418" y="302" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="130" text-anchor="middle">Sun 17:00</text>
<text x="480" y="334" font-size="22" font-weight="700" fill="#00FF99" data-max-width="130" text-anchor="middle">Sun 17:15</text>
<circle cx="47" cy="395" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="395" r="5" fill="#00FF99"/>
<text x="78" y="404" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Open</text>
<text x="78" y="437" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Sunday 17:15 → Friday 16:30</text>
