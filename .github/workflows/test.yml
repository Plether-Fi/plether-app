name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  credential-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed Alchemy endpoint credentials
        working-directory: .
        run: |
          set -euo pipefail
          matches="$(git grep -nEo '(https|wss)://[A-Za-z0-9.-]+\.g\.alchemy\.com/v2/[A-Za-z0-9_-]{8,}' -- . || true)"
          unsafe="$(printf '%s\n' "$matches" | grep -v '/v2/YOUR_KEY$' || true)"
          if [ -n "$unsafe" ]; then
            printf '%s\n' "$unsafe"
            echo 'Committed Alchemy endpoint credential detected.' >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Insights story dependencies
        working-directory: apps/insights
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  insights:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/insights

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/insights/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
