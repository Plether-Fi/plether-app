<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1168" viewBox="0 0 640 1168" role="img" aria-labelledby="sponsorship-vs-order-failure-lifecycles-title sponsorship-vs-order-failure-lifecycles-desc" focusable="false">
<title id="sponsorship-vs-order-failure-lifecycles-title">Two lifecycles, different failures</title>
<desc id="sponsorship-vs-order-failure-lifecycles-desc">Sponsored transaction success and order execution are different lifecycles. Transient oracle, gas, engine or receipt failures can remain pending; only terminal reasons fail the order. A revert, dropped operation or unknown outcome is not proof that an order exists. Reconcile its receipt and client order ID. An engine panic is not automatically a terminal order failure. Read the stored order receipt and pending reason.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1168" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · ORDER TROUBLESHOOTING</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Two lifecycles, different</text>
<text x="32" y="150" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">failures</text>
<path d="M32 180 L608 180" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 180 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<text x="32" y="236" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">01 · Sponsored transaction</text>
<circle cx="47" cy="272" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="272" r="5" fill="#FFAB96"/>
<text x="78" y="281" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Prepare → sign → submit</text>
<text x="78" y="314" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">An inclusion receipt must confirm successful</text>
<text x="78" y="344" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">execution.</text>
<rect x="32" y="368" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="378" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="402" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">A revert, dropped operation or unknown</text>
<text x="56" y="432" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">outcome is not proof that an order exists.</text>
<text x="56" y="462" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Reconcile its receipt and client order ID.</text>
<text x="32" y="536" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">02 · Delayed order</text>
<rect x="32" y="557" width="278" height="439" rx="12" fill="#3B212D" stroke="#F7D977" stroke-width="1.5"/>
<rect x="44" y="560" width="254" height="5" rx="3" fill="#F7D977" stroke="none"/>
<text x="48" y="599" font-size="24" font-weight="700" fill="#F7D977" data-max-width="246">Still pending</text>
<path d="M48 616 L294 616" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="642" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Temporary blockers</text>
<text x="48" y="678" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Queue, oracle timing,</text>
<text x="48" y="708" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">insufficient gas,</text>
<text x="48" y="738" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">engine or receipt</text>
<text x="48" y="768" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">failure.</text>
<rect x="330" y="557" width="278" height="439" rx="12" fill="#3B212D" stroke="#FF512F" stroke-width="1.5"/>
<rect x="342" y="560" width="254" height="5" rx="3" fill="#FF512F" stroke="none"/>
<text x="346" y="599" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="246">Terminal result</text>
<path d="M346 616 L592 616" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="642" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Executed</text>
<text x="346" y="678" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">The requested trade</text>
<text x="346" y="708" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">was applied.</text>
<path d="M346 736 L443 736" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="469" y="744" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="48" text-anchor="middle">OR</text>
<path d="M495 736 L592 736" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="780" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Failed</text>
<text x="346" y="816" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Expiry, slippage,</text>
<text x="346" y="846" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">config or mode</text>
<text x="346" y="876" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">mismatch, risk-off,</text>
<text x="346" y="906" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">planner or constraint</text>
<text x="346" y="936" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">rejection,</text>
<text x="346" y="966" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">liquidation.</text>
<rect x="32" y="1018" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="1028" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="1052" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">An engine panic is not automatically a terminal</text>
<text x="56" y="1082" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">order failure. Read the stored order receipt</text>
<text x="56" y="1112" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">and pending reason.</text>
</svg>
