name: Mirror Kernel Alto canary image
run-name: Kernel Alto image / Sepolia / ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed kernel-canary PR head commit SHA
        required: true
        type: string
      pr_number:
        description: Open same-repository PR containing the reviewed candidate commit
        required: true
        type: string

concurrency:
  group: plether-kernel-alto-image-sepolia
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ADMIN_ENVIRONMENT: alto-admin-sepolia
  ECR_REPOSITORY: plether-kernel-alto-sepolia
  UPSTREAM_COMMIT: 37cade5d2804a60ab30362ea27054514e1d7a7c8
  UPSTREAM_ALTO_IMAGE: ghcr.io/pimlicolabs/alto:v1.2.8@sha256:b37c5697bc5331391cb8bc5ac6e828d15019fc786c58a33a8650ff3c434ac2aa

jobs:
  reviewed-candidate-preflight:
    name: Require exact canary PR and protected environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Require exact same-repository canary PR head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REF" = refs/heads/master ] || {
            echo '::error::Dispatch the canary image workflow from master only.'
            exit 1
          }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::candidate_sha must be a full lowercase commit SHA.'
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::pr_number must be a positive decimal PR number.'
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/kernel-alto-pr.json"
          jq --exit-status --arg repo "$GITHUB_REPOSITORY" --arg sha "$CANDIDATE_SHA" \
            '.state == "open" and .base.ref == "master"
             and .head.repo.full_name == $repo and .head.sha == $sha
             and (.head.ref | test("^kernel-canary/[a-z0-9][a-z0-9._-]{0,63}$"))' \
            "$RUNNER_TEMP/kernel-alto-pr.json" >/dev/null || {
              echo '::error::Candidate must be the exact current head of an open same-repository kernel-canary PR targeting master.'
              exit 1
            }

      - name: Verify existing Alto protection policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_file="$RUNNER_TEMP/alto-admin-environment.json"
          branch_policy_file="$RUNNER_TEMP/alto-admin-branches.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/environments/$ADMIN_ENVIRONMENT" > "$environment_file"
          gh api --method GET "repos/$GITHUB_REPOSITORY/environments/$ADMIN_ENVIRONMENT/deployment-branch-policies?per_page=100" > "$branch_policy_file"
          jq --exit-status --arg name "$ADMIN_ENVIRONMENT" \
            '.name == $name
             and .can_admins_bypass == false
             and ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 1
             and ([.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review == false)
             and ([.protection_rules[]? | select(.type == "required_reviewers")][0].reviewers | length) > 0
             and .deployment_branch_policy.custom_branch_policies == true' \
            "$environment_file" >/dev/null
          jq --exit-status \
            '.branch_policies | length == 1 and .[0].name == "master" and .[0].type == "branch"' \
            "$branch_policy_file" >/dev/null

  build:
    name: Mirror, scan and pin v0.9 canary image
    needs: reviewed-candidate-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: alto-admin-sepolia
    permissions:
      contents: read
      deployments: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out exact reviewed qualification pins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          sparse-checkout: scripts/kernel-qualification/pins.json
          sparse-checkout-cone-mode: false

      - name: Verify the candidate pins the upstream ARM64 image
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ]
          jq -e --arg image "$UPSTREAM_ALTO_IMAGE" --arg commit "$UPSTREAM_COMMIT" \
            '.alto.image == $image and .alto.commit == $commit' scripts/kernel-qualification/pins.json >/dev/null || {
            echo '::error::The candidate must pin the reviewed upstream ARM64 Alto image and commit.'
            exit 1
          }
          upstream="docker://${UPSTREAM_ALTO_IMAGE%%:*}@${UPSTREAM_ALTO_IMAGE##*@}"
          manifest="$RUNNER_TEMP/alto-arm64-manifest.json"
          skopeo inspect --raw "$upstream" > "$manifest"
          [ "$(skopeo manifest-digest "$manifest")" = "${UPSTREAM_ALTO_IMAGE##*@}" ]
          skopeo inspect --config "$upstream" | jq -e --arg commit "$UPSTREAM_COMMIT" \
            '.os == "linux" and .architecture == "arm64" and .config.Labels["org.opencontainers.image.revision"] == $commit' >/dev/null

      - name: Recheck PR head after resolving the upstream image
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/kernel-alto-pr-recheck.json"
          jq --exit-status --arg repo "$GITHUB_REPOSITORY" --arg sha "$CANDIDATE_SHA" \
            '.state == "open" and .base.ref == "master"
             and .head.repo.full_name == $repo and .head.sha == $sha
             and (.head.ref | test("^kernel-canary/[a-z0-9][a-z0-9._-]{0,63}$"))' \
            "$RUNNER_TEMP/kernel-alto-pr-recheck.json" >/dev/null || {
              echo '::error::The reviewed PR head changed during image resolution.'
              exit 1
            }

      - name: Require the isolated canary image role
        env:
          CANARY_ROLE_ARN: ${{ vars.KERNEL_CANARY_BUILD_ROLE_ARN }}
          TARGET_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ "$TARGET_ACCOUNT_ID" = 932542905614 ] || {
            echo '::error::The protected environment targets the wrong AWS account.'
            exit 1
          }
          [ "$CANARY_ROLE_ARN" = "arn:aws:iam::$TARGET_ACCOUNT_ID:role/plether-sepolia-kernel-canary-image-build" ] || {
            echo '::error::Set KERNEL_CANARY_BUILD_ROLE_ARN in the protected environment to the dedicated canary ECR role.'
            exit 1
          }

      - name: Configure AWS credentials for ECR only
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.KERNEL_CANARY_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: plether-kernel-alto-${{ github.run_id }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push immutable isolated canary tag
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/kernel-alto-pr-before-push.json"
          jq --exit-status --arg repo "$GITHUB_REPOSITORY" --arg sha "$CANDIDATE_SHA" \
            '.state == "open" and .base.ref == "master"
             and .head.repo.full_name == $repo and .head.sha == $sha
             and (.head.ref | test("^kernel-canary/[a-z0-9][a-z0-9._-]{0,63}$"))' \
            "$RUNNER_TEMP/kernel-alto-pr-before-push.json" >/dev/null || {
              echo '::error::The reviewed PR head changed before ECR publication.'
              exit 1
            }
          [ "$(aws sts get-caller-identity --query Account --output text --no-cli-pager)" = '${{ vars.AWS_ACCOUNT_ID }}' ]
          [ "$AWS_REGION" = ap-southeast-1 ]
          tag="kernel-v09-managed-${CANDIDATE_SHA:0:12}"
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$tag"
          expected_digest=${UPSTREAM_ALTO_IMAGE##*@}
          upstream="docker://${UPSTREAM_ALTO_IMAGE%%:*}@$expected_digest"
          if existing_digest=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$tag" \
              --query 'imageDetails[0].imageDigest' \
              --output text --no-cli-pager 2> "$RUNNER_TEMP/alto-image-lookup.error"); then
            [ "$existing_digest" = "$expected_digest" ] || {
              echo '::error::The immutable canary tag already has different image content.'
              exit 1
            }
          elif grep -Fq ImageNotFoundException "$RUNNER_TEMP/alto-image-lookup.error"; then
            skopeo copy --preserve-digests --dest-authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
              "$upstream" "docker://$image"
          else
            echo '::error::Could not verify the canary image tag in ECR.'
            exit 1
          fi
          digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text --no-cli-pager)
          [ "$digest" = "$expected_digest" ] || {
            echo '::error::The ECR manifest must retain the exact upstream ARM64 digest.'
            exit 1
          }
          printf 'image=%s@%s\n' "$ECR_REGISTRY/$ECR_REPOSITORY" "$digest" >> "$GITHUB_ENV"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Require a complete scan without critical findings
        env:
          TARGET_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          scan_error="$RUNNER_TEMP/alto-image-scan.error"
          if ! aws ecr start-image-scan \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="$digest" --no-cli-pager \
              >/dev/null 2> "$scan_error"; then
            grep -Eq 'LimitExceededException|ScanAlreadyExistsException' "$scan_error" || {
              echo '::error::Could not start the canary image scan.'
              exit 1
            }
          fi
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="$digest" --no-cli-pager
          aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="$digest" \
            --output json --no-cli-pager > "$RUNNER_TEMP/alto-image-scan.json"
          jq --exit-status --arg digest "$digest" --arg repository "$ECR_REPOSITORY" --arg account "$TARGET_ACCOUNT_ID" \
            '.repositoryName == $repository
             and .registryId == $account
             and .imageId.imageDigest == $digest
             and .imageScanStatus.status == "COMPLETE"
             and (.imageScanFindings | type) == "object"
             and (.imageScanFindings.findingSeverityCounts.CRITICAL // 0) == 0
             and (.nextToken == null or .nextToken == "")' \
            "$RUNNER_TEMP/alto-image-scan.json" >/dev/null || {
              echo '::error::The canary image scan is incomplete or has critical findings.'
              exit 1
            }
          printf 'Mirrored upstream `%s` from Alto source `%s` and scanned `%s` for candidate `%s`.\n' \
            "$UPSTREAM_ALTO_IMAGE" "$UPSTREAM_COMMIT" "$image" '${{ inputs.candidate_sha }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'This workflow does not deploy or change the existing v0.8 Alto service.\n' >> "$GITHUB_STEP_SUMMARY"
