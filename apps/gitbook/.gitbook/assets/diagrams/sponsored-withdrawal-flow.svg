<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="sponsored-withdrawal-flow-title sponsored-withdrawal-flow-desc" focusable="false">
<title id="sponsored-withdrawal-flow-title">Withdraw to your owner wallet</title>
<desc id="sponsored-withdrawal-flow-desc">Review the free amount and verified owner recipient, prepare sponsorship, sign and confirm. Withdrawal remains subject to onchain account-health and balance checks. The contract rechecks balances and account health. An estimate or wallet signature alone does not complete a withdrawal.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="750" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · MARGIN WITHDRAWAL</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Withdraw to your owner wallet</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Choose an eligible amount</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Use Withdrawable, not total collateral or</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">unrealized profit.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#9A8890"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Verify the recipient</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Check the Trading Account and displayed</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">owner wallet.</text>
<path d="M47 315 V392 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="415" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="415" r="5" fill="#FFAB96"/>
<text x="78" y="424" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Prepare and sign</text>
<text x="78" y="457" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Authorize the sponsored withdrawal.</text>
<path d="M47 434 V481 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="504" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="504" r="5" fill="#00FF99"/>
<text x="78" y="513" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Confirm receipt</text>
<text x="78" y="546" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">After successful execution, check</text>
<text x="78" y="576" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">owner-wallet USDG.</text>
<rect x="32" y="600" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="610" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="634" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">The contract rechecks balances and account</text>
<text x="56" y="664" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">health. An estimate or wallet signature alone</text>
<text x="56" y="694" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">does not complete a withdrawal.</text>
</svg>
