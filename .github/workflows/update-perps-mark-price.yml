name: Update Perps Mark Price

on:
  workflow_dispatch:

concurrency:
  group: update-perps-mark-price
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update Arbitrum Sepolia mark price from backend cache
        env:
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          PERPS_RPC_AUTH_TOKEN: ${{ secrets.PERPS_RPC_AUTH_TOKEN }}
          PERPS_ORACLE_UPDATER_PRIVATE_KEY: ${{ secrets.PERPS_ORACLE_UPDATER_PRIVATE_KEY }}
          PERPS_ORACLE_UPDATER_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
          PERPS_ORACLE_UPDATER_MAX_PAYLOAD_AGE_SECONDS: '120'
        run: node scripts/perps-oracle-worker.mjs
