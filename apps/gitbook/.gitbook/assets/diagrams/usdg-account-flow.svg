<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1077" viewBox="0 0 640 1077" role="img" aria-labelledby="usdg-account-flow-title usdg-account-flow-desc" focusable="false">
<title id="usdg-account-flow-title">USDG has distinct places to live</title>
<desc id="usdg-account-flow-desc">Testnet faucet USDG credits the Margin Account directly; existing wallet USDG deposits through the Trading Account. Free funds, PnL pledge and reserves have distinct permissions. Carry consumes active position margin before free USDG. A deposit need not pass through a trade before withdrawal, but account-health checks still apply.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1077" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · ACCOUNT BALANCES</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">USDG has distinct places to live</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Faucet or owner wallet</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Get 100,000 USDG credits Margin Account</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">directly; existing wallet USDG uses Transfer &amp;</text>
<text x="78" y="279" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Deposit.</text>
<path d="M47 196 V303 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="326" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="326" r="5" fill="#FFAB96"/>
<text x="78" y="335" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Deposit margin</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">USDG enters the Margin Clearinghouse.</text>
<text x="32" y="416" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">Internal account balances</text>
<rect x="32" y="437" width="576" height="82" rx="8" fill="#3B212D" stroke="#FFAB96" stroke-width="1"/>
<rect x="36" y="445" width="4" height="66" rx="2" fill="#FFAB96" stroke="none"/>
<text x="54" y="468" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Free USDG — eligible for actions and carry</text>
<text x="54" y="498" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">after active margin</text>
<rect x="32" y="529" width="576" height="82" rx="8" fill="#3B212D" stroke="#FFAB96" stroke-width="1"/>
<rect x="36" y="537" width="4" height="66" rx="2" fill="#FFAB96" stroke="none"/>
<text x="54" y="560" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Position margin — backs price risk and pays</text>
<text x="54" y="590" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">carry first</text>
<rect x="32" y="621" width="576" height="52" rx="8" fill="#3B212D" stroke="#FFAB96" stroke-width="1"/>
<rect x="36" y="629" width="4" height="36" rx="2" fill="#FFAB96" stroke="none"/>
<text x="54" y="652" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Action, order and liquidation reserves</text>
<rect x="32" y="697" width="576" height="148" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="707" width="5" height="128" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="731" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Carry consumes active position margin before</text>
<text x="56" y="761" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">free USDG. A deposit need not pass through a</text>
<text x="56" y="791" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">trade before withdrawal, but account-health</text>
<text x="56" y="821" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">checks still apply.</text>
<circle cx="47" cy="880" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="880" r="5" fill="#9A8890"/>
<text x="78" y="889" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Withdraw eligible free USDG</text>
<text x="78" y="922" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Subject to reserves, carry and</text>
<text x="78" y="952" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">account-health checks.</text>
<path d="M47 899 V976 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="999" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="999" r="5" fill="#00FF99"/>
<text x="78" y="1008" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Owner wallet receives USDG</text>
<text x="78" y="1041" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">After the sponsored withdrawal succeeds.</text>
</svg>
