<title id="settlement-liquidity-flow-title">Close settlement and liquidity flow</title>
<desc id="settlement-liquidity-flow-description">A close releases assigned margin and calculates settlement. Positive settlement becomes Margin Account credit or a trader claim depending on HousePool cash after existing claims; zero or negative settlement collects reachable collateral, nets a same-account claim, and records only genuine base-obligation bad debt.</desc>
