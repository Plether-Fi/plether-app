name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vault-return-attribution:
    name: Vault return attribution tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attribution_test
          POSTGRES_PASSWORD: attribution_test
          POSTGRES_DB: attribution_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=512m
          --health-cmd "pg_isready -U attribution_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend/return-attribution
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/return-attribution/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          ATTRIBUTION_TEST_DATABASE_URL: postgres://attribution_test:attribution_test@127.0.0.1:5432/attribution_test

  protection-worker:
    name: Protection worker tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: protection_test
          POSTGRES_PASSWORD: protection_test
          POSTGRES_DB: protection_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=512m
          --health-cmd "pg_isready -U protection_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend/protection-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/protection-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          PROTECTION_TEST_DATABASE_URL: postgres://protection_test:protection_test@127.0.0.1:5432/protection_test

  credential-hygiene:
    name: Credential hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject committed Alchemy endpoint credentials
        working-directory: .
        run: |
          set -euo pipefail
          matches="$(git grep -nEo '(https|wss)://[A-Za-z0-9.-]+\.g\.alchemy\.com/v2/[A-Za-z0-9_-]{8,}' -- . || true)"
          unsafe="$(printf '%s\n' "$matches" | grep -v '/v2/YOUR_KEY$' || true)"
          if [ -n "$unsafe" ]; then
            printf '%s\n' "$unsafe" | sed -E 's@(https|wss)://([A-Za-z0-9.-]+\.g\.alchemy\.com)/v2/[A-Za-z0-9_-]+@\1://\2/v2/<redacted>@g'
            echo 'Committed Alchemy endpoint credential detected.' >&2
            exit 1
          fi

  frontend-lint-build:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/insights/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'

      - name: Pin npm to the frontend deployment version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Insights story dependencies
        working-directory: apps/insights
        run: npm ci --no-audit --no-fund

      - name: Cache ESLint and TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: |
            apps/frontend/.eslintcache
            apps/frontend/node_modules/.tmp
          key: ubuntu-24.04-frontend-lint-build-${{ hashFiles('apps/frontend/package-lock.json', 'apps/frontend/eslint.config.js', 'apps/frontend/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-frontend-lint-build-${{ hashFiles('apps/frontend/package-lock.json', 'apps/frontend/eslint.config.js', 'apps/frontend/tsconfig*.json') }}-

      - name: Lint
        run: npx eslint . --cache --cache-location .eslintcache

      - name: Build
        run: npm run build

  frontend-unit-tests:
    name: Frontend unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'

      - name: Pin npm to the frontend deployment version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check AA package migration tooling
        if: matrix.shard == 1
        working-directory: .
        run: node --test scripts/migrate-perps-aa-client.test.mjs scripts/perps-aa-rollout.test.mjs scripts/aa-preparation-benchmark.test.mjs scripts/prepare-perps-release.test.mjs scripts/perps-v2-release.test.mjs scripts/install-foundry-ci.test.mjs

      - name: Check Kernel qualification against the shared deployment fixture
        if: matrix.shard == 1
        working-directory: .
        run: node --test scripts/kernel-qualification/live-gas.test.mjs scripts/kernel-qualification/nitro-sepolia-gas.test.mjs

      - name: Verify Sepolia canary funding invariants
        if: matrix.shard == 1
        working-directory: .
        run: node --test scripts/kernel-qualification/bridge-sepolia.test.mjs scripts/kernel-qualification/verify-topup.test.mjs

      - name: Run Vitest unit shard
        run: npx vitest run --project unit --shard=${{ matrix.shard }}/2

      - name: Run remaining frontend test suites
        if: matrix.shard == 1
        run: |
          node --test ../../scripts/patch-privy-wallet-dialog.test.mjs
          npm run test:wallet-integration
          npm run test:worker
          npm run test:mainnet-redirect
          npm run test:deploy-validator
          npm run test:diagnostics

  aa-execution-regressions:
    name: AA execution regressions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'

      - name: Pin npm to the frontend deployment version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned local EVM for AA execution regressions
        id: foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.1

      - name: Install verified pinned Foundry through the GitHub API if release downloads fail
        if: steps.foundry.outcome == 'failure'
        working-directory: .
        run: node scripts/install-foundry-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install the compiler for the production gas-policy adapter
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: 'latest'
          cabal-update: false

      - name: Require real-contract AA execution regressions (offline)
        working-directory: .
        run: node --test scripts/aa-execution-regression.test.mjs

  aa-core-regressions:
    name: AA Core ABI, quoter and lifecycle regressions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned local EVM for Core regressions
        id: foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.1

      - name: Install verified pinned Foundry through the GitHub API if release downloads fail
        if: steps.foundry.outcome == 'failure'
        working-directory: .
        run: node scripts/install-foundry-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch the deployed Core lifecycle source
        uses: actions/checkout@v4
        with:
          repository: Plether-Fi/plether-core
          ref: 1209ca8a5b94a4fb6323c7c4585846ed93db3932
          path: .ci-core
          submodules: recursive
          persist-credentials: false

      - name: Cache pinned Core Solidity compiler and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            ~/.cache/svm
            .ci-core/packages/perps/out
            .ci-core/packages/perps/cache
            .ci-aa-lifecycle-cache
          key: ubuntu-24.04-foundry-v1.5.1-core-1209ca8a5b94a4fb6323c7c4585846ed93db3932-${{ hashFiles('scripts/fixtures/**') }}
          restore-keys: |
            ubuntu-24.04-foundry-v1.5.1-core-1209ca8a5b94a4fb6323c7c4585846ed93db3932-

      - name: Compile pinned Core contracts (no RPC)
        working-directory: .ci-core/packages/perps
        run: forge build --skip test --skip script

      - name: Verify and test the deployless maximum-size quoter (no RPC)
        run: |
          npm run verify:max-open-quoter
          npm run test:max-open-quoter

      - name: Verify generated v2 consumer ABIs
        working-directory: .
        run: node scripts/generate-perps-consumer-abis.mjs --artifacts-dir .ci-core/packages/perps/out --source-root .ci-core/packages/perps --check

      - name: Require AA lifecycle, bounty drift and keeper gas regressions (offline)
        working-directory: .
        env:
          PLETHER_AA_LIFECYCLE_CACHE_DIR: ${{ github.workspace }}/.ci-aa-lifecycle-cache
        run: node scripts/aa-lifecycle-regression.mjs .ci-core

  test:
    name: Frontend unit and build
    needs: [frontend-lint-build, frontend-unit-tests, aa-execution-regressions, aa-core-regressions]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All frontend unit, build, and AA regression checks passed."

  insights:
    name: Insights unit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/insights

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/insights/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache ESLint and TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: |
            apps/insights/.eslintcache
            apps/insights/node_modules/.tmp
          key: ubuntu-latest-insights-lint-build-${{ hashFiles('apps/insights/package-lock.json', 'apps/insights/eslint.config.js', 'apps/insights/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-latest-insights-lint-build-${{ hashFiles('apps/insights/package-lock.json', 'apps/insights/eslint.config.js', 'apps/insights/tsconfig*.json') }}-

      - name: Lint
        run: npx eslint . --cache --cache-location .eslintcache

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
