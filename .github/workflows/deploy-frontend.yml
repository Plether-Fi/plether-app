name: Deploy Frontend

on:
  push:
    branches: [master]
    paths: [apps/frontend/**]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sepolia
          - mainnet

env:
  TARGET_ENV: ${{ github.event_name == 'push' && 'mainnet' || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$TARGET_ENV" = "sepolia" ]; then
            echo "project=plether-testnet" >> "$GITHUB_OUTPUT"
            echo "default_chain_id=11155111" >> "$GITHUB_OUTPUT"
          else
            echo "project=plether" >> "$GITHUB_OUTPUT"
            echo "default_chain_id=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: apps/frontend
        env:
          VITE_DEFAULT_CHAIN_ID: ${{ steps.target.outputs.default_chain_id }}
        run: npm run build

      - name: Configure testnet Pages bindings
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          test -n "$SEPOLIA_BACKEND_URL"
          cat > wrangler.toml <<EOF
          name = "plether-testnet"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-06-22"

          [vars]
          SEPOLIA_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.target.outputs.project }} --branch=master --cwd=apps/frontend
