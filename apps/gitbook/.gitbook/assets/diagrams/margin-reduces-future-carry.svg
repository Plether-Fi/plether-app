<svg xmlns="http://www.w3.org/2000/svg" width="640" height="725" viewBox="0 0 640 725" role="img" aria-labelledby="margin-reduces-future-carry-title margin-reduces-future-carry-desc" focusable="false">
<title id="margin-reduces-future-carry-title">More pledge, less borrowed backing</title>
<desc id="margin-reduces-future-carry-desc">For the same maximum-profit exposure, more assigned PnL pledge lowers max(maximum profit minus pledge, zero), reducing future carry at a given index growth. Holding other conditions equal. Free USDC alone is not assigned pledge; adding margin does not undo carry already accrued.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="725" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / CARRY</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">More pledge, less borrowed</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">backing</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="233" r="14" fill="#FF512F"/>
<circle cx="47" cy="233" r="5" fill="#250917"/>
<text x="80" y="242" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Add assigned PnL pledge</text>
<text x="80" y="279" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Increase the margin backing this position.</text>
<path d="M47 254 V303 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="332" r="14" fill="#9A8890"/>
<circle cx="47" cy="332" r="5" fill="#250917"/>
<text x="80" y="341" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Reduce the borrow base</text>
<text x="80" y="378" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Borrow base = max(maximum profit − pledge,</text>
<text x="80" y="410" font-size="24" font-weight="400" fill="#250917" data-max-width="528">0).</text>
<path d="M47 353 V434 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="463" r="14" fill="#00FF99"/>
<circle cx="47" cy="463" r="5" fill="#250917"/>
<text x="80" y="472" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Lower future carry</text>
<text x="80" y="509" font-size="24" font-weight="400" fill="#250917" data-max-width="528">At the same carry-index growth, less</text>
<text x="80" y="541" font-size="24" font-weight="400" fill="#250917" data-max-width="528">borrowed backing accrues less carry.</text>
<rect x="32" y="565" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="603" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Holding other conditions equal. Free USDC</text>
<text x="50" y="635" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">alone is not assigned pledge; adding margin</text>
<text x="50" y="667" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">does not undo carry already accrued.</text>
</svg>
