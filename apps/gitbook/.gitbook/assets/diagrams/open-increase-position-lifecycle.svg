<svg xmlns="http://www.w3.org/2000/svg" width="640" height="976" viewBox="0 0 640 976" role="img" aria-labelledby="open-increase-position-lifecycle-title open-increase-position-lifecycle-desc" focusable="false">
<title id="open-increase-position-lifecycle-title">Open or increase a position</title>
<desc id="open-increase-position-lifecycle-desc">Review and authorize a bounded commitment. A successfully submitted order joins FIFO, then executes, remains pending or fails without the requested position change. Confirmation is not a fill. Read the order receipt before assuming that your position changed.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="976" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · DELAYED ORDERS</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Open or increase a position</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Configure and review</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Choose direction, quantity, leverage and</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">execution protections.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#FFAB96"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Authorize commitment</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Prepare sponsorship, sign, submit and verify</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">onchain success.</text>
<path d="M47 315 V392 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="415" r="13" fill="#3B212D" stroke="#F7D977" stroke-width="2.5"/>
<circle cx="47" cy="415" r="5" fill="#F7D977"/>
<text x="78" y="424" font-size="24" font-weight="700" fill="#F7D977" data-max-width="530">Wait in FIFO</text>
<text x="78" y="457" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">The order is pending; required funds are</text>
<text x="78" y="487" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">reserved.</text>
<text x="32" y="541" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">Execution has separate outcomes</text>
<rect x="32" y="562" width="278" height="242" rx="12" fill="#3B212D" stroke="#00FF99" stroke-width="1.5"/>
<rect x="44" y="565" width="254" height="5" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="604" font-size="24" font-weight="700" fill="#00FF99" data-max-width="246">Executed</text>
<path d="M48 621 L294 621" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="647" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Apply the trade</text>
<text x="48" y="683" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Create the position</text>
<text x="48" y="713" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">or increase its size</text>
<text x="48" y="743" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">and update its</text>
<text x="48" y="773" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">backing.</text>
<rect x="330" y="562" width="278" height="242" rx="12" fill="#3B212D" stroke="#F7D977" stroke-width="1.5"/>
<rect x="342" y="565" width="254" height="5" rx="3" fill="#F7D977" stroke="none"/>
<text x="346" y="604" font-size="24" font-weight="700" fill="#F7D977" data-max-width="246">Not executed</text>
<path d="M346 621 L592 621" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="647" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Pending or failed</text>
<text x="346" y="683" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">A temporary blocker</text>
<text x="346" y="713" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">leaves it pending. A</text>
<text x="346" y="743" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">terminal receipt</text>
<text x="346" y="773" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">records failure.</text>
<rect x="32" y="826" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="836" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="860" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Confirmation is not a fill. Read the order</text>
<text x="56" y="890" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">receipt before assuming that your position</text>
<text x="56" y="920" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">changed.</text>
</svg>
