<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1121" viewBox="0 0 640 1121" role="img" aria-labelledby="settlement-liquidity-flow-title settlement-liquidity-flow-desc" focusable="false">
<title id="settlement-liquidity-flow-title">How a price payout reaches you</title>
<desc id="settlement-liquidity-flow-desc">After action costs are withheld, a residual price payout is paid in full only if free pool cash after existing claims covers it. Otherwise the full residual becomes a claim. Later claim settlement requires pool cash to cover all claims. A partial close releases only pledge allowed by the remaining terminal cap.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1121" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · SETTLEMENT LIQUIDITY</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">How a price payout reaches you</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Close accounting</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Separate price PnL, action charges and pledge</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">release.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#FFAB96"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Residual price payout</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Positive price gain left after withheld action</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">costs.</text>
<rect x="32" y="392" width="278" height="242" rx="12" fill="#3B212D" stroke="#00FF99" stroke-width="1.5"/>
<rect x="44" y="395" width="254" height="5" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="434" font-size="24" font-weight="700" fill="#00FF99" data-max-width="246">Cash covers it</text>
<path d="M48 451 L294 451" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="477" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Fund in full</text>
<text x="48" y="513" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Pool cash after</text>
<text x="48" y="543" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">existing claims</text>
<text x="48" y="573" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">covers the entire</text>
<text x="48" y="603" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">payout.</text>
<rect x="330" y="392" width="278" height="242" rx="12" fill="#3B212D" stroke="#F7D977" stroke-width="1.5"/>
<rect x="342" y="395" width="254" height="5" rx="3" fill="#F7D977" stroke="none"/>
<text x="346" y="434" font-size="24" font-weight="700" fill="#F7D977" data-max-width="246">Cash is insufficient</text>
<path d="M346 451 L592 451" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="477" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Record a claim</text>
<text x="346" y="513" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">The entire residual</text>
<text x="346" y="543" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">payout waits; no</text>
<text x="346" y="573" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">partial price payout.</text>
<text x="32" y="686" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">When funded now or settled later</text>
<rect x="32" y="707" width="278" height="242" rx="12" fill="#3B212D" stroke="#FFAB96" stroke-width="1.5"/>
<rect x="44" y="710" width="254" height="5" rx="3" fill="#FFAB96" stroke="none"/>
<text x="48" y="749" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="246">Position still open</text>
<path d="M48 766 L294 766" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="792" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Credit PnL pledge</text>
<text x="48" y="828" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">The funded price</text>
<text x="48" y="858" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">payout backs the</text>
<text x="48" y="888" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">remaining position.</text>
<rect x="330" y="707" width="278" height="242" rx="12" fill="#3B212D" stroke="#00FF99" stroke-width="1.5"/>
<rect x="342" y="710" width="254" height="5" rx="3" fill="#00FF99" stroke="none"/>
<text x="346" y="749" font-size="24" font-weight="700" fill="#00FF99" data-max-width="246">No open position</text>
<path d="M346 766 L592 766" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="792" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Credit settlement</text>
<text x="346" y="828" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">USDG enters the</text>
<text x="346" y="858" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Margin Account;</text>
<text x="346" y="888" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">withdrawal is a</text>
<text x="346" y="918" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">separate action.</text>
<rect x="32" y="971" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="981" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="1005" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Later claim settlement requires pool cash to</text>
<text x="56" y="1035" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">cover all claims. A partial close releases only</text>
<text x="56" y="1065" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">pledge allowed by the remaining terminal cap.</text>
</svg>
