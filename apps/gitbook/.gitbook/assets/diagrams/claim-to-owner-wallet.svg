<svg xmlns="http://www.w3.org/2000/svg" width="640" height="868" viewBox="0 0 640 868" role="img" aria-labelledby="claim-to-owner-wallet-title claim-to-owner-wallet-desc" focusable="false">
<title id="claim-to-owner-wallet-title">A claim is not wallet cash</title>
<desc id="claim-to-owner-wallet-desc">Claim coverage and settlement precede account credit. Live-position credit is pledged, so withdrawal requires eligible free USDG and a separate authorized action. </desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="868" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · CLAIM SETTLEMENT</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">A claim is not wallet cash</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#F7D977" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#F7D977"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#F7D977" data-max-width="530">Onchain coverage check</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Contract verifies pool cash covers all</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">outstanding claims.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#FFAB96"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Authorize settlement</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Submit Settle Claim from the owning Trading</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Account.</text>
<rect x="32" y="392" width="278" height="242" rx="12" fill="#3B212D" stroke="#FFAB96" stroke-width="1.5"/>
<rect x="44" y="395" width="254" height="5" rx="3" fill="#FFAB96" stroke="none"/>
<text x="48" y="434" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="246">Position still open</text>
<path d="M48 451 L294 451" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="477" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Credit PnL pledge</text>
<text x="48" y="513" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">The funded price</text>
<text x="48" y="543" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">payout backs the</text>
<text x="48" y="573" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">remaining position.</text>
<rect x="330" y="392" width="278" height="242" rx="12" fill="#3B212D" stroke="#00FF99" stroke-width="1.5"/>
<rect x="342" y="395" width="254" height="5" rx="3" fill="#00FF99" stroke="none"/>
<text x="346" y="434" font-size="24" font-weight="700" fill="#00FF99" data-max-width="246">No open position</text>
<path d="M346 451 L592 451" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="477" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Credit settlement</text>
<text x="346" y="513" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">USDG enters the</text>
<text x="346" y="543" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Margin Account;</text>
<text x="346" y="573" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">withdrawal is a</text>
<text x="346" y="603" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">separate action.</text>
<circle cx="47" cy="671" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="671" r="5" fill="#9A8890"/>
<text x="78" y="680" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Review Withdrawable</text>
<text x="78" y="713" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Only eligible free USDG can leave the account.</text>
<path d="M47 690 V737 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="760" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="760" r="5" fill="#00FF99"/>
<text x="78" y="769" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Authorize withdrawal</text>
<text x="78" y="802" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">A separate operation sends USDG to the owner</text>
<text x="78" y="832" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">wallet.</text>
</svg>
