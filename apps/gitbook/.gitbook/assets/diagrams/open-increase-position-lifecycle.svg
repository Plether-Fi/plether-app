<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1052" viewBox="0 0 640 1052" role="img" aria-labelledby="open-increase-position-lifecycle-title open-increase-position-lifecycle-desc" focusable="false">
<title id="open-increase-position-lifecycle-title">Open or increase a position</title>
<desc id="open-increase-position-lifecycle-desc">Review and authorize a bounded commitment. A successfully submitted order joins FIFO, then executes, remains pending or fails without the requested position change. Confirmation is not a fill. Read the order receipt before assuming that your position changed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1052" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / DELAYED ORDERS</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Open or increase a position</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Configure and review</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Choose direction, quantity, leverage and</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">execution protections.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Authorize commitment</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Prepare sponsorship, sign, submit and verify</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">onchain success.</text>
<path d="M47 340 V421 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="450" r="14" fill="#F7D977"/>
<circle cx="47" cy="450" r="5" fill="#250917"/>
<text x="80" y="459" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Wait in FIFO</text>
<text x="80" y="496" font-size="24" font-weight="400" fill="#250917" data-max-width="528">The order is pending; required funds are</text>
<text x="80" y="528" font-size="24" font-weight="400" fill="#250917" data-max-width="528">reserved.</text>
<text x="32" y="584" font-size="24" font-weight="700" fill="#250917" data-max-width="576">Execution has separate outcomes</text>
<rect x="32" y="610" width="278" height="258" rx="12" fill="#FFF5F9" stroke="#9A8890"/>
<rect x="44" y="614" width="254" height="6" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="652" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Executed</text>
<path d="M48 673 L294 673" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="703" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Apply the trade</text>
<text x="48" y="742" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Create the position</text>
<text x="48" y="774" font-size="24" font-weight="400" fill="#250917" data-max-width="246">or increase its size</text>
<text x="48" y="806" font-size="24" font-weight="400" fill="#250917" data-max-width="246">and update its</text>
<text x="48" y="838" font-size="24" font-weight="400" fill="#250917" data-max-width="246">backing.</text>
<rect x="330" y="610" width="278" height="258" rx="12" fill="#F7E4B2" stroke="none"/>
<text x="346" y="652" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Not executed</text>
<path d="M346 673 L592 673" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="703" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Pending or failed</text>
<text x="346" y="742" font-size="24" font-weight="400" fill="#250917" data-max-width="246">A temporary blocker</text>
<text x="346" y="774" font-size="24" font-weight="400" fill="#250917" data-max-width="246">leaves it pending. A</text>
<text x="346" y="806" font-size="24" font-weight="400" fill="#250917" data-max-width="246">terminal receipt</text>
<text x="346" y="838" font-size="24" font-weight="400" fill="#250917" data-max-width="246">records failure.</text>
<rect x="32" y="892" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="930" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Confirmation is not a fill. Read the order</text>
<text x="50" y="962" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">receipt before assuming that your position</text>
<text x="50" y="994" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">changed.</text>
</svg>
