<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="account-health-reading-order-title account-health-reading-order-desc" focusable="false">
<title id="account-health-reading-order-title">Read account health in context</title>
<desc id="account-health-reading-order-desc">Recommended reading order, not a calculation or state transition: market regime, position, equity and margin, liquidation context, pending obligations and spendable balances. </desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="880" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · ACCOUNT CHECKLIST</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Read account health in context</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Market state</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Check oracle availability and close-only</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">restrictions.</text>
<path d="M47 196 L47 273" stroke="#9A8890" stroke-width="1.5" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#9A8890"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Current position</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Confirm side, size and entry price.</text>
<path d="M47 315 L47 362" stroke="#9A8890" stroke-width="1.5" fill="none"/>
<circle cx="47" cy="385" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="385" r="5" fill="#9A8890"/>
<text x="78" y="394" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Equity and margin</text>
<text x="78" y="427" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Compare equity after margin-first carry</text>
<text x="78" y="457" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">projection with maintenance. USDG balance is</text>
<text x="78" y="487" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">separate.</text>
<path d="M47 404 L47 511" stroke="#9A8890" stroke-width="1.5" fill="none"/>
<circle cx="47" cy="534" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="534" r="5" fill="#9A8890"/>
<text x="78" y="543" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Liquidation context</text>
<text x="78" y="576" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Treat liquidation price as an estimate, not a</text>
<text x="78" y="606" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">guarantee.</text>
<path d="M47 553 L47 630" stroke="#9A8890" stroke-width="1.5" fill="none"/>
<circle cx="47" cy="653" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="653" r="5" fill="#9A8890"/>
<text x="78" y="662" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Pending obligations</text>
<text x="78" y="695" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Check any uncovered carry, orders, TP/SL and</text>
<text x="78" y="725" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">reserved funds.</text>
<path d="M47 672 L47 749" stroke="#9A8890" stroke-width="1.5" fill="none"/>
<circle cx="47" cy="772" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="772" r="5" fill="#9A8890"/>
<text x="78" y="781" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Spendable balances</text>
<text x="78" y="814" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Available to Trade and Withdrawable have</text>
<text x="78" y="844" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">different checks.</text>
</svg>
