name: Backend

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  faucet-recovery:
    name: Faucet and publication database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faucet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/oracle-worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/backend/oracle-worker
      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify Divisions handles match registrations and preserve standings
        run: node --test scripts/divisions-public-handles.test.mjs scripts/divisions-publications.test.mjs
        env:
          PGDATABASE: postgresql://postgres:postgres@127.0.0.1:5432/faucet_test
      - name: Verify nonce recovery proofs and atomic database recovery
        run: node --test apps/backend/scripts/recover-faucet-nonce.test.mjs apps/backend/scripts/recover-margin-funding-nonce.test.mjs
        env:
          FAUCET_NODE_PACKAGE: ${{ github.workspace }}/apps/backend/oracle-worker/package.json
          FAUCET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/faucet_test

  infrastructure:
    name: Infrastructure policy tests
    runs-on: ubuntu-24.04 # GHC 9.4.8 requires the gold linker absent from 26.04.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test close assistance deployment controls
        working-directory: .
        run: |
          python3 .github/scripts/test-configure-close-assistance.py
          python3 .github/scripts/test-configure-privy-app.py

      - name: Test candle administration task identity
        working-directory: .
        run: node --test scripts/candle-admin-task-identity.test.mjs

      - name: Set up Node for Alto RPC authentication tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25.2.1

      - name: Test Alto RPC cutover and scoped authentication
        working-directory: .
        run: |
          python3 -m unittest discover -s infra/rpc/ops -p 'test_alto_rpc_cutover.py'
          node --test infra/alto/rpc-auth.test.mjs infra/alto/qualify-rpc.test.mjs infra/alto/qualify-drain.test.mjs

      - name: Test Sepolia workers-only deployment scope
        run: node --test scripts/backend-workers-scope.test.mjs

      - name: Reject Blockscout runtime dependencies
        working-directory: .
        run: |
          node --test scripts/check-no-blockscout-runtime.test.mjs
          ./scripts/check-no-blockscout-runtime.sh

      - name: Setup Terraform for offline AA guard tests
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Test mocked Sepolia, mainnet, RPC and signer isolation guards
        working-directory: .
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform-rpc fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test -filter=tests/sepolia.tftest.hcl -filter=tests/mainnet.tftest.hcl -filter=tests/alto_ingress.tftest.hcl -filter=tests/rpc.tftest.hcl -no-color

      - name: Test retained artifacts, immutable releases and protected recovery
        working-directory: .
        run: |
          node --test scripts/runtime-repository-policy.test.mjs scripts/runtime-release.test.mjs scripts/runtime-image-audit.test.mjs scripts/recover-backend.test.mjs scripts/aa-resume-guards.test.mjs

      - name: Test sanitized incident evidence and service monitoring
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s infra/incident-observer -p 'test_*.py'
          node scripts/test-incident-observer-terraform.mjs

      - name: Test AA RPC mode and recovery origin guards
        env:
          AA_TERRAFORM_TEST_REQUIRED: '1'
        working-directory: .
        run: node --test scripts/aa-rpc-mode.test.mjs scripts/aa-recovery-origins.test.mjs

      - name: Test deployed release bindings with independent positive controls
        working-directory: .
        run: node scripts/test-terraform-bindings.mjs

  test:
    name: Backend unit tests
    runs-on: ubuntu-24.04 # GHC 9.4.8 requires the gold linker absent from 26.04.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: passkey_names_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libsecp256k1-dev pkg-config

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: 'latest'
          cabal-update: false

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ~/.cabal/store
          key: ubuntu-24.04-ghc-9.4.8-cabal-${{ hashFiles('apps/backend/plether-api.cabal', 'apps/backend/cabal.project', 'apps/backend/cabal.project.freeze') }}
          restore-keys: ubuntu-24.04-ghc-9.4.8-cabal-

      - name: Update Cabal package index
        run: |
          for attempt in 1 2 3; do
            if cabal update; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::cabal update failed after 3 attempts"
              exit 1
            fi

            delay=$((attempt * 10))
            echo "::warning::cabal update failed (attempt $attempt/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Install dependencies
        run: cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Run tests
        run: cabal test plether-api-test
        env:
          PASSKEY_NAMES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/passkey_names_test

  perps-critical-path-integration:
    name: Perps critical path integration
    runs-on: ubuntu-24.04 # GHC 9.4.8 requires the gold linker absent from 26.04.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    env:
      PERPS_CRITICAL_PATH_REQUIRED: '1'
      PERPS_CRITICAL_PATH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/plether_critical_path

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plether_critical_path
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plether_critical_path"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libsecp256k1-dev pkg-config postgresql-client

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: 'latest'
          cabal-update: false

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ~/.cabal/store
          key: ubuntu-24.04-ghc-9.4.8-cabal-${{ hashFiles('apps/backend/plether-api.cabal', 'apps/backend/cabal.project', 'apps/backend/cabal.project.freeze') }}
          restore-keys: ubuntu-24.04-ghc-9.4.8-cabal-

      - name: Update Cabal package index
        run: |
          for attempt in 1 2 3; do
            if cabal update; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::cabal update failed after 3 attempts"
              exit 1
            fi

            delay=$((attempt * 10))
            echo "::warning::cabal update failed (attempt $attempt/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Install integration test dependencies
        run: cabal build --only-dependencies plether-api-integration-test

      - name: Verify PostgreSQL prerequisite
        run: |
          pg_isready --dbname="$PERPS_CRITICAL_PATH_DATABASE_URL"
          psql "$PERPS_CRITICAL_PATH_DATABASE_URL" --set ON_ERROR_STOP=1 --command "SELECT 1;"

      - name: Run deterministic Perps critical path integration tests
        working-directory: .
        run: node scripts/test-backend-integration.mjs

  native-aa-integration:
    name: Native AA integration
    runs-on: ubuntu-24.04 # GHC 9.4.8 requires the gold linker absent from 26.04.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    env:
      AA_INTEGRATION_REQUIRED: '1'
      AA_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/plether_aa_integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plether_aa_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plether_aa_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            libsecp256k1-dev \
            pkg-config \
            postgresql-client

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: 'latest'
          cabal-update: false

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ~/.cabal/store
          key: ubuntu-24.04-ghc-9.4.8-cabal-${{ hashFiles('apps/backend/plether-api.cabal', 'apps/backend/cabal.project', 'apps/backend/cabal.project.freeze') }}
          restore-keys: ubuntu-24.04-ghc-9.4.8-cabal-

      - name: Update Cabal package index
        run: |
          for attempt in 1 2 3; do
            if cabal update; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::cabal update failed after 3 attempts"
              exit 1
            fi

            delay=$((attempt * 10))
            echo "::warning::cabal update failed (attempt $attempt/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Install native AA integration dependencies
        run: cabal build --only-dependencies plether-aa-integration-test

      - name: Verify PostgreSQL prerequisite
        run: |
          pg_isready --dbname="$AA_INTEGRATION_DATABASE_URL"
          psql "$AA_INTEGRATION_DATABASE_URL" --set ON_ERROR_STOP=1 --command "SELECT 1;"

      - name: Run native AA integration tests
        run: cabal test plether-aa-integration-test --test-show-details=direct -j1
