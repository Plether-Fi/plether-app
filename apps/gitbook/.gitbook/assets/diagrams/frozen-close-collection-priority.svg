<svg xmlns="http://www.w3.org/2000/svg" width="640" height="691" viewBox="0 0 640 691" role="img" aria-labelledby="frozen-close-collection-priority-title frozen-close-collection-priority-desc" focusable="false">
<title id="frozen-close-collection-priority-title">Where frozen-close spread sits</title>
<desc id="frozen-close-collection-priority-desc">Frozen-close spread is an action charge, not a price change. Recovery follows execution fee, carry left unpaid after initial collection, and positive VPI; unrecovered spread is waived. This is recovery attribution, not a shared price-loss collateral queue. Negative VPI can offset the net action charge; uncollected spread is waived.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="691" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · CLOSE ACTION COSTS</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Where frozen-close spread sits</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Execution fee</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Count recovered action charges against this</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">first.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#9A8890"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Unpaid carry + positive VPI</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Carry already collected from margin or free</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">USDG is not charged again.</text>
<path d="M47 315 V392 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="415" r="13" fill="#3B212D" stroke="#F7D977" stroke-width="2.5"/>
<circle cx="47" cy="415" r="5" fill="#F7D977"/>
<text x="78" y="424" font-size="24" font-weight="700" fill="#F7D977" data-max-width="530">Frozen-close spread</text>
<text x="78" y="457" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Only the remaining recovered amount counts</text>
<text x="78" y="487" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">toward spread.</text>
<rect x="32" y="511" width="576" height="148" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="521" width="5" height="128" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="545" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">This is recovery attribution, not a shared</text>
<text x="56" y="575" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">price-loss collateral queue. Negative VPI can</text>
<text x="56" y="605" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">offset the net action charge; uncollected</text>
<text x="56" y="635" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">spread is waived.</text>
</svg>
