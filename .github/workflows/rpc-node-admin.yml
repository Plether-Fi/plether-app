name: Sepolia RPC administration
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded node operation or publish a gateway image (no traffic cutover)
        type: choice
        required: true
        default: status
        options: [status, restart, publish-gateway]
permissions:
  contents: read
  id-token: write
concurrency:
  group: sepolia-rpc-admin
  cancel-in-progress: false
jobs:
  admin:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rpc-admin-sepolia
    env:
      AWS_REGION: ap-southeast-1
      EXPECTED_ACCOUNT: '932542905614'
      OPERATION: ${{ inputs.operation }}
      INSTANCE_ID: ${{ vars.SEPOLIA_RPC_NODE_INSTANCE_ID }}
      ECR_URI: 932542905614.dkr.ecr.ap-southeast-1.amazonaws.com/plether-rpc-gateway-sepolia
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SEPOLIA_RPC_ADMIN_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Verify account and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          case "$OPERATION" in status|restart|publish-gateway) ;; *) exit 2 ;; esac
      - name: Inspect or restart the Nitro process
        if: inputs.operation != 'publish-gateway'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          parameters="$(jq -cn --arg operation "$OPERATION" '{operation:[$operation]}')"
          command_id="$(aws ssm send-command --document-name plether-sepolia-rpc-node-admin --instance-ids "$INSTANCE_ID" --parameters "$parameters" --query Command.CommandId --output text)"
          if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
      - uses: docker/setup-qemu-action@v3
        if: inputs.operation == 'publish-gateway'
      - uses: docker/setup-buildx-action@v3
        if: inputs.operation == 'publish-gateway'
      - name: ECR login
        if: inputs.operation == 'publish-gateway'
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URI%%/*}"
      - uses: docker/build-push-action@v6
        if: inputs.operation == 'publish-gateway'
        id: build
        with:
          context: .
          file: infra/rpc/gateway/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_URI }}:${{ github.sha }}
      - name: Record immutable deployment image
        if: inputs.operation == 'publish-gateway'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$ECR_URI" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
