<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1204" viewBox="0 0 640 1204" role="img" aria-labelledby="settlement-liquidity-flow-title settlement-liquidity-flow-desc" focusable="false">
<title id="settlement-liquidity-flow-title">How a price payout reaches you</title>
<desc id="settlement-liquidity-flow-desc">After action costs are withheld, a residual price payout is paid in full only if free pool cash after existing claims covers it. Otherwise the full residual becomes a claim. Later claim settlement requires pool cash to cover all claims. A partial close releases only pledge allowed by the remaining terminal cap.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1204" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / SETTLEMENT LIQUIDITY</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">How a price payout reaches you</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Close accounting</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Separate price PnL, action charges and</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">pledge release.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Residual price payout</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Positive price gain left after withheld</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">action costs.</text>
<rect x="32" y="421" width="278" height="259" rx="12" fill="#FFF5F9" stroke="#9A8890"/>
<rect x="44" y="425" width="254" height="6" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="463" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Cash covers it</text>
<path d="M48 484 L294 484" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="514" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Fund in full</text>
<text x="48" y="553" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Pool cash after</text>
<text x="48" y="585" font-size="24" font-weight="400" fill="#250917" data-max-width="246">existing claims</text>
<text x="48" y="617" font-size="24" font-weight="400" fill="#250917" data-max-width="246">covers the entire</text>
<text x="48" y="649" font-size="24" font-weight="400" fill="#250917" data-max-width="246">payout.</text>
<rect x="330" y="421" width="278" height="259" rx="12" fill="#F7E4B2" stroke="none"/>
<text x="346" y="463" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Cash is</text>
<text x="346" y="496" font-size="26" font-weight="700" fill="#250917" data-max-width="246">insufficient</text>
<path d="M346 517 L592 517" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="547" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Record a claim</text>
<text x="346" y="586" font-size="24" font-weight="400" fill="#250917" data-max-width="246">The entire residual</text>
<text x="346" y="618" font-size="24" font-weight="400" fill="#250917" data-max-width="246">payout waits; no</text>
<text x="346" y="650" font-size="24" font-weight="400" fill="#250917" data-max-width="246">partial price payout.</text>
<text x="32" y="736" font-size="24" font-weight="700" fill="#250917" data-max-width="576">When funded now or settled later</text>
<rect x="32" y="762" width="278" height="258" rx="12" fill="#FFAB96" stroke="none"/>
<text x="48" y="804" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Position still open</text>
<path d="M48 825 L294 825" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="855" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Credit PnL pledge</text>
<text x="48" y="894" font-size="24" font-weight="400" fill="#250917" data-max-width="246">The funded price</text>
<text x="48" y="926" font-size="24" font-weight="400" fill="#250917" data-max-width="246">payout backs the</text>
<text x="48" y="958" font-size="24" font-weight="400" fill="#250917" data-max-width="246">remaining position.</text>
<rect x="330" y="762" width="278" height="258" rx="12" fill="#FFF5F9" stroke="#9A8890"/>
<rect x="342" y="766" width="254" height="6" rx="3" fill="#00FF99" stroke="none"/>
<text x="346" y="804" font-size="26" font-weight="700" fill="#250917" data-max-width="246">No open position</text>
<path d="M346 825 L592 825" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="855" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Credit settlement</text>
<text x="346" y="894" font-size="24" font-weight="400" fill="#250917" data-max-width="246">USDC enters the</text>
<text x="346" y="926" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Margin Account;</text>
<text x="346" y="958" font-size="24" font-weight="400" fill="#250917" data-max-width="246">withdrawal is a</text>
<text x="346" y="990" font-size="24" font-weight="400" fill="#250917" data-max-width="246">separate action.</text>
<rect x="32" y="1044" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="1082" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Later claim settlement requires pool cash to</text>
<text x="50" y="1114" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">cover all claims. A partial close releases only</text>
<text x="50" y="1146" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">pledge allowed by the remaining terminal cap.</text>
</svg>
