<svg xmlns="http://www.w3.org/2000/svg" width="640" height="711" viewBox="0 0 640 711" role="img" aria-labelledby="claim-settlement-funding-path-title claim-settlement-funding-path-desc" focusable="false">
<title id="claim-settlement-funding-path-title">Where settled claim funds go</title>
<desc id="claim-settlement-funding-path-desc">Covered HousePool cash is sent to the Margin Clearinghouse, which credits PnL pledge for a live position or free settlement otherwise. </desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="711" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / FUNDING PATH</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Where settled claim funds go</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Liquidity pool</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Cash coverage passes for all outstanding</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">claims.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Margin Clearinghouse</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Receives USDC for the claim-owning Trading</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Account.</text>
<rect x="32" y="421" width="278" height="258" rx="12" fill="#FFAB96" stroke="none"/>
<text x="48" y="463" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Position still open</text>
<path d="M48 484 L294 484" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="514" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Credit PnL pledge</text>
<text x="48" y="553" font-size="24" font-weight="400" fill="#250917" data-max-width="246">The funded price</text>
<text x="48" y="585" font-size="24" font-weight="400" fill="#250917" data-max-width="246">payout backs the</text>
<text x="48" y="617" font-size="24" font-weight="400" fill="#250917" data-max-width="246">remaining position.</text>
<rect x="330" y="421" width="278" height="258" rx="12" fill="#FFF5F9" stroke="#9A8890"/>
<rect x="342" y="425" width="254" height="6" rx="3" fill="#00FF99" stroke="none"/>
<text x="346" y="463" font-size="26" font-weight="700" fill="#250917" data-max-width="246">No open position</text>
<path d="M346 484 L592 484" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="514" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Credit settlement</text>
<text x="346" y="553" font-size="24" font-weight="400" fill="#250917" data-max-width="246">USDC enters the</text>
<text x="346" y="585" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Margin Account;</text>
<text x="346" y="617" font-size="24" font-weight="400" fill="#250917" data-max-width="246">withdrawal is a</text>
<text x="346" y="649" font-size="24" font-weight="400" fill="#250917" data-max-width="246">separate action.</text>
</svg>
