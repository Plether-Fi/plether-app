<svg xmlns="http://www.w3.org/2000/svg" width="640" height="921" viewBox="0 0 640 921" role="img" aria-labelledby="account-health-reading-order-title account-health-reading-order-desc" focusable="false">
<title id="account-health-reading-order-title">Read account health in context</title>
<desc id="account-health-reading-order-desc">Recommended reading order, not a calculation or state transition: market regime, position, equity and margin, liquidation context, pending obligations and spendable balances. </desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="921" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / ACCOUNT CHECKLIST</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Read account health in context</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Market state</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Check oracle availability and close-only</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">restrictions.</text>
<path d="M47 209 L47 291" stroke="#9A8890" stroke-width="2" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#9A8890"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Current position</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Confirm side, size and entry price.</text>
<path d="M47 340 L47 390" stroke="#9A8890" stroke-width="2" fill="none"/>
<circle cx="47" cy="418" r="14" fill="#9A8890"/>
<circle cx="47" cy="418" r="5" fill="#250917"/>
<text x="80" y="427" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Equity and margin</text>
<text x="80" y="464" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Read portfolio value alongside</text>
<text x="80" y="496" font-size="24" font-weight="400" fill="#250917" data-max-width="528">position-equity and maintenance</text>
<text x="80" y="528" font-size="24" font-weight="400" fill="#250917" data-max-width="528">requirements.</text>
<path d="M47 439 L47 553" stroke="#9A8890" stroke-width="2" fill="none"/>
<circle cx="47" cy="581" r="14" fill="#9A8890"/>
<circle cx="47" cy="581" r="5" fill="#250917"/>
<text x="80" y="590" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Liquidation context</text>
<text x="80" y="627" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Treat liquidation price as an estimate, not a</text>
<text x="80" y="659" font-size="24" font-weight="400" fill="#250917" data-max-width="528">guarantee.</text>
<path d="M47 602 L47 684" stroke="#9A8890" stroke-width="2" fill="none"/>
<circle cx="47" cy="712" r="14" fill="#9A8890"/>
<circle cx="47" cy="712" r="5" fill="#250917"/>
<text x="80" y="721" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Pending obligations</text>
<text x="80" y="758" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Check orders, TP/SL and reserved funds.</text>
<path d="M47 733 L47 783" stroke="#9A8890" stroke-width="2" fill="none"/>
<circle cx="47" cy="811" r="14" fill="#9A8890"/>
<circle cx="47" cy="811" r="5" fill="#250917"/>
<text x="80" y="820" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Spendable balances</text>
<text x="80" y="857" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Available to Trade and Withdrawable have</text>
<text x="80" y="889" font-size="24" font-weight="400" fill="#250917" data-max-width="528">different checks.</text>
</svg>
