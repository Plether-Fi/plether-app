<svg xmlns="http://www.w3.org/2000/svg" width="640" height="811" viewBox="0 0 640 811" role="img" aria-labelledby="sponsored-withdrawal-flow-title sponsored-withdrawal-flow-desc" focusable="false">
<title id="sponsored-withdrawal-flow-title">Withdraw to your owner wallet</title>
<desc id="sponsored-withdrawal-flow-desc">Review the free amount and verified owner recipient, prepare sponsorship, sign and confirm. Withdrawal remains subject to onchain account-health and balance checks. The contract rechecks balances and account health. An estimate or wallet signature alone does not complete a withdrawal.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="811" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / MARGIN WITHDRAWAL</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Withdraw to your owner wallet</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Choose an eligible amount</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Use Withdrawable, not total collateral or</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">unrealized profit.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#9A8890"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Verify the recipient</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Check the Trading Account and displayed</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">owner wallet.</text>
<path d="M47 340 V421 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="450" r="14" fill="#FF512F"/>
<circle cx="47" cy="450" r="5" fill="#250917"/>
<text x="80" y="459" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Prepare and sign</text>
<text x="80" y="496" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Authorize the sponsored withdrawal.</text>
<path d="M47 471 V520 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="549" r="14" fill="#00FF99"/>
<circle cx="47" cy="549" r="5" fill="#250917"/>
<text x="80" y="558" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Confirm receipt</text>
<text x="80" y="595" font-size="24" font-weight="400" fill="#250917" data-max-width="528">After successful execution, check</text>
<text x="80" y="627" font-size="24" font-weight="400" fill="#250917" data-max-width="528">owner-wallet USDC.</text>
<rect x="32" y="651" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="689" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">The contract rechecks balances and account</text>
<text x="50" y="721" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">health. An estimate or wallet signature alone</text>
<text x="50" y="753" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">does not complete a withdrawal.</text>
</svg>
