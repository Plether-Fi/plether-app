<svg xmlns="http://www.w3.org/2000/svg" width="640" height="853" viewBox="0 0 640 853" role="img" aria-labelledby="quickstart-sponsored-operation-lifecycle-title quickstart-sponsored-operation-lifecycle-desc" focusable="false">
<title id="quickstart-sponsored-operation-lifecycle-title">From preparation to confirmation</title>
<desc id="quickstart-sponsored-operation-lifecycle-desc">Preparation and sponsorship precede the wallet signature. Successful operation confirmation is separate from delayed-order execution. First-time Trading Account deployment waits for an Arbitrum Sepolia safe block (up to 30 min). Subsequent sponsored operations confirm normally.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="853" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · SPONSORED TRANSACTIONS</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">From preparation to</text>
<text x="32" y="150" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">confirmation</text>
<path d="M32 180 L608 180" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 180 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="221" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="221" r="5" fill="#9A8890"/>
<text x="78" y="230" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Prepare</text>
<text x="78" y="263" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Build the operation, estimate gas and obtain</text>
<text x="78" y="293" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">sponsorship.</text>
<path d="M47 240 V317 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="340" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="340" r="5" fill="#FFAB96"/>
<text x="78" y="349" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Confirm in wallet</text>
<text x="78" y="382" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Sign the exact prepared operation.</text>
<path d="M47 359 V406 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="429" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="429" r="5" fill="#9A8890"/>
<text x="78" y="438" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Submit</text>
<text x="78" y="471" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Send the signed operation to the bundler.</text>
<path d="M47 448 V495 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="518" r="13" fill="#3B212D" stroke="#F7D977" stroke-width="2.5"/>
<circle cx="47" cy="518" r="5" fill="#F7D977"/>
<text x="78" y="527" font-size="24" font-weight="700" fill="#F7D977" data-max-width="530">Pending onchain</text>
<text x="78" y="560" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Wait for an inclusion receipt.</text>
<path d="M47 537 V584 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="607" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="607" r="5" fill="#00FF99"/>
<text x="78" y="616" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Confirmed</text>
<text x="78" y="649" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Verify that the operation succeeded onchain.</text>
<rect x="32" y="673" width="576" height="148" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="683" width="5" height="128" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="707" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">First-time Trading Account deployment waits</text>
<text x="56" y="737" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">for an Arbitrum Sepolia safe block (up to 30</text>
<text x="56" y="767" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">min). Subsequent sponsored operations confirm</text>
<text x="56" y="797" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">normally.</text>
</svg>
