<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1605" viewBox="0 0 640 1605" role="img" aria-labelledby="claim-collateral-collection-order-title claim-collateral-collection-order-desc" focusable="false">
<title id="claim-collateral-collection-order-title">Claims, pledge and action costs</title>
<desc id="claim-collateral-collection-order-desc">Carry consumes active position margin first, then free USDG. Price losses then use claims and remaining collectible pledge; later action charges can use safely released margin, not residual position backing. A partial close cannot waive action charges. Remaining position backing and other orders’ execution rewards stay protected after carry. Reduce and close orders reserve no execution reward.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1605" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / V2 CLOSE ACCOUNTING</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Claims, pledge and action costs</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Collect accrued carry</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Use active position margin first, then</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">eligible free USDG.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#9A8890"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Keep unpaid carry visible</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Any remainder joins the close action charge;</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">claims and other locked buckets do not fund</text>
<text x="80" y="429" font-size="24" font-weight="400" fill="#250917" data-max-width="528">the carry checkpoint.</text>
<rect x="32" y="453" width="278" height="904" rx="12" fill="#FFAB96" stroke="none"/>
<text x="48" y="495" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Price loss</text>
<path d="M48 516 L294 516" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="546" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Net own claims</text>
<text x="48" y="585" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Only this account’s</text>
<text x="48" y="617" font-size="24" font-weight="400" fill="#250917" data-max-width="246">trader claims.</text>
<path d="M56 634 V653 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="697" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Consume PnL</text>
<text x="48" y="730" font-size="26" font-weight="700" fill="#250917" data-max-width="246">pledge</text>
<text x="48" y="769" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Within the terminal</text>
<text x="48" y="801" font-size="24" font-weight="400" fill="#250917" data-max-width="246">collectible cap.</text>
<path d="M56 818 V837 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="881" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Write off excess</text>
<text x="48" y="920" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Any price loss</text>
<text x="48" y="952" font-size="24" font-weight="400" fill="#250917" data-max-width="246">beyond that cap.</text>
<rect x="330" y="453" width="278" height="904" rx="12" fill="#FFAB96" stroke="none"/>
<text x="346" y="495" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Action charges</text>
<path d="M346 516 L592 516" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="546" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Withhold from gain</text>
<text x="346" y="585" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Offset a positive</text>
<text x="346" y="617" font-size="24" font-weight="400" fill="#250917" data-max-width="246">price gain first.</text>
<path d="M354 634 V653 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="697" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Use eligible funds</text>
<text x="346" y="736" font-size="24" font-weight="400" fill="#250917" data-max-width="246">VPI clawback</text>
<text x="346" y="768" font-size="24" font-weight="400" fill="#250917" data-max-width="246">reserve, spendable</text>
<text x="346" y="800" font-size="24" font-weight="400" fill="#250917" data-max-width="246">action reserve, then</text>
<text x="346" y="832" font-size="24" font-weight="400" fill="#250917" data-max-width="246">free USDG.</text>
<path d="M354 849 V868 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="912" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Use safely</text>
<text x="346" y="945" font-size="26" font-weight="700" fill="#250917" data-max-width="246">released margin</text>
<text x="346" y="984" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Only pledge the</text>
<text x="346" y="1016" font-size="24" font-weight="400" fill="#250917" data-max-width="246">close can release</text>
<text x="346" y="1048" font-size="24" font-weight="400" fill="#250917" data-max-width="246">while preserving</text>
<text x="346" y="1080" font-size="24" font-weight="400" fill="#250917" data-max-width="246">remaining-position</text>
<text x="346" y="1112" font-size="24" font-weight="400" fill="#250917" data-max-width="246">health.</text>
<path d="M354 1129 V1148 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="1192" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Full-close fallback</text>
<text x="346" y="1231" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Committed-order</text>
<text x="346" y="1263" font-size="24" font-weight="400" fill="#250917" data-max-width="246">margin, then waive</text>
<text x="346" y="1295" font-size="24" font-weight="400" fill="#250917" data-max-width="246">uncollectible</text>
<text x="346" y="1327" font-size="24" font-weight="400" fill="#250917" data-max-width="246">charges.</text>
<rect x="32" y="1381" width="576" height="192" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="1419" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">A partial close cannot waive action charges.</text>
<text x="50" y="1451" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Remaining position backing and other orders’</text>
<text x="50" y="1483" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">execution rewards stay protected after</text>
<text x="50" y="1515" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">carry. Reduce and close orders reserve no</text>
<text x="50" y="1547" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">execution reward.</text>
</svg>
