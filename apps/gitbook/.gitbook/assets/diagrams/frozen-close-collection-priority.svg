<svg xmlns="http://www.w3.org/2000/svg" width="640" height="744" viewBox="0 0 640 744" role="img" aria-labelledby="frozen-close-collection-priority-title frozen-close-collection-priority-desc" focusable="false">
<title id="frozen-close-collection-priority-title">Where frozen-close spread sits</title>
<desc id="frozen-close-collection-priority-desc">Frozen-close spread is an action charge, not a price change. Recovered spread is attributed only after execution fee, carry and positive VPI; unrecovered spread is waived. This is recovery attribution, not a shared price-loss collateral queue. Negative VPI can offset the net action charge; uncollected spread is waived.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="744" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / CLOSE ACTION COSTS</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Where frozen-close spread sits</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Execution fee</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Count recovered action charges against</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">this first.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#9A8890"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Carry + positive VPI</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">These prior charges precede spread</text>
<text x="80" y="397" font-size="24" font-weight="400" fill="#250917" data-max-width="528">recovery.</text>
<path d="M47 340 V421 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="450" r="14" fill="#F7D977"/>
<circle cx="47" cy="450" r="5" fill="#250917"/>
<text x="80" y="459" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Frozen-close spread</text>
<text x="80" y="496" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Only the remaining recovered amount counts</text>
<text x="80" y="528" font-size="24" font-weight="400" fill="#250917" data-max-width="528">toward spread.</text>
<rect x="32" y="552" width="576" height="160" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="590" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">This is recovery attribution, not a shared</text>
<text x="50" y="622" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">price-loss collateral queue. Negative VPI can</text>
<text x="50" y="654" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">offset the net action charge; uncollected</text>
<text x="50" y="686" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">spread is waived.</text>
</svg>
