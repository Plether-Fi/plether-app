name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  protection-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: protection_test
          POSTGRES_PASSWORD: protection_test
          POSTGRES_DB: protection_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U protection_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend/protection-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/protection-worker/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          PROTECTION_TEST_DATABASE_URL: postgres://protection_test:protection_test@127.0.0.1:5432/protection_test

  credential-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed Alchemy endpoint credentials
        working-directory: .
        run: |
          set -euo pipefail
          matches="$(git grep -nEo '(https|wss)://[A-Za-z0-9.-]+\.g\.alchemy\.com/v2/[A-Za-z0-9_-]{8,}' -- . || true)"
          unsafe="$(printf '%s\n' "$matches" | grep -v '/v2/YOUR_KEY$' || true)"
          if [ -n "$unsafe" ]; then
            printf '%s\n' "$unsafe"
            echo 'Committed Alchemy endpoint credential detected.' >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Insights story dependencies
        working-directory: apps/insights
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  insights:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/insights

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/insights/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
