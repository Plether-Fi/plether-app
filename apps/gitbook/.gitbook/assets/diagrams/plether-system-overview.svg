<rect x="44" y="165" width="552" height="5" rx="3" fill="#FFAB96" stroke="none"/>
<text x="52" y="204" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="536">Pyth FX Oracle (6 currencies)</text>
<text x="52" y="236" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="536">Produces the bounded 0.00 to 2.00 plDXY mark</text>
<text x="52" y="266" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="536">— no order book or AMM.</text>
