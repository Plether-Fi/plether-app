name: V3 order lifecycle
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: order-v3-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  local-flow:
    name: Delayed approval and canonical recovery
    runs-on: ubuntu-24.04 # GHC 9.4.8 requires the gold linker absent from 26.04.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the deployed Core source
        uses: actions/checkout@v4
        with:
          repository: Plether-Fi/plether-core
          ref: 1209ca8a5b94a4fb6323c7c4585846ed93db3932
          path: .ci-order-v3-core
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/frontend/test/local-order-v3/package-lock.json
      - name: Pin npm to the frontend deployment version
        run: npm install -g npm@11.6.2
      - run: npm ci --no-audit --no-fund
        working-directory: apps/frontend
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        id: foundry
        continue-on-error: true
        with:
          version: v1.5.1
      - name: Install verified pinned Foundry through the GitHub API if release downloads fail
        if: steps.foundry.outcome == 'failure'
        run: node scripts/install-foundry-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Cache pinned Core Solidity compiler and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            ~/.cache/svm
            .ci-order-v3-core/packages/perps/out
            .ci-order-v3-core/packages/perps/cache
            .ci-order-v3-core/packages/perps-aa/out
            .ci-order-v3-core/packages/perps-aa/cache
          key: ubuntu-24.04-foundry-v1.5.1-order-v3-core-1209ca8a5b94a4fb6323c7c4585846ed93db3932
      - name: Configure Ubuntu package mirror
        run: sudo python3 "$GITHUB_WORKSPACE/.github/scripts/configure-ubuntu-mirror.py"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libsecp256k1-dev pkg-config
      - name: Cache GHC 9.4.8 toolchain
        uses: actions/cache@v4
        with:
          path: /usr/local/.ghcup/ghc/9.4.8
          key: ubuntu-24.04-ghc-9.4.8-toolchain-v1
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: 'latest'
          cabal-update: false
      - uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ubuntu-24.04-ghc-9.4.8-cabal-${{ hashFiles('apps/backend/plether-api.cabal', 'apps/backend/cabal.project', 'apps/backend/cabal.project.freeze') }}
          restore-keys: ubuntu-24.04-ghc-9.4.8-cabal-
      - name: Cache Cabal package index
        id: cabal-index-cache
        uses: actions/cache@v4
        with:
          path: ~/.cabal/packages
          key: ubuntu-24.04-cabal-packages-${{ hashFiles('apps/backend/cabal.project.freeze') }}
      - name: Cache Haskell build artifacts
        uses: actions/cache@v4
        with:
          path: apps/backend/dist-newstyle
          key: ubuntu-24.04-ghc-9.4.8-dist-O0-${{ hashFiles('apps/backend/plether-api.cabal', 'apps/backend/cabal.project', 'apps/backend/cabal.project.freeze') }}-lib-${{ hashFiles('apps/backend/schema.sql', 'apps/backend/config/migrations/**', 'config/**', 'apps/backend/src/**') }}
          restore-keys: |
            ubuntu-24.04-ghc-9.4.8-dist-O0-${{ hashFiles('apps/backend/plether-api.cabal', 'apps/backend/cabal.project', 'apps/backend/cabal.project.freeze') }}-
            ubuntu-24.04-ghc-9.4.8-dist-O0-
      - name: Configure unoptimized local package build for CI tests
        working-directory: apps/backend
        run: |
          cat <<'EOF' > cabal.project.local
          tests: True
          package plether-api
            optimization: 0
          EOF
      - name: Update Cabal package index
        if: steps.cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        working-directory: apps/backend
      - name: Typecheck the local integration harness
        run: npx tsc --project test/local-order-v3/tsconfig.json --noEmit
        working-directory: apps/frontend
      - name: Verify signed V3 orders on an isolated local chain
        run: node scripts/test-order-v3-local.mjs .ci-order-v3-core
