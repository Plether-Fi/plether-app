<text x="78" y="704" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Sunday 17:00 → 17:15 · 15 minutes</text>
<path d="M47 681 V728 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="751" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="751" r="5" fill="#00FF99"/>
<text x="78" y="760" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Open again</text>
<text x="78" y="793" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Sunday 17:15, if no override applies.</text>
<rect x="32" y="817" width="576" height="148" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="827" width="5" height="128" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="851" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">17:00 New York = 21:00 UTC in daylight time,</text>
<text x="56" y="881" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">22:00 UTC in standard time. Sequence is not</text>
<text x="56" y="911" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">drawn to a time scale; closure-day overrides</text>
<text x="56" y="941" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">and oracle policy still apply.</text>
