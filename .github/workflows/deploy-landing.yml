name: Deploy Landing

on:
  workflow_dispatch:

concurrency:
  group: plether-landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: landing-admin-mainnet
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Enforce master-only production deployment
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error title=Unsupported workflow ref::Landing production deployments must be dispatched from master."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        working-directory: apps/landing
        run: npm ci

      - name: Build
        working-directory: apps/landing
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.103.0'
          command: pages deploy apps/landing/dist --project-name=plether-landing --branch=master
