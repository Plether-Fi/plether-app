<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-labelledby="usdc-account-flow-title usdc-account-flow-desc" focusable="false">
<title id="usdc-account-flow-title">USDC has distinct places to live</title>
<desc id="usdc-account-flow-desc">Trading Account wallet USDC can be deposited into clearinghouse settlement custody. Free funds, PnL pledge and action reserves have different permissions; withdrawal does not require first making a trade. Trading moves value between eligible buckets. A deposit does not have to pass through a trade before it can be withdrawn.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1030" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / ACCOUNT BALANCES</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">USDC has distinct places to live</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="188" r="14" fill="#9A8890"/>
<circle cx="47" cy="188" r="5" fill="#250917"/>
<text x="80" y="197" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Trading Account wallet</text>
<text x="80" y="234" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Fund with a token transfer or the testnet</text>
<text x="80" y="266" font-size="24" font-weight="400" fill="#250917" data-max-width="528">faucet.</text>
<path d="M47 209 V290 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="319" r="14" fill="#FF512F"/>
<circle cx="47" cy="319" r="5" fill="#250917"/>
<text x="80" y="328" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Deposit margin</text>
<text x="80" y="365" font-size="24" font-weight="400" fill="#250917" data-max-width="528">USDC enters the Margin Clearinghouse.</text>
<text x="32" y="415" font-size="26" font-weight="700" fill="#250917" data-max-width="576">Internal account balances</text>
<rect x="32" y="438" width="576" height="56" rx="8" fill="#FFAB96" stroke="none"/>
<text x="52" y="472" font-size="24" font-weight="400" fill="#250917" data-max-width="536">Free settlement — eligible for actions</text>
<rect x="32" y="504" width="576" height="56" rx="8" fill="#FFAB96" stroke="none"/>
<text x="52" y="538" font-size="24" font-weight="400" fill="#250917" data-max-width="536">PnL pledge — backs position price risk</text>
<rect x="32" y="570" width="576" height="56" rx="8" fill="#FFAB96" stroke="none"/>
<text x="52" y="604" font-size="24" font-weight="400" fill="#250917" data-max-width="536">Action, order and liquidation reserves</text>
<rect x="32" y="652" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="690" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Trading moves value between eligible buckets.</text>
<text x="50" y="722" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">A deposit does not have to pass through a</text>
<text x="50" y="754" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">trade before it can be withdrawn.</text>
<circle cx="47" cy="821" r="14" fill="#9A8890"/>
<circle cx="47" cy="821" r="5" fill="#250917"/>
<text x="80" y="830" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Withdraw eligible free USDC</text>
<text x="80" y="867" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Subject to reserves, carry and</text>
<text x="80" y="899" font-size="24" font-weight="400" fill="#250917" data-max-width="528">account-health checks.</text>
<path d="M47 842 V923 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="952" r="14" fill="#00FF99"/>
<circle cx="47" cy="952" r="5" fill="#250917"/>
<text x="80" y="961" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Owner wallet receives USDC</text>
<text x="80" y="998" font-size="24" font-weight="400" fill="#250917" data-max-width="528">After the sponsored withdrawal succeeds.</text>
</svg>
