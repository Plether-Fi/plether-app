<text x="78" y="263" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Requires Arbitrum Sepolia ETH. Inclusion within</text>
<text x="78" y="293" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">5 minutes of the hour rolls to the next hour.</text>
<text x="78" y="323" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Cancellable before boundary.</text>
<text x="32" y="373" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">Strict 4-phase hourly settlement order</text>
<rect x="32" y="385" width="280" height="118" rx="10" fill="#3B212D" stroke="#00FF99" stroke-width="1.5"/>
<rect x="42" y="388" width="260" height="4" rx="2" fill="#00FF99" stroke="none"/>
