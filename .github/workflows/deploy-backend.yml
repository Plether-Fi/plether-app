name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sepolia
          - mainnet
      bootstrap:
        description: Allow the first image push before API and basket task definitions exist
        required: false
        default: false
        type: boolean
      deployment_scope:
        description: Deploy every backend service or only the API
        required: false
        default: all
        type: choice
        options:
          - all
          - api

concurrency:
  # Shared with candle-admin.yml; never replace the deployed writer mode while
  # an approved candle mutation is still running.
  group: plether-backend-mutation-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  TARGET_ENV: ${{ inputs.environment }}

jobs:
  pyth-config-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: plether-${{ github.run_id }}

      - name: Validate deployed Pyth configuration
        env:
          ALLOW_MISSING_TASK_DEFINITIONS: ${{ inputs.bootstrap && 'true' || 'false' }}
          AWS_MAX_ATTEMPTS: '3'
          AWS_PAGER: ''
          AWS_RETRY_MODE: standard
          UPGRADED_PYTH_HERMES_URL: https://pyth.dourolabs.app/hermes
        run: |
          set -euo pipefail
          umask 077

          task_def_dir=$(mktemp -d)
          trap 'rm -rf "$task_def_dir"' EXIT
          validation_failed=false
          api_definition_validated=false
          basket_definition_validated=false
          pyth_api_key_secret_refs=()
          pyth_feed_ids=(
            "0xa995d00bb36a63cef7fd2c287dc105fc8f3d93779f062f09551b0af3e81ec30b"
            "0xef2c98c804ba503c6a707e38be4dfbb16683775f195b091252bf24693042fd52"
            "0x84c2dde9633d93d1bcad84e7dc41c9d56578b7ec52fabedc1f335d673df0a7c1"
            "0x3112b03a41c910ed446852aacf67118cb1bec67b2cd0b9a214c58cc0eaa2ecca"
            "0x8ccb376aa871517e807358d4e3cf0bc7fe4950474dbe6c9ffc21ef64e43fc676"
            "0x0b1e3297e69f162877b577b0d6a47a0d63b2392bc8499e6540da4187a63e28f8"
          )

          report_failure() {
            local task_family=$1
            local container_name=$2
            local reason=$3
            echo "::error title=Pyth ECS preflight failed::${task_family}/${container_name}: ${reason} Apply infra/terraform for ${TARGET_ENV}, then rerun this workflow."
            validation_failed=true
          }

          validate_pyth_container() {
            local task_family=$1
            local container_name=$2
            local requires_perps_admission=$3
            local definition_role=$4
            local task_def_file="${task_def_dir}/${container_name}.json"
            local aws_error_file="${task_def_dir}/${task_family}.error"

            if ! aws ecs describe-task-definition \
                --task-definition "$task_family" \
                --query taskDefinition.containerDefinitions \
                --output json \
                --cli-connect-timeout 5 \
                --cli-read-timeout 10 \
                > "$task_def_file" 2> "$aws_error_file"; then
              if grep -Fq "Unable to describe task definition" "$aws_error_file"; then
                echo "::warning::Skipping ${task_family}/${container_name} until Terraform creates its task definition"
              else
                report_failure "$task_family" "$container_name" \
                  "AWS did not return the task definition, so its Pyth configuration could not be verified."
              fi
              return
            fi

            local container_count
            container_count=$(jq --arg container "$container_name" \
              '[.[] | select(.name == $container)] | length' "$task_def_file")
            if [ "$container_count" -ne 1 ]; then
              report_failure "$task_family" "$container_name" \
                "expected exactly one matching container definition."
              return
            fi

            local hermes_count
            hermes_count=$(jq --arg container "$container_name" \
              '[.[] | select(.name == $container) | .environment[]? | select(.name == "PYTH_HERMES_URL")] | length' \
              "$task_def_file")
            if [ "$hermes_count" -ne 1 ]; then
              report_failure "$task_family" "$container_name" \
                "PYTH_HERMES_URL must be configured exactly once."
              return
            fi

            local normalized_hermes_url
            normalized_hermes_url=$(jq -r --arg container "$container_name" \
              '.[]
               | select(.name == $container)
               | .environment[]
               | select(.name == "PYTH_HERMES_URL")
               | .value
               | if type == "string" then
                   sub("/+$"; "")
                 else
                   ""
                 end' \
              "$task_def_file")
            if [ "$normalized_hermes_url" != "$UPGRADED_PYTH_HERMES_URL" ]; then
              report_failure "$task_family" "$container_name" \
                "PYTH_HERMES_URL must use the upgraded hosted Hermes endpoint."
              return
            fi

            local api_key_secret_count
            api_key_secret_count=$(jq --arg container "$container_name" \
              '[.[] | select(.name == $container) | .secrets[]? | select(.name == "PYTH_API_KEY")] | length' \
              "$task_def_file")
            if [ "$api_key_secret_count" -ne 1 ]; then
              report_failure "$task_family" "$container_name" \
                "PYTH_API_KEY must have exactly one ECS secret reference."
              return
            fi

            if ! jq -e --arg container "$container_name" \
                '.[]
                 | select(.name == $container)
                 | .secrets[]
                 | select(.name == "PYTH_API_KEY")
                 | (.valueFrom // "")
                 | type == "string" and (gsub("^\\s+|\\s+$"; "") | length > 0)' \
                "$task_def_file" > /dev/null; then
              report_failure "$task_family" "$container_name" \
                "PYTH_API_KEY has an empty ECS secret reference."
              return
            fi

            if [ "$requires_perps_admission" = true ] && \
                ! jq -e --arg container "$container_name" \
                  '(.[] | select(.name == $container)) as $definition
                   | ["PERPS_CHAIN_ID", "PERPS_ORDER_ROUTER", "PERPS_PLETHER_ORACLE"] as $requiredEnvironment
                   | ($definition.secrets // [] | map(select(.name == "PERPS_RPC_URL"))) as $rpcSecrets
                   | ($definition.environment // [] | map(select(.name as $name | $requiredEnvironment | index($name)))) as $perpsEnvironment
                   | ($rpcSecrets | length) == 1
                   and (($rpcSecrets[0].valueFrom // "") | type == "string" and (gsub("^\\s+|\\s+$"; "") | length > 0))
                   and ($perpsEnvironment | length) == ($requiredEnvironment | length)
                   and (([$perpsEnvironment[].name] | sort) == ($requiredEnvironment | sort))
                   and all($perpsEnvironment[]; ((.value // "") | type == "string" and (gsub("^\\s+|\\s+$"; "") | length > 0)))' \
                  "$task_def_file" > /dev/null; then
              report_failure "$task_family" "$container_name" \
                "on-chain payload admission requires non-empty PERPS_RPC_URL, PERPS_CHAIN_ID, PERPS_ORDER_ROUTER, and PERPS_PLETHER_ORACLE references."
              return
            fi

            local api_key_secret_ref
            api_key_secret_ref=$(jq -r --arg container "$container_name" \
              '.[]
               | select(.name == $container)
               | .secrets[]
               | select(.name == "PYTH_API_KEY")
               | .valueFrom' \
              "$task_def_file")

            local secret_ref_seen=false
            local existing_secret_ref
            if [ "${#pyth_api_key_secret_refs[@]}" -gt 0 ]; then
              for existing_secret_ref in "${pyth_api_key_secret_refs[@]}"; do
                if [ "$existing_secret_ref" = "$api_key_secret_ref" ]; then
                  secret_ref_seen=true
                  break
                fi
              done
            fi
            if [ "$secret_ref_seen" = false ]; then
              pyth_api_key_secret_refs+=("$api_key_secret_ref")
            fi

            case "$definition_role" in
              api) api_definition_validated=true ;;
              basket) basket_definition_validated=true ;;
              *)
                report_failure "$task_family" "$container_name" \
                  "workflow configuration supplied an unknown task-definition role."
                return
                ;;
            esac

            echo "Pyth ECS configuration is ready for ${task_family}/${container_name}"
          }

          probe_pyth_api_key() {
            local secret_ref=$1
            local probe_number=$2
            local ssm_error_file="${task_def_dir}/ssm-${probe_number}.error"
            local key_header_file="${task_def_dir}/pyth-key-${probe_number}.header"
            local response_file="${task_def_dir}/pyth-response-${probe_number}.json"
            local curl_error_file="${task_def_dir}/pyth-curl-${probe_number}.error"
            local pyth_api_key

            if ! pyth_api_key=$(aws ssm get-parameter \
                --name "$secret_ref" \
                --with-decryption \
                --query Parameter.Value \
                --output text \
                --cli-connect-timeout 5 \
                --cli-read-timeout 10 \
                2> "$ssm_error_file"); then
              echo "::error title=Pyth entitlement preflight failed::Could not resolve PYTH_API_KEY reference ${probe_number} from SSM. Apply infra/terraform for ${TARGET_ENV} with a valid FX-entitled key, then rerun this workflow."
              validation_failed=true
              return
            fi

            if [[ "$pyth_api_key" == *$'\n'* || "$pyth_api_key" == *$'\r'* ]]; then
              unset pyth_api_key
              echo "::error title=Pyth entitlement preflight failed::PYTH_API_KEY reference ${probe_number} contains an invalid line break. Replace the SSM value, then rerun this workflow."
              validation_failed=true
              return
            fi
            pyth_api_key="${pyth_api_key#"${pyth_api_key%%[![:space:]]*}"}"
            pyth_api_key="${pyth_api_key%"${pyth_api_key##*[![:space:]]}"}"
            if [ -z "$pyth_api_key" ] || [ "$pyth_api_key" = "None" ]; then
              unset pyth_api_key
              echo "::error title=Pyth entitlement preflight failed::PYTH_API_KEY reference ${probe_number} resolves to an empty value. Apply infra/terraform for ${TARGET_ENV} with a valid FX-entitled key, then rerun this workflow."
              validation_failed=true
              return
            fi

            printf 'Authorization: Bearer %s\n' "$pyth_api_key" > "$key_header_file"
            unset pyth_api_key

            local curl_args=(
              --silent
              --fail
              --get
              --proto '=https'
              --tlsv1.2
              --connect-timeout 5
              --max-time 12
              --retry 2
              --retry-delay 1
              --retry-max-time 30
              --retry-all-errors
              --header "@${key_header_file}"
              --output "$response_file"
              --write-out '%{http_code}'
              --data-urlencode 'parsed=true'
            )
            local feed_id
            for feed_id in "${pyth_feed_ids[@]}"; do
              curl_args+=(--data-urlencode "ids[]=${feed_id}")
            done

            local http_status
            if ! http_status=$(curl "${curl_args[@]}" \
                "${UPGRADED_PYTH_HERMES_URL}/v2/updates/price/latest" \
                2> "$curl_error_file"); then
              rm -f "$key_header_file"
              echo "::error title=Pyth entitlement preflight failed::PYTH_API_KEY reference ${probe_number} could not fetch all six basket feeds from upgraded Hermes. Confirm the key has FX-feed access, then rerun this workflow."
              validation_failed=true
              return
            fi
            rm -f "$key_header_file"

            if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error title=Pyth entitlement preflight failed::Upgraded Hermes returned a non-2xx status for PYTH_API_KEY reference ${probe_number}. Confirm the key has FX-feed access, then rerun this workflow."
              validation_failed=true
              return
            fi

            local expected_feed_ids_json
            expected_feed_ids_json=$(printf '%s\n' "${pyth_feed_ids[@]}" \
              | jq -Rsc 'split("\n") | map(select(length > 0))')
            if ! jq -e --argjson expected "$expected_feed_ids_json" \
                'def normalizeFeedId:
                   if type == "string" then ascii_downcase | sub("^0x"; "") else null end;
                 (.parsed | type == "array")
                 and (.binary.data
                   | type == "array"
                   and length > 0
                   and all(.[]; type == "string" and length > 0))
                 and (([.parsed[]?.id | normalizeFeedId] | sort)
                   == ($expected | map(normalizeFeedId) | sort))' \
                "$response_file" > /dev/null; then
              echo "::error title=Pyth entitlement preflight failed::Upgraded Hermes did not return the exact six configured basket feeds for PYTH_API_KEY reference ${probe_number}. Confirm the key's FX entitlements, then rerun this workflow."
              validation_failed=true
              return
            fi

            echo "Pyth API key reference ${probe_number} can fetch all six configured basket feeds"
          }

          validate_pyth_container "plether-${TARGET_ENV}" "plether-api" true api
          validate_pyth_container "plether-${TARGET_ENV}-workers" "plether-basket-worker" true basket
          validate_pyth_container "plether-${TARGET_ENV}-basket-worker" "plether-basket-worker" true basket

          if [ "$api_definition_validated" != true ] || [ "$basket_definition_validated" != true ]; then
            if [ "$ALLOW_MISSING_TASK_DEFINITIONS" = true ]; then
              echo "::warning title=Pyth ECS bootstrap override::Proceeding without both required task-definition topologies because the manual bootstrap override was explicitly enabled."
            else
              echo "::error title=Pyth ECS topology preflight failed::A backend rollout requires the API task definition and at least one consolidated or standalone basket-worker task definition. Apply infra/terraform for ${TARGET_ENV}; use the manual bootstrap override only for first-time provisioning."
              validation_failed=true
            fi
          fi

          if [ "$validation_failed" = true ]; then
            exit 1
          fi

          if [ "${#pyth_api_key_secret_refs[@]}" -gt 0 ]; then
            probe_number=0
            for secret_ref in "${pyth_api_key_secret_refs[@]}"; do
              probe_number=$((probe_number + 1))
              probe_pyth_api_key "$secret_ref" "$probe_number"
            done
          fi

          if [ "$validation_failed" = true ]; then
            exit 1
          fi

  lp-settlement-config-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: plether-${{ github.run_id }}

      - name: Validate deployed LP settlement topology
        env:
          ALLOW_MISSING_TASK_DEFINITIONS: ${{ inputs.bootstrap && 'true' || 'false' }}
          AWS_MAX_ATTEMPTS: '3'
          AWS_PAGER: ''
          AWS_RETRY_MODE: standard
        run: |
          set -euo pipefail
          umask 077

          task_def_dir=$(mktemp -d)
          trap 'rm -rf "$task_def_dir"' EXIT

          families=(
            "plether-${TARGET_ENV}-workers"
            "plether-${TARGET_ENV}-keeper"
          )
          detected_mode=""
          detected_config=""
          missing_definition=false
          workers_definition_validated=false

          for family in "${families[@]}"; do
            task_def_file="${task_def_dir}/${family}.json"
            if ! aws ecs describe-task-definition \
                --task-definition "$family" \
                --query taskDefinition.containerDefinitions \
                --output json \
                --cli-connect-timeout 5 \
                --cli-read-timeout 10 \
                > "$task_def_file"; then
              missing_definition=true
              echo "::warning::LP settlement preflight could not load ${family}."
              continue
            fi

            if ! jq --exit-status \
                --arg expected_signer_suffix ":parameter/plether/${TARGET_ENV}/lp-settlement-private-key" \
                '
                def env_map:
                  reduce (.environment // [])[] as $entry ({}; .[$entry.name] = $entry.value);
                def valid_address:
                  type == "string"
                  and test("^0x[0-9A-Fa-f]{40}$")
                  and ascii_downcase != "0x0000000000000000000000000000000000000000";
                def integer_between($minimum; $maximum):
                  type == "string"
                  and test("^(0|[1-9][0-9]*)$")
                  and ((tonumber >= $minimum) and (tonumber <= $maximum));
                def exactly_one_named($entries; $name):
                  ([($entries // [])[] | select(.name == $name)] | length) == 1;
                def exactly_one_nonempty_secret($entries; $name):
                  ([($entries // [])[] | select(.name == $name)]) as $matches
                  | ($matches | length) == 1
                  and ($matches[0].valueFrom | type == "string" and length > 0);

                ([.[] | select(.name == "plether-keeper")]) as $keepers
                | ($keepers[0]) as $keeper
                | ($keeper | env_map) as $env
                | ($env.LP_SETTLEMENT_MODE // "") as $mode
                | ([($keeper.secrets // [])[] | select(.name == "LP_SETTLEMENT_PRIVATE_KEY")]) as $settlement_signers
                | ($keepers | length) == 1
                and all(
                  [
                    "PERPS_CHAIN_ID",
                    "PERPS_HOUSE_POOL",
                    "PERPS_SENIOR_VAULT",
                    "PERPS_JUNIOR_VAULT",
                    "PERPS_SETTLEMENT_MONITOR_LENS",
                    "PERPS_ORDER_ROUTER",
                    "PERPS_CFD_ENGINE",
                    "PERPS_PLETHER_ORACLE",
                    "KEEPER_CONFIRMATIONS",
                    "KEEPER_GAS_BUFFER_BPS",
                    "KEEPER_FEE_BUFFER_BPS",
                    "LP_SETTLEMENT_MODE",
                    "LP_SETTLEMENT_POLL_SECONDS",
                    "LP_SETTLEMENT_MAX_DRAIN_TRANSACTIONS",
                    "LP_SETTLEMENT_PENDING_REPLACEMENT_SECONDS",
                    "LP_SETTLEMENT_MAX_REPLACEMENTS",
                    "LP_SETTLEMENT_MAX_TX_COST_WEI"
                  ][];
                  . as $name | exactly_one_named($keeper.environment; $name)
                )
                and all(
                  ["DATABASE_URL", "PERPS_RPC_URL", "KEEPER_PRIVATE_KEY"][];
                  . as $name | exactly_one_nonempty_secret($keeper.secrets; $name)
                )
                and ([($keeper.environment // [])[] | select(.name == "LP_SETTLEMENT_ENABLED")] | length == 0)
                and ($settlement_signers | length <= 1)
                and all($settlement_signers[]; (.valueFrom | type == "string" and endswith($expected_signer_suffix)))
                and ($mode == "off" or ($settlement_signers | length == 1))
                and ($mode == "off" or ([($keeper.secrets // [])[] | select(.name != "LP_SETTLEMENT_PRIVATE_KEY" and .valueFrom == $settlement_signers[0].valueFrom)] | length == 0))
                and ($mode == "off" or $mode == "observe" or $mode == "execute")
                and ($env.PERPS_HOUSE_POOL | valid_address)
                and ($env.PERPS_SENIOR_VAULT | valid_address)
                and ($env.PERPS_JUNIOR_VAULT | valid_address)
                and ($env.PERPS_SETTLEMENT_MONITOR_LENS | valid_address)
                and ($env.PERPS_ORDER_ROUTER | valid_address)
                and ($env.PERPS_CFD_ENGINE | valid_address)
                and ($env.PERPS_PLETHER_ORACLE | valid_address)
                and ([
                  $env.PERPS_HOUSE_POOL,
                  $env.PERPS_SENIOR_VAULT,
                  $env.PERPS_JUNIOR_VAULT,
                  $env.PERPS_SETTLEMENT_MONITOR_LENS,
                  $env.PERPS_ORDER_ROUTER,
                  $env.PERPS_CFD_ENGINE,
                  $env.PERPS_PLETHER_ORACLE
                ] | map(ascii_downcase) | unique | length == 7)
                and (($env.PERPS_HOUSE_POOL | ascii_downcase) != ($env.PERPS_SENIOR_VAULT | ascii_downcase))
                and (($env.PERPS_HOUSE_POOL | ascii_downcase) != ($env.PERPS_JUNIOR_VAULT | ascii_downcase))
                and (($env.PERPS_SENIOR_VAULT | ascii_downcase) != ($env.PERPS_JUNIOR_VAULT | ascii_downcase))
                and (($env.PERPS_SETTLEMENT_MONITOR_LENS | ascii_downcase) != ($env.PERPS_HOUSE_POOL | ascii_downcase))
                and (($env.PERPS_SETTLEMENT_MONITOR_LENS | ascii_downcase) != ($env.PERPS_SENIOR_VAULT | ascii_downcase))
                and (($env.PERPS_SETTLEMENT_MONITOR_LENS | ascii_downcase) != ($env.PERPS_JUNIOR_VAULT | ascii_downcase))
                and ($env.LP_SETTLEMENT_POLL_SECONDS == "15")
                and ($env.KEEPER_CONFIRMATIONS | integer_between(1; 10000))
                and ($env.LP_SETTLEMENT_MAX_DRAIN_TRANSACTIONS | integer_between(1; 4))
                and ($env.LP_SETTLEMENT_PENDING_REPLACEMENT_SECONDS | integer_between(60; 3600))
                and ($env.LP_SETTLEMENT_MAX_REPLACEMENTS | integer_between(0; 3))
                and (($env.LP_SETTLEMENT_MAX_TX_COST_WEI // "") | test("^(0|[1-9][0-9]*)$"))
                and ($mode != "execute" or $env.LP_SETTLEMENT_MAX_TX_COST_WEI != "0")
                and ($mode == "off" or $env.PERPS_CHAIN_ID == "421614")
              ' "$task_def_file" > /dev/null; then
              echo "::error title=LP settlement ECS preflight failed::${family}/plether-keeper is missing required fail-closed addresses, limits, mode, chain, or signer reference. Apply infra/terraform for ${TARGET_ENV}, then rerun this workflow."
              exit 1
            fi

            family_mode=$(jq -r '
              .[]
              | select(.name == "plether-keeper")
              | (.environment // [])[]
              | select(.name == "LP_SETTLEMENT_MODE")
              | .value
            ' "$task_def_file")
            if [ -n "$detected_mode" ] && [ "$family_mode" != "$detected_mode" ]; then
              echo "::error title=LP settlement ECS preflight failed::Keeper task definitions disagree on LP_SETTLEMENT_MODE (${detected_mode} versus ${family_mode}). Apply Terraform before deploying."
              exit 1
            fi
            detected_mode="$family_mode"

            family_config=$(jq --compact-output '
              .[]
              | select(.name == "plether-keeper")
              | {
                  environment: ((.environment // []) | sort_by(.name)),
                  secrets: ((.secrets // []) | sort_by(.name))
                }
            ' "$task_def_file")
            if [ -n "$detected_config" ] && [ "$family_config" != "$detected_config" ]; then
              echo "::error title=LP settlement ECS preflight failed::Consolidated and standalone keeper task definitions have different environment or secret bindings. Apply Terraform before deploying."
              exit 1
            fi
            detected_config="$family_config"

            if [ "$family" = "plether-${TARGET_ENV}-workers" ]; then
              workers_definition_validated=true
            fi
          done

          if [ "$missing_definition" = true ]; then
            if [ -z "$detected_mode" ]; then
              if [ "$ALLOW_MISSING_TASK_DEFINITIONS" = true ]; then
                echo "::warning title=LP settlement bootstrap override::Proceeding without a keeper task definition because the manual bootstrap override was explicitly enabled."
                exit 0
              fi
              echo "::error title=LP settlement ECS topology preflight failed::No keeper task definition exists. Apply infra/terraform for ${TARGET_ENV}; use bootstrap only for first-time provisioning."
              exit 1
            fi
            echo "::warning title=LP settlement topology::Only one keeper task-definition topology exists; this is permitted when it matches the configured runtime mode."
          fi

          if [ -z "$detected_mode" ]; then
            echo "::error title=LP settlement ECS preflight failed::No LP_SETTLEMENT_MODE was found."
            exit 1
          fi
          if [ "$TARGET_ENV" != "sepolia" ] && [ "$detected_mode" != "off" ]; then
            echo "::error title=LP settlement environment guard failed::${TARGET_ENV} must keep LP settlement off until a production vault release is reviewed."
            exit 1
          fi

          if [ "$detected_mode" != "off" ]; then
            if [ "$workers_definition_validated" != true ]; then
              echo "::error title=LP settlement consolidated topology missing::Active LP settlement requires the consolidated plether-${TARGET_ENV}-workers task definition."
              exit 1
            fi

            services_file="${task_def_dir}/services.json"
            aws ecs describe-services \
              --cluster "plether-${TARGET_ENV}" \
              --services plether-workers plether-keeper \
              --output json \
              --cli-connect-timeout 5 \
              --cli-read-timeout 10 \
              > "$services_file"

            if ! jq --exit-status '
                ([.services[] | select(.serviceName == "plether-workers" and .desiredCount == 1)] | length) == 1
                and ([.services[] | select(.serviceName == "plether-keeper" and .desiredCount != 0)] | length) == 0
                and ([.failures[]? | select((.arn // "") | endswith("plether-workers"))] | length) == 0
              ' "$services_file" > /dev/null; then
              echo "::error title=LP settlement singleton guard failed::Active LP settlement requires plether-workers desiredCount=1 and, if present, plether-keeper desiredCount=0."
              exit 1
            fi
          fi

          echo "LP settlement ECS configuration is valid in ${detected_mode} mode for ${TARGET_ENV}"

  build:
    needs: [pyth-config-preflight, lp-settlement-config-preflight]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.images.outputs.image }}
      log_router_image: ${{ steps.images.outputs.log_router_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: plether-${{ github.run_id }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve backend image tags
        id: images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$TARGET_ENV" = "mainnet" ]; then
            ECR_REPOSITORY=plether-api
            LOG_ROUTER_REPOSITORY=plether-otel-log-router
          else
            ECR_REPOSITORY=plether-api-$TARGET_ENV
            LOG_ROUTER_REPOSITORY=plether-otel-log-router-$TARGET_ENV
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"
          echo "log_router_image=$ECR_REGISTRY/$LOG_ROUTER_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "log_router_image_latest=$ECR_REGISTRY/$LOG_ROUTER_REPOSITORY:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.images.outputs.image }}
            ${{ steps.images.outputs.image_latest }}
          cache-from: type=gha,scope=plether-backend-linux-arm64
          cache-to: type=gha,mode=max,scope=plether-backend-linux-arm64,ignore-error=true

      - name: Build and push log router image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/otel-log-router/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.images.outputs.log_router_image }}
            ${{ steps.images.outputs.log_router_image_latest }}
          cache-from: type=gha,scope=plether-otel-log-router-linux-arm64
          cache-to: type=gha,mode=max,scope=plether-otel-log-router-linux-arm64,ignore-error=true

  deploy:
    needs: build
    if: ${{ inputs.bootstrap != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # Sepolia sets consolidate_workers=true, so Insights runs inside plether-workers.
        # Keep the standalone Insights service out of this matrix while that setting is enabled.
        include: ${{ fromJson((inputs.deployment_scope == 'api') && format('[{{"environment":"{0}","task_suffix":"","service_name":"plether-api","container_name":"plether-api"}}]', inputs.environment) || ((inputs.environment == 'mainnet') && '[{"environment":"mainnet","task_suffix":"","service_name":"plether-api","container_name":"plether-api"},{"environment":"mainnet","task_suffix":"-workers","service_name":"plether-workers","container_name":"plether-keeper"},{"environment":"mainnet","task_suffix":"-basket-worker","service_name":"plether-basket-worker","container_name":"plether-basket-worker"},{"environment":"mainnet","task_suffix":"-perps-indexer","service_name":"plether-perps-indexer","container_name":"plether-perps-indexer"},{"environment":"mainnet","task_suffix":"-liquidation-worker","service_name":"plether-liquidation-worker","container_name":"plether-liquidation-worker"},{"environment":"mainnet","task_suffix":"-insights-worker","service_name":"plether-insights-worker","container_name":"plether-insights-worker"}]' || '[{"environment":"sepolia","task_suffix":"","service_name":"plether-api","container_name":"plether-api"},{"environment":"sepolia","task_suffix":"-workers","service_name":"plether-workers","container_name":"plether-keeper"},{"environment":"sepolia","task_suffix":"-basket-worker","service_name":"plether-basket-worker","container_name":"plether-basket-worker"},{"environment":"sepolia","task_suffix":"-perps-indexer","service_name":"plether-perps-indexer","container_name":"plether-perps-indexer"},{"environment":"sepolia","task_suffix":"-liquidation-worker","service_name":"plether-liquidation-worker","container_name":"plether-liquidation-worker"}]')) }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: plether-${{ github.run_id }}

      - name: Get current task definition
        id: task-definition-status
        run: |
          if aws ecs describe-task-definition \
              --task-definition plether-${{ matrix.environment }}${{ matrix.task_suffix }} \
              --query taskDefinition > task-def.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping ${{ matrix.service_name }} until Terraform creates its task definition and service"
          fi

      - name: Validate Sepolia faucet guard configuration
        if: matrix.environment == 'sepolia' && matrix.task_suffix == '' && steps.task-definition-status.outputs.exists == 'true'
        run: |
          jq --exit-status \
            --arg container "${{ matrix.container_name }}" \
            '
            .containerDefinitions
            | map(select(.name == $container))
            | .[0] as $api
            | ($api.secrets // []) as $secrets
            | ($api.environment // []) as $environment
            | ([$secrets[] | select(.name == "FAUCET_PRIVATE_KEY")] | length) == 1
              and ([$secrets[] | select(
                .name == "FAUCET_PROXY_ORIGIN_TOKEN"
                and ((.valueFrom // "") | type == "string" and length > 0)
              )] | length) == 1
              and ([$environment[] | select(
                .name == "FAUCET_CLIENT_REQUESTS_PER_HOUR" and .value == "20"
              )] | length) == 1
              and ([$environment[] | select(
                .name == "FAUCET_GLOBAL_REQUESTS_PER_HOUR" and .value == "200"
              )] | length) == 1
            ' task-def.json > /dev/null

      - name: Patch Sepolia API task definition
        if: matrix.environment == 'sepolia' && matrix.task_suffix == '' && steps.task-definition-status.outputs.exists == 'true'
        run: |
          jq \
            --arg container "${{ matrix.container_name }}" \
            '
            def upsert_env($name; $value):
              .environment = (
                ((.environment // []) | map(select(.name != $name)))
                + [{"name": $name, "value": $value}]
              );
            def upsert_secret($name; $valueFrom):
              .secrets = (
                ((.secrets // []) | map(select(.name != $name)))
                + [{"name": $name, "valueFrom": $valueFrom}]
              );

            .containerDefinitions |= map(
              if .name == $container then
                (.secrets // [] | map(select(.name == "PERPS_RPC_URL")) | .[0].valueFrom) as $rpcSecret
                |
                upsert_env("CHAIN_ID"; "421614")
                | upsert_env("INDEXER_START_BLOCK"; "280884700")
                | upsert_secret("RPC_URL"; $rpcSecret)
              else
                .
              end
            )
            ' task-def.json > task-def.patched.json
          mv task-def.patched.json task-def.json

      - name: Patch liquidation worker cost controls
        if: matrix.task_suffix == '-liquidation-worker' && steps.task-definition-status.outputs.exists == 'true'
        env:
          LIQUIDATION_WORKER_POLL_SECONDS: "600"
          LIQUIDATION_WORKER_SCAN_BATCH_SIZE: "1000"
          LIQUIDATION_WORKER_MULTICALL_SIZE: "10"
        run: |
          jq \
            --arg liquidationPollSeconds "$LIQUIDATION_WORKER_POLL_SECONDS" \
            --arg liquidationScanBatchSize "$LIQUIDATION_WORKER_SCAN_BATCH_SIZE" \
            --arg liquidationMulticallSize "$LIQUIDATION_WORKER_MULTICALL_SIZE" \
            '
            def upsert_env($name; $value):
              .environment = (
                ((.environment // []) | map(select(.name != $name)))
                + [{"name": $name, "value": $value}]
              );

            .containerDefinitions |= map(
              if .name == "plether-liquidation-worker" then
                upsert_env("LIQUIDATION_WORKER_POLL_SECONDS"; $liquidationPollSeconds)
                | upsert_env("LIQUIDATION_WORKER_SCAN_BATCH_SIZE"; $liquidationScanBatchSize)
                | upsert_env("LIQUIDATION_WORKER_MULTICALL_SIZE"; $liquidationMulticallSize)
              else
                .
              end
            )
            ' task-def.json > task-def.patched.json
          mv task-def.patched.json task-def.json

      - name: Validate Terraform-managed Sepolia release manifest
        if: matrix.environment == 'sepolia' && steps.task-definition-status.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition plether-sepolia \
            --query taskDefinition > canonical-api-task-def.json

          jq --exit-status \
            --arg releaseId "testnet-trading-2026-09" \
            --slurpfile canonical canonical-api-task-def.json \
            '
            def env_map:
              reduce (.environment // [])[] as $entry ({}; .[$entry.name] = $entry.value);
            def address_names: [
              "PERPS_USDC",
              "PERPS_ORDER_ROUTER",
              "PERPS_ORDER_LIFECYCLE_BOOK",
              "PERPS_HOUSE_POOL",
              "PERPS_PLETHER_ORACLE",
              "PERPS_CFD_ENGINE",
              "PERPS_CFD_ENGINE_SETTLEMENT_SIDECAR",
              "PERPS_CFD_ENGINE_LENS",
              "PERPS_MARGIN_CLEARINGHOUSE",
              "PERPS_ACCOUNT_LENS"
            ];
            def manifest_names:
              address_names + [
                "PERPS_INDEXER_START_BLOCK",
                "INSIGHTS_ACTIVE_COMPETITION_SLUG",
                "INSIGHTS_COMPETITION_RELEASE_ID"
              ];
            def valid_address:
              type == "string"
              and test("^0x[0-9A-Fa-f]{40}$")
              and ascii_downcase != "0x0000000000000000000000000000000000000000";
            def valid_september_manifest($env):
              $env.INSIGHTS_ACTIVE_COMPETITION_SLUG == $releaseId
              and $env.INSIGHTS_COMPETITION_RELEASE_ID == $releaseId
              and ([address_names[] as $name | $env[$name] | valid_address] | all)
              and ([address_names[] as $name | $env[$name] | ascii_downcase] | unique | length) == (address_names | length)
              and (($env.PERPS_INDEXER_START_BLOCK // "") | test("^[1-9][0-9]*$"));
            def valid_bounded_v2_release($env):
              (($env.PERPS_USDC // "") | ascii_downcase) == "0xabee441b564dc084857468fa244aee0a444b07df"
              and (($env.PERPS_ORDER_ROUTER // "") | ascii_downcase) == "0x2b9790ad11ce5fb1b91ac3415b08cd1ec7d0ce0b"
              and (($env.PERPS_ORDER_LIFECYCLE_BOOK // "") | ascii_downcase) == "0xca57215a3859462eb380ea40969762ac89d99522"
              and (($env.PERPS_CFD_ENGINE // "") | ascii_downcase) == "0x2cedc3f0059f0e9c1099be96974f459e58c428d6"
              and (($env.PERPS_MARGIN_CLEARINGHOUSE // "") | ascii_downcase) == "0x91c85540a1f64c9aec2c801fcc927f037d619f17"
              and (($env.PERPS_HOUSE_POOL // "") | ascii_downcase) == "0x7b8b851cb3783611bcda4cf2f7d5a2f8c6106f98"
              and $env.PERPS_INDEXER_START_BLOCK == "305627052";
            def valid_registration_only_manifest($env):
              $env.INSIGHTS_ACTIVE_COMPETITION_SLUG == $releaseId
              and (($env.INSIGHTS_COMPETITION_RELEASE_ID // "") == "");
            def same_manifest($actual; $expected):
              [manifest_names[] as $name | $actual[$name] == $expected[$name]] | all;
            def release_consumer:
              .name == "plether-api"
              or .name == "plether-perps-indexer"
              or .name == "plether-insights-worker";

            ($canonical[0].containerDefinitions
              | map(select(.name == "plether-api"))
              | .[0] // null) as $canonicalApi
            | if $canonicalApi == null then
                error("canonical Sepolia API task definition has no plether-api container")
              else
                ($canonicalApi | env_map) as $expected
                | if valid_bounded_v2_release($expected) | not then
                    error("canonical Sepolia API task definition does not use the pinned bounded-V2 release")
                  elif ($expected.INSIGHTS_ACTIVE_COMPETITION_SLUG // "") != $releaseId then
                    true
                  elif valid_registration_only_manifest($expected) then
                    [.containerDefinitions[] | select(release_consumer)] as $consumers
                    | if ($consumers | length) == 0 then
                        true
                      elif ([
                        $consumers[]
                        |
                        (. | env_map) as $actual
                        | valid_registration_only_manifest($actual)
                          and same_manifest($actual; $expected)
                      ] | all) then
                        true
                      else
                        error("task definition release consumers do not match the canonical September registration-only manifest")
                      end
                  elif valid_september_manifest($expected) | not then
                    error("canonical Sepolia API task definition has an invalid September release manifest")
                  else
                    [.containerDefinitions[] | select(release_consumer)] as $consumers
                    | if ($consumers | length) == 0 then
                        true
                      elif ([
                        $consumers[]
                        |
                        (. | env_map) as $actual
                        | valid_september_manifest($actual)
                          and same_manifest($actual; $expected)
                      ] | all) then
                        true
                      else
                        error("task definition release consumers do not match the canonical September manifest")
                      end
                  end
              end
            ' task-def.json > /dev/null

      - name: Update application images and service version
        if: steps.task-definition-status.outputs.exists == 'true'
        env:
          APPLICATION_IMAGE: ${{ needs.build.outputs.image }}
          SERVICE_VERSION: ${{ github.sha }}
        run: |
          jq \
            --arg applicationImage "$APPLICATION_IMAGE" \
            --arg serviceVersion "$SERVICE_VERSION" \
            '
            def upsert_env($name; $value):
              .environment = (
                ((.environment // []) | map(select(.name != $name)))
                + [{"name": $name, "value": $value}]
              );

            .containerDefinitions |= map(
              if .name == "otel-log-router" then
                upsert_env("SERVICE_VERSION"; $serviceVersion)
              else
                .image = $applicationImage
              end
            )
            ' task-def.json > task-def.updated.json
          mv task-def.updated.json task-def.json

      - name: Update log router image
        if: steps.task-definition-status.outputs.exists == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: otel-log-router
          image: ${{ needs.build.outputs.log_router_image }}

      - name: Ensure API health check grace period
        if: matrix.service_name == 'plether-api' && steps.task-definition-status.outputs.exists == 'true'
        env:
          ECS_CLUSTER: plether-${{ matrix.environment }}
          ECS_SERVICE: ${{ matrix.service_name }}
          ECS_HEALTH_CHECK_GRACE_PERIOD_SECONDS: "300"
        run: |
          set -euo pipefail

          applied_grace_period="$(
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --health-check-grace-period-seconds "$ECS_HEALTH_CHECK_GRACE_PERIOD_SECONDS" \
              --query 'service.healthCheckGracePeriodSeconds' \
              --output text \
              --no-cli-pager
          )"

          if [ "$applied_grace_period" != "$ECS_HEALTH_CHECK_GRACE_PERIOD_SECONDS" ]; then
            echo "::error title=ECS health-check grace update failed::Expected ${ECS_HEALTH_CHECK_GRACE_PERIOD_SECONDS}s, got ${applied_grace_period}s."
            exit 1
          fi

      - name: Deploy to ECS
        if: steps.task-definition-status.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service_name }}
          cluster: plether-${{ matrix.environment }}
          wait-for-service-stability: true
