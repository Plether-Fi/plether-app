name: Audit runtime image availability

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: sepolia
        options:
          - sepolia
          - mainnet
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [Deploy Backend, Deploy Alto, Recover Sepolia backend image]
    types: [completed]
    branches: [master]

concurrency:
  group: runtime-image-audit-${{ inputs.environment || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit_sepolia:
    if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || inputs.environment == 'sepolia')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed audit policy from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Require the provisioned read-only audit role
        env:
          AUDIT_ROLE: ${{ vars.AWS_RUNTIME_IMAGE_AUDIT_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$AUDIT_ROLE" = arn:aws:iam::932542905614:role/plether-sepolia-runtime-image-audit

      - name: Configure read-only audit credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_IMAGE_AUDIT_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '932542905614'
          role-session-name: runtime-image-audit-${{ github.run_id }}

      - name: Audit all configured runtime consumers
        run: node scripts/runtime-image-audit.mjs --config config/runtime-image-audit-sepolia.json --output runtime-image-audit-sepolia.json

      - name: Retain audit evidence, including failed inventories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-image-audit-sepolia-${{ github.run_id }}
          path: runtime-image-audit-sepolia.json
          if-no-files-found: warn
          retention-days: 90

  audit_mainnet:
    if: >-
      github.ref == 'refs/heads/master' &&
      (inputs.environment == 'mainnet' || (github.event_name != 'workflow_dispatch' && vars.AWS_RUNTIME_IMAGE_AUDIT_MAINNET_ROLE_ARN != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed audit policy from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Require the provisioned mainnet read-only audit role
        id: role
        env:
          AUDIT_ROLE: ${{ vars.AWS_RUNTIME_IMAGE_AUDIT_MAINNET_ROLE_ARN }}
          MAINNET_ACCOUNT_ID: ${{ vars.AWS_MAINNET_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$MAINNET_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AUDIT_ROLE" = "arn:aws:iam::${MAINNET_ACCOUNT_ID}:role/plether-mainnet-runtime-image-audit"
          echo "account_id=$MAINNET_ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Configure mainnet read-only audit credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_IMAGE_AUDIT_MAINNET_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ steps.role.outputs.account_id }}
          role-session-name: runtime-image-audit-mainnet-${{ github.run_id }}

      - name: Audit all configured mainnet runtime consumers
        run: node scripts/runtime-image-audit.mjs --config config/runtime-image-audit-mainnet.json --output runtime-image-audit-mainnet.json

      - name: Retain mainnet audit evidence, including failed inventories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-image-audit-mainnet-${{ github.run_id }}
          path: runtime-image-audit-mainnet.json
          if-no-files-found: warn
          retention-days: 90
