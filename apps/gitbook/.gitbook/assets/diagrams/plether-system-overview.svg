<rect x="44" y="451" width="254" height="5" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="490" font-size="24" font-weight="700" fill="#00FF99" data-max-width="246">Traders</text>
<path d="M48 507 L294 507" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="533" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">LONG or SHORT USD</text>
<text x="48" y="569" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Gas-sponsored</text>
<text x="48" y="599" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Trading Account</text>
<text x="48" y="629" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">posts USDG margin.</text>
<path d="M171 645 V665 m-6 -6 6 6 6 -6" stroke="#00FF99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="701" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Delayed global FIFO</text>
<text x="48" y="737" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Commit first; fill on</text>
<text x="48" y="767" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">the next eligible Pyth</text>
<text x="48" y="797" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">tick.</text>
<rect x="330" y="448" width="278" height="408" rx="12" fill="#3B212D" stroke="#F7D977" stroke-width="1.5"/>
