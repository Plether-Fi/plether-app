<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1292" viewBox="0 0 640 1292" role="img" aria-labelledby="sponsorship-vs-order-failure-lifecycles-title sponsorship-vs-order-failure-lifecycles-desc" focusable="false">
<title id="sponsorship-vs-order-failure-lifecycles-title">Two lifecycles, different failures</title>
<desc id="sponsorship-vs-order-failure-lifecycles-desc">Sponsored transaction success and order execution are different lifecycles. V2 transient oracle, gas, engine or receipt failures can remain pending; only terminal reasons fail the order. A revert, dropped operation or unknown outcome is not proof that an order exists. Reconcile its receipt and client order ID. An engine panic is not automatically a terminal order failure. Read the stored V2 receipt and pending reason.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1292" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / ORDER TROUBLESHOOTING</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Two lifecycles, different</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">failures</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<text x="32" y="248" font-size="24" font-weight="700" fill="#250917" data-max-width="576">01 · Sponsored transaction</text>
<circle cx="47" cy="291" r="14" fill="#FF512F"/>
<circle cx="47" cy="291" r="5" fill="#250917"/>
<text x="80" y="300" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Prepare → sign → submit</text>
<text x="80" y="337" font-size="24" font-weight="400" fill="#250917" data-max-width="528">An inclusion receipt must confirm successful</text>
<text x="80" y="369" font-size="24" font-weight="400" fill="#250917" data-max-width="528">execution.</text>
<rect x="32" y="393" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="431" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">A revert, dropped operation or unknown</text>
<text x="50" y="463" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">outcome is not proof that an order exists.</text>
<text x="50" y="495" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Reconcile its receipt and client order ID.</text>
<text x="32" y="577" font-size="24" font-weight="700" fill="#250917" data-max-width="576">02 · Delayed order</text>
<rect x="32" y="603" width="278" height="505" rx="12" fill="#F7E4B2" stroke="none"/>
<text x="48" y="645" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Still pending</text>
<path d="M48 666 L294 666" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="696" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Temporary</text>
<text x="48" y="729" font-size="26" font-weight="700" fill="#250917" data-max-width="246">blockers</text>
<text x="48" y="768" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Queue, oracle timing,</text>
<text x="48" y="800" font-size="24" font-weight="400" fill="#250917" data-max-width="246">insufficient gas,</text>
<text x="48" y="832" font-size="24" font-weight="400" fill="#250917" data-max-width="246">engine or receipt</text>
<text x="48" y="864" font-size="24" font-weight="400" fill="#250917" data-max-width="246">failure.</text>
<rect x="330" y="603" width="278" height="505" rx="12" fill="#FFAB96" stroke="none"/>
<text x="346" y="645" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Terminal result</text>
<path d="M346 666 L592 666" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="696" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Executed</text>
<text x="346" y="735" font-size="24" font-weight="400" fill="#250917" data-max-width="246">The requested trade</text>
<text x="346" y="767" font-size="24" font-weight="400" fill="#250917" data-max-width="246">was applied.</text>
<text x="346" y="805" font-size="22" font-weight="700" fill="#250917" data-max-width="246">OR</text>
<text x="346" y="847" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Failed</text>
<text x="346" y="886" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Expiry, slippage,</text>
<text x="346" y="918" font-size="24" font-weight="400" fill="#250917" data-max-width="246">config or mode</text>
<text x="346" y="950" font-size="24" font-weight="400" fill="#250917" data-max-width="246">mismatch, risk-off,</text>
<text x="346" y="982" font-size="24" font-weight="400" fill="#250917" data-max-width="246">planner or</text>
<text x="346" y="1014" font-size="24" font-weight="400" fill="#250917" data-max-width="246">constraint</text>
<text x="346" y="1046" font-size="24" font-weight="400" fill="#250917" data-max-width="246">rejection,</text>
<text x="346" y="1078" font-size="24" font-weight="400" fill="#250917" data-max-width="246">liquidation.</text>
<rect x="32" y="1132" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="1170" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">An engine panic is not automatically a</text>
<text x="50" y="1202" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">terminal order failure. Read the stored V2</text>
<text x="50" y="1234" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">receipt and pending reason.</text>
</svg>
