<svg xmlns="http://www.w3.org/2000/svg" width="640" height="997" viewBox="0 0 640 997" role="img" aria-labelledby="weekly-market-state-schedule-title weekly-market-state-schedule-desc" focusable="false">
<title id="weekly-market-state-schedule-title">The FX weekend, in New York time</title>
<desc id="weekly-market-state-schedule-desc">Regular weekly phases in America/New_York: open until Friday 16:30, close-only with live policy until 17:00, frozen until Sunday 17:00, then close-only until 17:15. UTC offsets change with US daylight saving. 17:00 New York = 21:00 UTC in daylight time, 22:00 UTC in standard time. Sequence is not drawn to a time scale; closure-day overrides and oracle policy still apply.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="997" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · MARKET CALENDAR</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">The FX weekend, in New York time</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<rect x="32" y="162" width="576" height="196" rx="12" fill="#3B212D" stroke="#9A8890" stroke-width="1.5"/>
<text x="52" y="198" font-size="22" font-weight="700" fill="#D8CBD0" data-max-width="536">Weekly phase strip (not to scale · NY time)</text>
