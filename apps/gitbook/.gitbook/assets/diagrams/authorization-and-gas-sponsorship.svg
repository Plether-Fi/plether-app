<svg xmlns="http://www.w3.org/2000/svg" width="640" height="856" viewBox="0 0 640 856" role="img" aria-labelledby="authorization-and-gas-sponsorship-title authorization-and-gas-sponsorship-desc" focusable="false">
<title id="authorization-and-gas-sponsorship-title">Sponsorship before the signature</title>
<desc id="authorization-and-gas-sponsorship-desc">Prepare the action, request stub data, estimate gas and attach final paymaster data before the owner signs. Then submit the signed operation and verify the result. Sponsorship does not pay your margin, execution bounties or trading costs.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="856" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / AUTHORIZATION</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Sponsorship before the</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">signature</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="233" r="14" fill="#9A8890"/>
<circle cx="47" cy="233" r="5" fill="#250917"/>
<text x="80" y="242" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Review the action</text>
<text x="80" y="279" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Check the account, amounts and execution</text>
<text x="80" y="311" font-size="24" font-weight="400" fill="#250917" data-max-width="528">bounds.</text>
<path d="M47 254 V335 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="364" r="14" fill="#9A8890"/>
<circle cx="47" cy="364" r="5" fill="#250917"/>
<text x="80" y="373" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Prepare sponsorship</text>
<text x="80" y="410" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Get stub data, estimate gas and attach final</text>
<text x="80" y="442" font-size="24" font-weight="400" fill="#250917" data-max-width="528">paymaster data.</text>
<path d="M47 385 V466 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="495" r="14" fill="#FF512F"/>
<circle cx="47" cy="495" r="5" fill="#250917"/>
<text x="80" y="504" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Sign in your wallet</text>
<text x="80" y="541" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Authorize the operation including its</text>
<text x="80" y="573" font-size="24" font-weight="400" fill="#250917" data-max-width="528">sponsorship data.</text>
<path d="M47 516 V597 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="626" r="14" fill="#00FF99"/>
<circle cx="47" cy="626" r="5" fill="#250917"/>
<text x="80" y="635" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Submit and verify</text>
<text x="80" y="672" font-size="24" font-weight="400" fill="#250917" data-max-width="528">The sponsor covers eligible network gas.</text>
<text x="80" y="704" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Check onchain success.</text>
<rect x="32" y="728" width="576" height="96" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="766" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Sponsorship does not pay your margin,</text>
<text x="50" y="798" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">execution bounties or trading costs.</text>
</svg>
