name: Deploy Sepolia Kernel test frontend
run-name: Kernel canary Pages / ${{ inputs.candidate_sha }}

# This workflow must be installed on master before dispatch. It checks out an
# exact non-master PR commit for an isolated preview or the Sepolia homepage.
on:
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: Open kernel-canary/* PR branch targeting master
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed 40-character PR head commit
        required: true
        type: string
      deployment:
        description: Planned deployment id for staging, exact attested AA_KERNEL_PROFILE_JSON id for active canary
        required: true
        type: string
      phase:
        description: Stage the preview, activate it, or enable two-wallet homepage opt-in
        required: true
        default: stage_preview
        type: choice
        options:
          - stage_preview
          - active_canary
          - sepolia_homepage
      external_owner:
        description: External wallet's public owner address for the homepage test
        required: false
        type: string
      privy_owner:
        description: Privy wallet's public owner address for the homepage test
        required: false
        type: string

concurrency:
  group: plether-kernel-canary-pages
  cancel-in-progress: false

env:
  PROJECT: ${{ inputs.phase == 'sepolia_homepage' && 'plether-testnet' || 'plether-kernel-canary' }}
  PRODUCTION_BRANCH: ${{ inputs.phase == 'sepolia_homepage' && 'master' || 'kernel-canary' }}
  BACKEND_ORIGIN: https://api.sepolia.plether.com
  PREVIEW_ORIGIN: ${{ inputs.phase == 'sepolia_homepage' && 'https://app.sepolia.plether.com' || 'https://plether-kernel-canary.pages.dev' }}
  WRANGLER_VERSION: 4.103.0

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    steps:
      - name: Require exact same-repository PR commit and protected AA environment
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT: ${{ inputs.deployment }}
          PHASE: ${{ inputs.phase }}
          EXTERNAL_OWNER: ${{ inputs.external_owner }}
          PRIVY_OWNER: ${{ inputs.privy_owner }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$CANDIDATE_BRANCH" =~ ^kernel-canary/[a-z0-9][a-z0-9._-]{0,63}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT" =~ ^[a-z0-9][a-z0-9._-]{0,95}$ ]]
          [[ "$PHASE" == stage_preview || "$PHASE" == active_canary || "$PHASE" == sepolia_homepage ]]
          if [ "$PHASE" = sepolia_homepage ]; then
            [[ "$DEPLOYMENT" == kernel-sepolia-direct-v1 ]]
            [[ "$EXTERNAL_OWNER" =~ ^0x[0-9a-fA-F]{40}$ && "$PRIVY_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
            [[ "${EXTERNAL_OWNER,,}" != "${PRIVY_OWNER,,}" ]]
          fi
          branch_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_BRANCH" --jq .object.sha)
          [ "$branch_head" = "$CANDIDATE_SHA" ]
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$CANDIDATE_BRANCH" \
            --base master --state open \
            --json headRefOid,headRepository,headRepositoryOwner > "$RUNNER_TEMP/kernel-canary-prs.json"
          jq --exit-status --arg sha "$CANDIDATE_SHA" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "plether-app" \
            'any(.[]; .headRefOid == $sha and
              .headRepositoryOwner.login == $owner and .headRepository.name == $repo)' \
            "$RUNNER_TEMP/kernel-canary-prs.json" >/dev/null
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/environments/aa-admin-sepolia" \
            > "$RUNNER_TEMP/kernel-canary-environment.json"
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/environments/aa-admin-sepolia/deployment-branch-policies?per_page=100" \
            > "$RUNNER_TEMP/kernel-canary-branches.json"
          jq --exit-status '
            .name == "aa-admin-sepolia" and .can_admins_bypass == false and
            .deployment_branch_policy.custom_branch_policies == true and
            ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 1 and
            ([.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review == false) and
            ([.protection_rules[]? | select(.type == "required_reviewers")][0].reviewers | length) > 0
          ' "$RUNNER_TEMP/kernel-canary-environment.json" >/dev/null
          jq --exit-status \
            '.branch_policies | length == 1 and .[0].name == "master" and .[0].type == "branch"' \
            "$RUNNER_TEMP/kernel-canary-branches.json" >/dev/null

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aa-admin-sepolia
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the exact reviewed canary commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Check immutable source
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'

      - name: Install pinned npm and frontend dependencies
        working-directory: apps/frontend
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm ci

      - name: Install Insights story dependencies
        working-directory: apps/insights
        run: npm ci

      - name: Check out pinned TradingView assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tradingview/charting_library
          ref: f2a61ba473ec254b69f9c1377c67e4b81eff853b
          token: ${{ secrets.TRADINGVIEW_GITHUB_TOKEN }}
          persist-credentials: false
          path: .private/tradingview-charting-library

      - name: Install pinned TradingView runtime
        working-directory: apps/frontend
        run: npm run tradingview:install -- "$GITHUB_WORKSPACE/.private/tradingview-charting-library"

      - name: Build exact Sepolia Kernel and Privy candidate
        working-directory: apps/frontend
        env:
          VITE_DEFAULT_CHAIN_ID: '421614'
          VITE_PERPS_AA_MANIFEST_URL: /perps-aa-manifest.json
          VITE_PERPS_KERNEL_AA_DEPLOYMENT: ${{ inputs.deployment }}
          VITE_PERPS_KERNEL_HOMEPAGE_OPT_IN: ${{ inputs.phase == 'sepolia_homepage' && 'true' || 'false' }}
          VITE_PERPS_KERNEL_TEST_OWNERS: ${{ inputs.external_owner }},${{ inputs.privy_owner }}
          VITE_DEPLOYMENT_ENV: sepolia
          VITE_PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ vars.PRIVY_TRADING_CLIENT_ID }}
          VITE_PERPS_POSITION_PROTECTION_ENABLED: ${{ vars.VITE_PERPS_POSITION_PROTECTION_ENABLED_SEPOLIA || 'false' }}
          VITE_MAINNET_RPC_URL: ${{ vars.VITE_MAINNET_RPC_URL }}
          VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}
          VITE_ARBITRUM_SEPOLIA_RPC_URL: ${{ vars.VITE_ARBITRUM_SEPOLIA_RPC_URL }}
          VITE_TRADINGVIEW_CHARTS_ENABLED: 'true'
          VITE_POSTHOG_KEY: ${{ inputs.phase == 'sepolia_homepage' && secrets.VITE_POSTHOG_KEY || '' }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.VITE_POSTHOG_REPLAY_SAMPLE_RATE }}
          POSTHOG_SOURCEMAPS: ${{ inputs.phase == 'sepolia_homepage' && '1' || '0' }}
        run: |
          set -euo pipefail
          [[ "$VITE_PRIVY_APP_ID" =~ ^[a-zA-Z0-9_-]+$ ]]
          if [ -n "$VITE_PRIVY_CLIENT_ID" ]; then
            [[ "$VITE_PRIVY_CLIENT_ID" =~ ^[a-zA-Z0-9_-]+$ ]]
          fi
          npm run build
          test -s dist/perps-aa-manifest.json
          node ../../scripts/validate-perps-deployment.mjs aa \
            ../../config/perps/arbitrum-sepolia-v2.0.0.json \
            dist/perps-aa-manifest.json public/perps-aa-manifest.json
          test ! -e dist/charting_library/sameorigin.html
          test ! -e dist/charting_library/charting_library.d.ts
          test -s dist/charting_library/charting_library.standalone.js

      - name: Upload private homepage source maps
        if: inputs.phase == 'sepolia_homepage'
        uses: PostHog/upload-source-maps@991172e085213c222c61d2ba6a0b9e57c81e5066 # v2
        env:
          POSTHOG_RELEASE_MODE: symbol-set
        with:
          directory: apps/frontend/dist/assets
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: '208816'
          host: https://eu.posthog.com
          release-name: plether-web-sepolia
          release-version: ${{ inputs.candidate_sha }}
          cli-version: '0.18.3'
          delete-after-upload: 'true'

      - name: Remove source maps before publication
        working-directory: apps/frontend
        run: node scripts/remove-source-maps.mjs dist

      - name: Record exact source SHA in build payload
        working-directory: apps/frontend
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT: ${{ inputs.deployment }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$CANDIDATE_SHA" --arg deployment "$DEPLOYMENT" --arg phase "$PHASE" \
            '{candidateSha:$sha, deployment:$deployment, phase:$phase}' > dist/kernel-canary-build.json

      - name: Upload isolated canary payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-canary-${{ inputs.candidate_sha }}
          path: apps/frontend/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aa-admin-sepolia
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      KERNEL_ACTIVE_MANIFEST_FILTER: >-
        .jsonrpc == "2.0" and .id == 1 and .result.version == 1
        and (.result.readiness | keys == ["eth", "sponsored"] and .eth == true and (.sponsored | type) == "boolean")
        and ($phase != "sepolia_homepage" or .result.readiness.sponsored == false
          or .result.paymaster == "0x9ff288e30489c4e29b13d6ba960612b5d6db8d50")
        and (.result.profile | .deployment == $deployment and .chainId == 421614 and .entryPointVersion == "0.9"
          and keys == ([
            "deployment", "chainId", "entryPoint", "entryPointVersion", "entryPointCodeHash",
            "accountVersion", "accountIndex", "accountCodeHash", "factory", "factoryCodeHash",
            "implementation", "implementationCodeHash", "validator", "validatorCodeHash"
          ] | sort))
    steps:
      - name: Download reviewed canary payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-canary-${{ inputs.candidate_sha }}
          path: apps/frontend/dist

      - name: Recheck exact same-repository PR head before Pages write
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_BRANCH" =~ ^kernel-canary/[a-z0-9][a-z0-9._-]{0,63}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          branch_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_BRANCH" --jq .object.sha)
          [ "$branch_head" = "$CANDIDATE_SHA" ]
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$CANDIDATE_BRANCH" \
            --base master --state open \
            --json headRefOid,headRepository,headRepositoryOwner > "$RUNNER_TEMP/kernel-canary-prs.json"
          jq --exit-status --arg sha "$CANDIDATE_SHA" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" --arg repo "plether-app" \
            'any(.[]; .headRefOid == $sha and
              .headRepositoryOwner.login == $owner and .headRepository.name == $repo)' \
            "$RUNNER_TEMP/kernel-canary-prs.json" >/dev/null

      - name: Verify exact candidate payload
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT: ${{ inputs.deployment }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          jq --exit-status --arg sha "$CANDIDATE_SHA" --arg deployment "$DEPLOYMENT" --arg phase "$PHASE" \
            '.candidateSha == $sha and .deployment == $deployment and .phase == $phase' \
            apps/frontend/dist/kernel-canary-build.json >/dev/null
          test -s apps/frontend/dist/_worker.js

      - name: Require closed Kernel route while staging wallet connections
        if: inputs.phase == 'stage_preview'
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --output "$RUNNER_TEMP/kernel-stage-route.json" \
            --write-out '%{http_code}' --header 'Content-Type: application/json' \
            --data-binary '{' "$BACKEND_ORIGIN/api/aa/kernel/rpc")
          [ "$status" = 404 ] || {
            echo '::error::Staging requires the canary Kernel API route to remain closed.'
            exit 1
          }

      - name: Verify active canary route and dedicated origin credential
        if: inputs.phase != 'stage_preview'
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          PHASE: ${{ inputs.phase }}
          AA_PROXY_ORIGIN_TOKEN: ${{ secrets.AA_PROXY_ORIGIN_TOKEN }}
          KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN: ${{ secrets.KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN }}
        run: |
          set -euo pipefail
          for name in AA_PROXY_ORIGIN_TOKEN KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN; do
            token=${!name}
            [[ "$token" =~ ^[0-9a-f]{64}$ ]]
            echo "::add-mask::$token"
          done
          [ "$AA_PROXY_ORIGIN_TOKEN" != "$KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN" ]
          unauthenticated_status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --output "$RUNNER_TEMP/kernel-unauth.json" \
            --write-out '%{http_code}' --header 'Content-Type: application/json' \
            --header 'CF-Connecting-IP: 192.0.2.10' \
            --data-binary '{' "$BACKEND_ORIGIN/api/aa/kernel/rpc")
          [ "$unauthenticated_status" = 403 ]
          jq --exit-status '.error.data.reason == "PROXY_AUTH_FAILED"' \
            "$RUNNER_TEMP/kernel-unauth.json" >/dev/null
          authenticated_status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --output "$RUNNER_TEMP/kernel-auth.json" \
            --write-out '%{http_code}' --header 'Content-Type: application/json' \
            --header 'CF-Connecting-IP: 192.0.2.10' \
            --header "X-Plether-AA-Proxy-Token: $KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN" \
            --data-binary '{' "$BACKEND_ORIGIN/api/aa/kernel/rpc")
          [ "$authenticated_status" = 400 ]
          jq --exit-status '.error.data.reason == "INVALID_REQUEST"' \
            "$RUNNER_TEMP/kernel-auth.json" >/dev/null

          curl --silent --show-error --fail-with-body --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --output "$RUNNER_TEMP/kernel-manifest.json" \
            --header 'Content-Type: application/json' --header 'CF-Connecting-IP: 192.0.2.10' \
            --header "X-Plether-AA-Proxy-Token: $KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN" \
            --data-binary '{"jsonrpc":"2.0","id":1,"method":"plether_getKernelManifest","params":[]}' \
            "$BACKEND_ORIGIN/api/aa/kernel/rpc"
          jq --exit-status --arg deployment "$DEPLOYMENT" --arg phase "$PHASE" \
            "$KERNEL_ACTIVE_MANIFEST_FILTER" "$RUNNER_TEMP/kernel-manifest.json" >/dev/null || {
              echo '::error::The active route must serve the requested direct-factory profile with ETH readiness. Homepage sponsorship requires the pinned canary paymaster.'
              exit 1
            }

      - name: Configure isolated Pages project and secrets
        if: inputs.phase != 'sepolia_homepage'
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AA_PROXY_ORIGIN_TOKEN: ${{ secrets.AA_PROXY_ORIGIN_TOKEN }}
          FAUCET_PROXY_ORIGIN_TOKEN: ${{ secrets.FAUCET_PROXY_ORIGIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$AA_PROXY_ORIGIN_TOKEN" =~ ^[0-9a-f]{64}$ ]]
          test -n "$FAUCET_PROXY_ORIGIN_TOKEN"
          echo "::add-mask::$AA_PROXY_ORIGIN_TOKEN"
          echo "::add-mask::$FAUCET_PROXY_ORIGIN_TOKEN"
          cat > wrangler.toml <<EOF
          name = "plether-kernel-canary"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-06-22"

          [vars]
          SEPOLIA_BACKEND_URL = "https://api.sepolia.plether.com"
          MAINNET_BACKEND_URL = "https://api.sepolia.plether.com"
          EOF
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/kernel-pages-project.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$status" = 404 ]; then
            npx --yes wrangler@4.103.0 pages project create "$PROJECT" \
              --production-branch="$PRODUCTION_BRANCH" \
              --compatibility-date=2026-06-22
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
              > "$RUNNER_TEMP/kernel-pages-project.json"
          else
            [ "$status" = 200 ]
          fi
          jq --exit-status --arg project "$PROJECT" --arg branch "$PRODUCTION_BRANCH" \
            '.success == true and .result.name == $project and .result.production_branch == $branch' \
            "$RUNNER_TEMP/kernel-pages-project.json" >/dev/null
          printf '%s\n' "$AA_PROXY_ORIGIN_TOKEN" |
            npx --yes wrangler@4.103.0 pages secret put AA_PROXY_ORIGIN_TOKEN --project-name="$PROJECT"
          printf '%s\n' "$FAUCET_PROXY_ORIGIN_TOKEN" |
            npx --yes wrangler@4.103.0 pages secret put FAUCET_PROXY_ORIGIN_TOKEN --project-name="$PROJECT"

      - name: Verify the existing Sepolia homepage and capture its rollback target
        if: inputs.phase == 'sepolia_homepage'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$PROJECT" == plether-testnet && "$PRODUCTION_BRANCH" == master ]]
          pages_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$pages_api" | jq -er '
            select(.success and .result.name == "plether-testnet" and .result.production_branch == "master")
            | .result.canonical_deployment
            | select(.environment == "production" and .latest_stage.status == "success")
            | .id | select(test("^[0-9a-fA-F-]{36}$"))' > "$RUNNER_TEMP/sepolia-prior-deployment-id"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$pages_api/domains/app.sepolia.plether.com" | jq -e '
              .success and .result.name == "app.sepolia.plether.com" and .result.status == "active"' >/dev/null
          curl --fail --silent --show-error --max-time 20 "$PREVIEW_ORIGIN/perps-aa-manifest.json" | \
            jq -S . > "$RUNNER_TEMP/sepolia-legacy-manifest.json"
          jq -S . apps/frontend/dist/perps-aa-manifest.json | cmp - "$RUNNER_TEMP/sepolia-legacy-manifest.json"
          curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_supportedEntryPoints","params":[]}' \
            "$PREVIEW_ORIGIN/api/perps/v1/aa/rpc" | jq -ce '
              select(.id == 1 and (.result | type == "array" and length > 0)) | .result' \
              > "$RUNNER_TEMP/sepolia-legacy-entrypoints.json"

      - name: Bind dedicated Kernel credential only for active canary
        if: inputs.phase != 'stage_preview'
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN: ${{ secrets.KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN" |
            npx --yes wrangler@4.103.0 pages secret put KERNEL_CANARY_AA_PROXY_ORIGIN_TOKEN --project-name="$PROJECT"

      - name: Publish to the exact Sepolia Pages project
        id: publish
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.103.0 pages deploy dist \
            --project-name="$PROJECT" --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$CANDIDATE_SHA"

      - name: Verify the published Sepolia release
        if: steps.publish.outcome == 'success'
        id: smoke
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT: ${{ inputs.deployment }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          attempts=5
          if [ "$PHASE" = sepolia_homepage ]; then
            bundle=$(sed -nE 's/.*src="(\/assets\/[^" ]+\.js)".*/\1/p' apps/frontend/dist/index.html)
            [[ "$bundle" =~ ^/assets/[a-zA-Z0-9_.-]+\.js$ ]] || {
              echo '::error::The reviewed artifact must contain exactly one application script.'
              exit 1
            }
            attempts=12
          fi

          fetch() {
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 8 "$@"
          }

          verify_release() {
            local content_type
            fetch "$PREVIEW_ORIGIN/kernel-canary-build.json" | \
              jq -e --arg sha "$CANDIDATE_SHA" --arg phase "$PHASE" --arg deployment "$DEPLOYMENT" '
                .candidateSha == $sha and .phase == $phase and .deployment == $deployment' >/dev/null || {
              echo 'The reviewed release marker is unavailable at the expected hostname.'
              return 1
            }
            fetch "$PREVIEW_ORIGIN/" > "$RUNNER_TEMP/kernel-canary-index.html" && \
              test -s "$RUNNER_TEMP/kernel-canary-index.html" || {
              echo 'The homepage returned no HTML.'
              return 1
            }
            if [ "$PHASE" != sepolia_homepage ]; then
              return 0
            fi
            grep -F "src=\"$bundle\"" "$RUNNER_TEMP/kernel-canary-index.html" >/dev/null || {
              echo 'The homepage does not reference the reviewed application script.'
              return 1
            }
            fetch "$PREVIEW_ORIGIN/?kernel-test=1" | grep -F "src=\"$bundle\"" >/dev/null || {
              echo 'The opt-in request does not reference the reviewed homepage script.'
              return 1
            }
            content_type=$(fetch --output /dev/null --write-out '%{content_type}' "$PREVIEW_ORIGIN$bundle") && \
              [[ "$content_type" == application/javascript* || "$content_type" == text/javascript* ]] || {
              echo 'The reviewed application script is unavailable as JavaScript.'
              return 1
            }
            fetch "$PREVIEW_ORIGIN/perps-aa-manifest.json" | \
              jq -S . | cmp -s - "$RUNNER_TEMP/sepolia-legacy-manifest.json" || {
              echo 'The legacy Trading Account manifest differs from the production baseline.'
              return 1
            }
            fetch -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_supportedEntryPoints","params":[]}' \
              "$PREVIEW_ORIGIN/api/perps/v1/aa/rpc" | jq -ce 'select(.id == 1)|.result' | \
              cmp -s - "$RUNNER_TEMP/sepolia-legacy-entrypoints.json" || {
              echo 'The legacy Trading Account RPC does not return its production EntryPoints.'
              return 1
            }
            fetch --max-time 20 -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"plether_getKernelManifest","params":[]}' \
              "$PREVIEW_ORIGIN/api/perps/v1/aa/kernel/rpc" > "$RUNNER_TEMP/kernel-live-manifest.json" || {
              echo 'The live Kernel RPC did not return a manifest.'
              return 1
            }
            jq --exit-status --arg deployment "$DEPLOYMENT" --arg phase "$PHASE" \
              "$KERNEL_ACTIVE_MANIFEST_FILTER" "$RUNNER_TEMP/kernel-live-manifest.json" >/dev/null || {
              echo 'The live Kernel RPC did not return the reviewed profile with ETH readiness and the pinned paymaster when sponsored.'
              return 1
            }
          }

          # Pages can serve the new marker before all homepage paths and bindings converge.
          for ((attempt=1; attempt<=attempts; attempt++)); do
            printf 'Checking the published release (attempt %d of %d).\n' "$attempt" "$attempts"
            if verify_release; then
              break
            fi
            [ "$attempt" -lt "$attempts" ] || {
              echo '::error::The published release did not pass its live checks.'
              exit 1
            }
            sleep 5
          done
          printf 'Deployed reviewed SHA %s to %s in %s phase.\n' \
            "$CANDIDATE_SHA" "$PREVIEW_ORIGIN" "$PHASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the previous homepage if the reviewed release fails smoke checks
        if: failure() && inputs.phase == 'sepolia_homepage' && steps.publish.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$PROJECT" == plether-testnet ]]
          previous=$(cat "$RUNNER_TEMP/sepolia-prior-deployment-id")
          [[ "$previous" =~ ^[a-fA-F0-9-]{36}$ ]]
          pages_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$pages_api" | \
            jq -e --arg sha "$CANDIDATE_SHA" --arg previous "$previous" '
              .success and (.result.canonical_deployment | .id != $previous and .environment == "production"
              and .deployment_trigger.metadata.commit_hash == $sha)' >/dev/null || {
                echo '::error::Canonical deployment changed. Inspect the homepage before attempting a rollback.'
                exit 1
              }
          curl --fail --silent --show-error --max-time 20 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$pages_api/deployments/$previous/rollback" | jq -e '.success' >/dev/null
          echo 'Restored the previous production deployment on standard Sepolia.'
