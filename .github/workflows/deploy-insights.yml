name: Deploy Insights

on:
  push:
    branches: [master]
    paths:
      - apps/insights/**
      - .github/workflows/deploy-insights.yml
  workflow_dispatch:

concurrency:
  group: deploy-insights-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/insights/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Validate backend origin
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          node --input-type=module --eval '
            const configuredOrigin = process.env.SEPOLIA_BACKEND_URL ?? "";
            let origin;
            try {
              origin = new URL(configuredOrigin);
            } catch {
              origin = null;
            }

            const isHttpsOrigin =
              configuredOrigin === configuredOrigin.trim() &&
              origin?.protocol === "https:" &&
              origin.username === "" &&
              origin.password === "" &&
              origin.pathname === "/" &&
              origin.search === "" &&
              origin.hash === "";

            if (!isHttpsOrigin) {
              console.error("::error title=Invalid Insights backend origin::SEPOLIA_BACKEND_URL must be an HTTPS origin without credentials, a path, query parameters, or a fragment (for example, https://api.example.com).");
              process.exit(1);
            }
          '

      - name: Verify Insights backend is ready
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          STATUS_RESPONSE=$(curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 15 \
            "$SEPOLIA_BACKEND_URL/api/insights/v1/status")

          echo "$STATUS_RESPONSE" | jq --exit-status \
            '.data.competition.scoringVersion and .data.status' >/dev/null

          CURRENT_RELEASE_RESPONSE=$(curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 15 \
            "$SEPOLIA_BACKEND_URL/api/insights/v1/protocol/releases/current")

          echo "$CURRENT_RELEASE_RESPONSE" | jq --exit-status '
            def decimal_string:
              type == "string" and test("^(0|[1-9][0-9]*)$");
            def positive_decimal_string:
              type == "string" and test("^[1-9][0-9]*$");
            def nonnegative_integer:
              type == "number" and floor == . and . >= 0;
            def address:
              type == "string" and test("^0x[0-9a-fA-F]{40}$");
            def availability:
              type == "array" and all(.[];
                type == "object"
                and (.field | type == "string" and length > 0)
                and (.reason | type == "string" and length > 0)
              );

            .data as $data
            | .meta as $meta
            | type == "object"
              and ($data | type == "object")
              and ($meta | type == "object")
              and ($data.releaseId | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
              and ($data.chainId | positive_decimal_string)
              and ($data.explorerEnabled | type == "boolean")
              and ($data.calculationVersion | type == "string" and length > 0)
              and ($data.evidence | type == "object")
              and ($data.availability | availability)
              and ($data.confirmedBlock | type == "object")
              and ($data.confirmedBlock.number | decimal_string)
              and ($data.confirmedBlock.hash | type == "string")
              and ($data.confirmedBlock.timestamp | nonnegative_integer)
              and (
                $data.indexerTimestamp == null
                or ($data.indexerTimestamp | nonnegative_integer)
              )
              and ($data.release | type == "object")
              and ($data.release.releaseId == $data.releaseId)
              and ($data.release.name | type == "string" and length > 0)
              and ($data.release.chainId | nonnegative_integer and . > 0)
              and (($data.release.chainId | tostring) == $data.chainId)
              and ($data.release.deploymentBlock | decimal_string)
              and ($data.release.calculationVersion == $data.calculationVersion)
              and ($data.release.contracts | type == "object")
              and (
                [
                  "usdc",
                  "orderRouter",
                  "orderRouterAdmin",
                  "cfdEngine",
                  "cfdEngineAdmin",
                  "marginClearinghouse",
                  "publicLens",
                  "accountLens",
                  "housePool",
                  "seniorVault",
                  "juniorVault",
                  "pletherOracle"
                ]
                | all(.[]; $data.release.contracts[.] | address)
              )
              and ($meta.cached | type == "boolean")
              and ($meta.chainId == $data.release.chainId)
              and ($meta.blockNumber | nonnegative_integer)
              and ($meta.blockNumber == ($data.confirmedBlock.number | tonumber))
          ' >/dev/null

          EXPLORER_ENABLED=$(echo "$CURRENT_RELEASE_RESPONSE" | jq --raw-output '.data.explorerEnabled')

          if [ "$EXPLORER_ENABLED" = "true" ]; then
            RELEASE_ID=$(echo "$CURRENT_RELEASE_RESPONSE" | jq --raw-output '.data.releaseId')
            CHAIN_ID=$(echo "$CURRENT_RELEASE_RESPONSE" | jq --raw-output '.data.chainId')
            CALCULATION_VERSION=$(echo "$CURRENT_RELEASE_RESPONSE" | jq --raw-output '.data.calculationVersion')

            OVERVIEW_RESPONSE=$(curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --max-time 15 \
              "$SEPOLIA_BACKEND_URL/api/insights/v1/protocol/releases/$RELEASE_ID/overview")

            echo "$OVERVIEW_RESPONSE" | jq --exit-status \
              --arg release_id "$RELEASE_ID" \
              --arg chain_id "$CHAIN_ID" \
              --arg calculation_version "$CALCULATION_VERSION" '
                def positive_decimal_string:
                  type == "string" and test("^[1-9][0-9]*$");
                def nonnegative_decimal_string:
                  type == "string" and test("^(0|[1-9][0-9]*)$");
                def nonnegative_integer:
                  type == "number" and floor == . and . >= 0;
                def positive_integer:
                  type == "number" and floor == . and . > 0;
                def block_hash:
                  type == "string" and test("^0x[0-9a-fA-F]{64}$");
                def availability:
                  type == "array" and all(.[];
                    type == "object"
                    and (.field | type == "string" and length > 0)
                    and (.reason | type == "string" and length > 0)
                  );

                .data as $data
                | .meta as $meta
                | type == "object"
                  and ($data | type == "object")
                  and ($meta | type == "object")
                  and ($data.releaseId == $release_id)
                  and ($data.chainId == $chain_id)
                  and ($data.chainId | positive_decimal_string)
                  and ($data.calculationVersion == $calculation_version)
                  and ($data.evidence | type == "object")
                  and ($data.availability | availability)
                  and ($data.confirmedBlock | type == "object")
                  and ($data.confirmedBlock.number | positive_decimal_string)
                  and ($data.confirmedBlock.hash | block_hash)
                  and ($data.confirmedBlock.timestamp | positive_integer)
                  and ($data.indexerTimestamp | positive_integer)
                  and ($data.overview | type == "object")
                  and ($data.overview.counts | type == "object")
                  and (
                    $data.overview.housePool == null
                    or ($data.overview.housePool | type == "object")
                  )
                  and (
                    $data.overview.protocolStatus == null
                    or ($data.overview.protocolStatus | type == "object")
                  )
                  and ($data.overview.anomalies | type == "array")
                  and ($data.overview.anomalyEvaluation == "complete"
                    or $data.overview.anomalyEvaluation == "partial")
                  and ($data.overview.indexerLagBlocks | nonnegative_decimal_string)
                  and (($data.overview.indexerLagBlocks | tonumber) <= 20)
                  and ($meta.cached | type == "boolean")
                  and (($meta.chainId | tostring) == $chain_id)
                  and ($meta.blockNumber | nonnegative_integer)
                  and ($meta.blockNumber == ($data.confirmedBlock.number | tonumber))
              ' >/dev/null

            # This proves the public API shape and freshness only. Event-count parity
            # remains a separate audited rollout prerequisite because this endpoint
            # does not expose enough evidence to establish parity.
            echo "Protocol Explorer overview is fresh and internally consistent."
          else
            echo "Protocol Explorer is disabled; the feature flag remains the rollout gate."
          fi

      - name: Install dependencies
        working-directory: apps/insights
        run: npm ci

      - name: Lint
        working-directory: apps/insights
        run: npm run lint

      - name: Test
        working-directory: apps/insights
        run: npm test

      - name: Build
        working-directory: apps/insights
        run: npm run build

      - name: Configure Pages bindings
        working-directory: apps/insights
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          cat > wrangler.toml <<EOF
          name = "plether-insights"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-07-17"

          [vars]
          SEPOLIA_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          INSIGHTS_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          EOF

      - name: Ensure Pages project
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.103.0
          command: pages project create plether-insights --production-branch=master --compatibility-date=2026-07-17

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.103.0
          workingDirectory: apps/insights
          command: pages deploy dist --project-name=plether-insights --branch=master

      - name: Attach custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DOMAIN="insights.plether.com"
          PROJECT="plether-insights"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"

          if curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/$DOMAIN" >/dev/null; then
            echo "$DOMAIN is already attached to $PROJECT"
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"$DOMAIN\"}" \
            "$API_BASE"

      - name: Configure DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE="plether.com"
          DOMAIN="insights.plether.com"
          TARGET="plether-insights.pages.dev"
          API_BASE="https://api.cloudflare.com/client/v4"

          ZONE_ID=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          test -n "$ZONE_ID"

          RECORDS=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/zones/$ZONE_ID/dns_records?name=$DOMAIN")
          RECORD_ID=$(echo "$RECORDS" | jq -r '.result[0].id // empty')
          BODY=$(jq -nc --arg name "$DOMAIN" --arg content "$TARGET" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$RECORD_ID" ]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$BODY" \
              "$API_BASE/zones/$ZONE_ID/dns_records/$RECORD_ID"
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$BODY" \
              "$API_BASE/zones/$ZONE_ID/dns_records"
          fi
