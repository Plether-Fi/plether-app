name: Deploy the opt-in Sepolia Kernel test
run-name: Sepolia Kernel test / ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full head SHA of Kernel canary PR 456
        required: true
        type: string
      external_owner:
        description: External wallet's public Arbitrum Sepolia owner address
        required: true
        type: string
      privy_owner:
        description: Privy wallet's public Arbitrum Sepolia owner address
        required: true
        type: string

concurrency:
  group: plether-sepolia-kernel-test
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  EXTERNAL_OWNER: ${{ inputs.external_owner }}
  PRIVY_OWNER: ${{ inputs.privy_owner }}
  TEST_ORIGIN: https://app.sepolia.plether.com
  PROFILE: kernel-sepolia-direct-v1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Verify the candidate and the protected Sepolia environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$GITHUB_REPOSITORY" == Plether-Fi/plether-app ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXTERNAL_OWNER" =~ ^0x[0-9a-fA-F]{40}$ && "$PRIVY_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          [[ "${EXTERNAL_OWNER,,}" != "${PRIVY_OWNER,,}" ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/456" | jq -e --arg sha "$CANDIDATE_SHA" '
            .state == "open" and .base.ref == "master" and .head.ref == "kernel-canary/sep-2026"
            and .head.repo.full_name == "Plether-Fi/plether-app" and .head.sha == $sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/aa-admin-sepolia" | jq -e '
            .can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true
            and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/aa-admin-sepolia/deployment-branch-policies" | jq -e '
            .branch_policies | length == 1 and .[0].name == "master" and .[0].type == "branch"' >/dev/null

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aa-admin-sepolia
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm the source commit
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@plether-fi'
      - name: Install dependencies
        working-directory: apps/frontend
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm ci
      - name: Install Insights story dependencies
        working-directory: apps/insights
        run: npm ci
      - name: Check out the pinned TradingView runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tradingview/charting_library
          ref: f2a61ba473ec254b69f9c1377c67e4b81eff853b
          token: ${{ secrets.TRADINGVIEW_GITHUB_TOKEN }}
          persist-credentials: false
          path: .private/tradingview-charting-library
      - name: Build the Kernel test at its opt-in path
        working-directory: apps/frontend
        env:
          VITE_DEFAULT_CHAIN_ID: '421614'
          VITE_DEPLOYMENT_ENV: sepolia
          VITE_PERPS_KERNEL_AA_DEPLOYMENT: kernel-sepolia-direct-v1
          VITE_PERPS_POSITION_PROTECTION_ENABLED: ${{ vars.VITE_PERPS_POSITION_PROTECTION_ENABLED_SEPOLIA || 'false' }}
          VITE_PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ vars.PRIVY_TRADING_CLIENT_ID }}
          VITE_MAINNET_RPC_URL: ${{ vars.VITE_MAINNET_RPC_URL }}
          VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}
          VITE_ARBITRUM_SEPOLIA_RPC_URL: ${{ vars.VITE_ARBITRUM_SEPOLIA_RPC_URL }}
          VITE_TRADINGVIEW_CHARTS_ENABLED: 'true'
          VITE_PERPS_KERNEL_TEST_OWNERS: ${{ inputs.external_owner }},${{ inputs.privy_owner }}
        run: |
          set -euo pipefail
          [[ "$VITE_PRIVY_APP_ID" =~ ^[a-zA-Z0-9_-]+$ ]]
          npm run tradingview:install -- "$GITHUB_WORKSPACE/.private/tradingview-charting-library"
          npm run build -- --base=/kernel-test/
          node scripts/remove-source-maps.mjs dist
          rm -f dist/_worker.js dist/_redirects
          grep -q 'src="/kernel-test/assets/' dist/index.html
          jq -n --arg sha "$CANDIDATE_SHA" --arg profile "$PROFILE" \
            '{candidateSha:$sha, deployment:$profile, path:"/kernel-test/"}' > dist/kernel-test-build.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sepolia-kernel-test-${{ inputs.candidate_sha }}
          path: apps/frontend/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aa-admin-sepolia
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sepolia-kernel-test-${{ inputs.candidate_sha }}
          path: release/dist
      - name: Verify the build payload and isolated API readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/456" | jq -e --arg sha "$CANDIDATE_SHA" '
            .state == "open" and .base.ref == "master" and .head.ref == "kernel-canary/sep-2026"
            and .head.repo.full_name == "Plether-Fi/plether-app" and .head.sha == $sha' >/dev/null
          jq -e --arg sha "$CANDIDATE_SHA" --arg profile "$PROFILE" '
            .candidateSha == $sha and .deployment == $profile and .path == "/kernel-test/"' release/dist/kernel-test-build.json >/dev/null
          test ! -e release/dist/_worker.js
          node --test scripts/kernel-qualification/sepolia-kernel-test-worker.test.mjs
          curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"plether_getKernelManifest","params":[]}' \
            https://plether-kernel-canary.pages.dev/api/perps/v1/aa/kernel/rpc | jq -e --arg profile "$PROFILE" '
              .result.profile.deployment == $profile and .result.profile.chainId == 421614
              and .result.readiness == {eth:true,sponsored:false}' >/dev/null
          cp scripts/kernel-qualification/sepolia-kernel-test-worker.mjs release/worker.mjs
          cp scripts/kernel-qualification/sepolia-kernel-test.wrangler.json release/wrangler.json
          curl --fail --silent --show-error --max-time 20 "$TEST_ORIGIN/" > "$RUNNER_TEMP/sepolia-root-before.html"
      - name: Deploy only the opt-in Worker route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api_base=https://api.cloudflare.com/client/v4
          zone=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api_base/zones?name=plether.com" | jq -er '.result | select(length == 1) | .[0].id')
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api_base/zones/$zone/workers/routes" | jq -e '
            .success and all(.result[]; (.pattern | test("^(https?://)?app[.]sepolia[.]plether[.]com/kernel-test/"; "i") | not)
              or (.pattern == "https://app.sepolia.plether.com/kernel-test/*" and .script == "plether-sepolia-kernel-test"))' >/dev/null
          npx --yes wrangler@4.103.0 deploy --config release/wrangler.json
      - name: Verify regular Sepolia and the new opt-in URL
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$TEST_ORIGIN/" > "$RUNNER_TEMP/sepolia-root-after.html"
          cmp "$RUNNER_TEMP/sepolia-root-before.html" "$RUNNER_TEMP/sepolia-root-after.html"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 20 "$TEST_ORIGIN/kernel-test/kernel-test-build.json" | \
            jq -e --arg sha "$CANDIDATE_SHA" '.candidateSha == $sha and .path == "/kernel-test/"' >/dev/null
          curl --fail --silent --show-error --max-time 20 "$TEST_ORIGIN/kernel-test/" > "$RUNNER_TEMP/sepolia-kernel-test.html"
          asset=$(sed -nE 's/.*src="(\/kernel-test\/assets\/[^" ]+\.js)".*/\1/p' "$RUNNER_TEMP/sepolia-kernel-test.html" | head -n 1)
          [[ "$asset" =~ ^/kernel-test/assets/[a-zA-Z0-9_.-]+\.js$ ]]
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$TEST_ORIGIN$asset"
          rpc="$TEST_ORIGIN/kernel-test/api/perps/v1/aa/kernel/rpc"
          payload='{"jsonrpc":"2.0","id":1,"method":"plether_getKernelManifest","params":[]}'
          rejected=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            -H 'Origin: https://example.com' -H 'Content-Type: application/json' --data "$payload" "$rpc")
          test "$rejected" = 403
          curl --fail --silent --show-error --max-time 20 -H "Origin: $TEST_ORIGIN" -H 'Content-Type: application/json' \
            --data "$payload" "$rpc" | jq -e --arg profile "$PROFILE" '
            .result.profile.deployment == $profile and .result.profile.chainId == 421614
              and .result.readiness == {eth:true,sponsored:false}' >/dev/null
