<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1486" viewBox="0 0 640 1486" role="img" aria-labelledby="final-collection-priority-title final-collection-priority-desc" focusable="false">
<title id="final-collection-priority-title">Two separate collection paths</title>
<desc id="final-collection-priority-desc">Carry consumes active position margin first, then free USDG. Price losses then use claims and remaining collectible pledge; later action charges can use safely released margin, not residual position backing. A partial close cannot waive action charges. Remaining position backing and other orders’ execution rewards stay protected after carry. Reduce and close orders reserve no execution reward.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1486" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · CLOSE ACCOUNTING</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Two separate collection paths</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Collect accrued carry</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Use active position margin first, then eligible</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">free USDG.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#9A8890"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Keep unpaid carry visible</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Any remainder joins the close action charge;</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">claims and other locked buckets do not fund</text>
<text x="78" y="398" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">the carry checkpoint.</text>
<rect x="32" y="422" width="278" height="832" rx="12" fill="#3B212D" stroke="#FF512F" stroke-width="1.5"/>
<rect x="44" y="425" width="254" height="5" rx="3" fill="#FF512F" stroke="none"/>
<text x="48" y="464" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="246">Price loss</text>
<path d="M48 481 L294 481" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="507" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Net own claims</text>
<text x="48" y="543" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Only this account’s</text>
<text x="48" y="573" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">trader claims.</text>
<path d="M171 589 V609 m-6 -6 6 6 6 -6" stroke="#FF512F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="645" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Consume PnL pledge</text>
<text x="48" y="681" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Within the terminal</text>
<text x="48" y="711" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">collectible cap.</text>
<path d="M171 727 V747 m-6 -6 6 6 6 -6" stroke="#FF512F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="783" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Write off excess</text>
<text x="48" y="819" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Any price loss beyond</text>
<text x="48" y="849" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">that cap.</text>
<rect x="330" y="422" width="278" height="832" rx="12" fill="#3B212D" stroke="#F7D977" stroke-width="1.5"/>
<rect x="342" y="425" width="254" height="5" rx="3" fill="#F7D977" stroke="none"/>
<text x="346" y="464" font-size="24" font-weight="700" fill="#F7D977" data-max-width="246">Action charges</text>
<path d="M346 481 L592 481" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="507" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Withhold from gain</text>
<text x="346" y="543" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Offset a positive</text>
<text x="346" y="573" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">price gain first.</text>
<path d="M469 589 V609 m-6 -6 6 6 6 -6" stroke="#F7D977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="645" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Use eligible funds</text>
<text x="346" y="681" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">VPI clawback reserve,</text>
<text x="346" y="711" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">spendable action</text>
<text x="346" y="741" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">reserve, then free</text>
<text x="346" y="771" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">USDG.</text>
<path d="M469 787 V807 m-6 -6 6 6 6 -6" stroke="#F7D977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="843" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Use safely released</text>
<text x="346" y="873" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">margin</text>
<text x="346" y="909" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Only pledge the close</text>
<text x="346" y="939" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">can release while</text>
<text x="346" y="969" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">preserving</text>
<text x="346" y="999" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">remaining-position</text>
<text x="346" y="1029" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">health.</text>
<path d="M469 1045 V1065 m-6 -6 6 6 6 -6" stroke="#F7D977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="1101" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Full-close fallback</text>
<text x="346" y="1137" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Committed-order</text>
<text x="346" y="1167" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">margin, then waive</text>
<text x="346" y="1197" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">uncollectible</text>
<text x="346" y="1227" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">charges.</text>
<rect x="32" y="1276" width="576" height="178" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="1286" width="5" height="158" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="1310" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">A partial close cannot waive action charges.</text>
<text x="56" y="1340" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">Remaining position backing and other orders’</text>
<text x="56" y="1370" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">execution rewards stay protected after</text>
<text x="56" y="1400" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">carry. Reduce and close orders reserve no</text>
<text x="56" y="1430" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">execution reward.</text>
</svg>
