<text x="346" y="563" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">vaults</text>
<text x="346" y="599" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Owner-wallet USDG</text>
<text x="346" y="629" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">deposits underwrite</text>
<text x="346" y="659" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">bounded payouts.</text>
<path d="M469 675 V695 m-6 -6 6 6 6 -6" stroke="#F7D977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="731" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Waterfall &amp; firewall</text>
<text x="346" y="767" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Junior takes first</text>
<text x="346" y="797" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">loss; trader reserves</text>
<text x="346" y="827" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">come first.</text>
<rect x="32" y="878" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="888" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="912" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">The oracle sets the price. VPI, carry and</text>
<text x="56" y="942" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">bounded solvency limits price pool risk without</text>
<text x="56" y="972" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">peer-to-peer matching.</text>
