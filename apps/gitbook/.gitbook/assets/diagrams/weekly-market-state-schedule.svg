<svg xmlns="http://www.w3.org/2000/svg" width="640" height="979" viewBox="0 0 640 979" role="img" aria-labelledby="weekly-market-state-schedule-title weekly-market-state-schedule-desc" focusable="false">
<title id="weekly-market-state-schedule-title">The FX weekend, in New York time</title>
<desc id="weekly-market-state-schedule-desc">Regular weekly phases in America/New_York: open until Friday 16:30, close-only with live policy until 17:00, frozen until Sunday 17:00, then close-only until 17:15. UTC offsets change with US daylight saving. 17:00 New York = 21:00 UTC in daylight time, 22:00 UTC in standard time. Closure-day overrides may extend restrictions. Sequence is not drawn to a time scale. Oracle data must still satisfy the active policy.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="979" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / MARKET CALENDAR</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">The FX weekend, in New York</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">time</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<circle cx="47" cy="233" r="14" fill="#00FF99"/>
<circle cx="47" cy="233" r="5" fill="#250917"/>
<text x="80" y="242" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Open</text>
<text x="80" y="279" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Sunday 17:15 → Friday 16:30</text>
<path d="M47 254 V303 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="332" r="14" fill="#F7D977"/>
<circle cx="47" cy="332" r="5" fill="#250917"/>
<text x="80" y="341" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Close-only · live oracle</text>
<text x="80" y="378" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Friday 16:30 → 17:00 · 30 minutes</text>
<path d="M47 353 V402 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="431" r="14" fill="#FF512F"/>
<circle cx="47" cy="431" r="5" fill="#250917"/>
<text x="80" y="440" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Close-only · frozen oracle</text>
<text x="80" y="477" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Friday 17:00 → Sunday 17:00</text>
<path d="M47 452 V501 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="530" r="14" fill="#F7D977"/>
<circle cx="47" cy="530" r="5" fill="#250917"/>
<text x="80" y="539" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Close-only · live oracle</text>
<text x="80" y="576" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Sunday 17:00 → 17:15 · 15 minutes</text>
<path d="M47 551 V600 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="629" r="14" fill="#00FF99"/>
<circle cx="47" cy="629" r="5" fill="#250917"/>
<text x="80" y="638" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Open again</text>
<text x="80" y="675" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Sunday 17:15, if no override applies.</text>
<rect x="32" y="699" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="737" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">17:00 New York = 21:00 UTC in daylight time,</text>
<text x="50" y="769" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">22:00 UTC in standard time. Closure-day</text>
<text x="50" y="801" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">overrides may extend restrictions.</text>
<rect x="32" y="851" width="576" height="96" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="889" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Sequence is not drawn to a time scale. Oracle</text>
<text x="50" y="921" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">data must still satisfy the active policy.</text>
</svg>
