<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1274" viewBox="0 0 640 1274" role="img" aria-labelledby="pnl-and-close-settlement-outcomes-title pnl-and-close-settlement-outcomes-desc" focusable="false">
<title id="pnl-and-close-settlement-outcomes-title">Price PnL is not cash settlement</title>
<desc id="pnl-and-close-settlement-outcomes-desc">Unrealized price PnL contributes to price-risk equity. A close separates realized price PnL from action costs; positive residual price payouts may be funded or recorded as claims. A net action rebate is limited by available cash. An unpaid rebate is waived; it does not become a trader claim.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1274" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · PNL &amp; ACCOUNTING</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">Price PnL is not cash settlement</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<text x="32" y="192" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">While the position is open</text>
<circle cx="47" cy="228" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="228" r="5" fill="#9A8890"/>
<text x="78" y="237" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Unrealized price PnL</text>
<text x="78" y="270" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">From side, entry cost, quantity and current</text>
<text x="78" y="300" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">mark.</text>
<path d="M47 247 V324 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="347" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="347" r="5" fill="#9A8890"/>
<text x="78" y="356" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Price-risk equity</text>
<text x="78" y="389" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Position margin after accrued carry +</text>
<text x="78" y="419" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">nettable own claim + unrealized price PnL.</text>
<text x="32" y="473" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="576">When a close executes</text>
<circle cx="47" cy="509" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="509" r="5" fill="#9A8890"/>
<text x="78" y="518" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Collect accrued carry</text>
<text x="78" y="551" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Active position margin first, then eligible free</text>
<text x="78" y="581" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">USDG. Carry not collected joins the action</text>
<text x="78" y="611" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">charge.</text>
<rect x="32" y="635" width="278" height="467" rx="12" fill="#3B212D" stroke="#00FF99" stroke-width="1.5"/>
<rect x="44" y="638" width="254" height="5" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="677" font-size="24" font-weight="700" fill="#00FF99" data-max-width="246">Price gain</text>
<path d="M48 694 L294 694" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="48" y="720" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Withhold action</text>
<text x="48" y="750" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">costs</text>
<text x="48" y="786" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Any residual price</text>
<text x="48" y="816" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">payout is funded in</text>
<text x="48" y="846" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">full or recorded as a</text>
<text x="48" y="876" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">claim.</text>
<path d="M171 892 V912 m-6 -6 6 6 6 -6" stroke="#00FF99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="948" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Credit the right</text>
<text x="48" y="978" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">bucket</text>
<text x="48" y="1014" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Open remainder: PnL</text>
<text x="48" y="1044" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">pledge. No position:</text>
<text x="48" y="1074" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">settlement.</text>
<rect x="330" y="635" width="278" height="467" rx="12" fill="#3B212D" stroke="#FF512F" stroke-width="1.5"/>
<rect x="342" y="638" width="254" height="5" rx="3" fill="#FF512F" stroke="none"/>
<text x="346" y="677" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="246">Price loss</text>
<path d="M346 694 L592 694" stroke="#9A8890" stroke-width="1" fill="none"/>
<text x="346" y="720" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Net claim, then pledge</text>
<text x="346" y="756" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">The terminal cap</text>
<text x="346" y="786" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">limits collection.</text>
<path d="M469 802 V822 m-6 -6 6 6 6 -6" stroke="#FF512F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="858" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">Settle costs</text>
<text x="346" y="888" font-size="22" font-weight="700" fill="#FFF5F9" data-max-width="246">separately</text>
<text x="346" y="924" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">Fees, VPI and unpaid</text>
<text x="346" y="954" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">carry use eligible</text>
<text x="346" y="984" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">action funds,</text>
<text x="346" y="1014" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">including safely</text>
<text x="346" y="1044" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="246">released margin.</text>
<rect x="32" y="1124" width="576" height="118" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="1134" width="5" height="98" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="1158" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">A net action rebate is limited by available cash.</text>
<text x="56" y="1188" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">An unpaid rebate is waived; it does not become</text>
<text x="56" y="1218" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">a trader claim.</text>
</svg>
