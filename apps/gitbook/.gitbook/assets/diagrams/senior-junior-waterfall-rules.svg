<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="senior-junior-waterfall-rules-title senior-junior-waterfall-rules-desc" focusable="false">
<title id="senior-junior-waterfall-rules-title">Three rules for LP returns</title>
<desc id="senior-junior-waterfall-rules-desc">Losses go through Junior before Senior; revenue restores Senior impairment before reaching Junior; the coupon transfers available Junior principal to Senior. A target coupon is not guaranteed yield. Both tranches can lose value.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="830" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / SENIOR &amp; JUNIOR</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Three rules for LP returns</text>
<path d="M32 143 L608 143" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 143 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<text x="32" y="203" font-size="24" font-weight="700" fill="#250917" data-max-width="576">01 · Loss absorption</text>
<circle cx="47" cy="246" r="14" fill="#FF512F"/>
<circle cx="47" cy="246" r="5" fill="#250917"/>
<text x="80" y="255" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Junior → Senior</text>
<text x="80" y="292" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Junior takes the first loss. Senior absorbs</text>
<text x="80" y="324" font-size="24" font-weight="400" fill="#250917" data-max-width="528">the remainder.</text>
<text x="32" y="380" font-size="24" font-weight="700" fill="#250917" data-max-width="576">02 · New revenue</text>
<circle cx="47" cy="423" r="14" fill="#00FF99"/>
<circle cx="47" cy="423" r="5" fill="#250917"/>
<text x="80" y="432" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Restore Senior → Junior</text>
<text x="80" y="469" font-size="24" font-weight="400" fill="#250917" data-max-width="528">Restore Senior to its high-water mark, then</text>
<text x="80" y="501" font-size="24" font-weight="400" fill="#250917" data-max-width="528">credit residual revenue to Junior.</text>
<text x="32" y="557" font-size="24" font-weight="700" fill="#250917" data-max-width="576">03 · Target coupon</text>
<circle cx="47" cy="600" r="14" fill="#FF512F"/>
<circle cx="47" cy="600" r="5" fill="#250917"/>
<text x="80" y="609" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Junior funds Senior</text>
<text x="80" y="646" font-size="24" font-weight="400" fill="#250917" data-max-width="528">The transfer is capped by available Junior</text>
<text x="80" y="678" font-size="24" font-weight="400" fill="#250917" data-max-width="528">principal.</text>
<rect x="32" y="702" width="576" height="96" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="740" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">A target coupon is not guaranteed yield.</text>
<text x="50" y="772" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">Both tranches can lose value.</text>
</svg>
