name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - apps/frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sepolia
          - mainnet

env:
  TARGET_ENV: ${{ github.event_name == 'push' && 'mainnet' || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        run: npm ci

      - name: Install Insights story dependencies
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/insights
        run: npm ci

      - name: Require TradingView repository token
        if: env.TARGET_ENV == 'sepolia'
        env:
          TRADINGVIEW_GITHUB_TOKEN: ${{ secrets.TRADINGVIEW_GITHUB_TOKEN }}
        run: test -n "$TRADINGVIEW_GITHUB_TOKEN"

      - name: Checkout TradingView Advanced Charts
        if: env.TARGET_ENV == 'sepolia'
        uses: actions/checkout@v4
        with:
          repository: tradingview/charting_library
          # TradingView Advanced Charts v32.0.0. Pin executable third-party code by commit.
          ref: f2a61ba473ec254b69f9c1377c67e4b81eff853b
          token: ${{ secrets.TRADINGVIEW_GITHUB_TOKEN }}
          persist-credentials: false
          path: .private/tradingview-charting-library

      - name: Install TradingView runtime assets
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        run: npm run tradingview:install -- "$GITHUB_WORKSPACE/.private/tradingview-charting-library"

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$TARGET_ENV" = "sepolia" ]; then
            echo "project=plether-testnet" >> "$GITHUB_OUTPUT"
            echo "directory=dist" >> "$GITHUB_OUTPUT"
            echo "default_chain_id=421614" >> "$GITHUB_OUTPUT"
            echo "perps_aa_manifest_url=/perps-aa-manifest.json" >> "$GITHUB_OUTPUT"
          else
            echo "project=plether" >> "$GITHUB_OUTPUT"
            echo "directory=mainnet-redirect" >> "$GITHUB_OUTPUT"
            echo "default_chain_id=1" >> "$GITHUB_OUTPUT"
            echo "perps_aa_manifest_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          VITE_DEFAULT_CHAIN_ID: ${{ steps.target.outputs.default_chain_id }}
          VITE_PERPS_AA_MANIFEST_URL: ${{ steps.target.outputs.perps_aa_manifest_url }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.VITE_POSTHOG_REPLAY_SAMPLE_RATE }}
          VITE_DEPLOYMENT_ENV: ${{ env.TARGET_ENV }}
          VITE_MAINNET_RPC_URL: ${{ vars.VITE_MAINNET_RPC_URL }}
          VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}
          VITE_ARBITRUM_SEPOLIA_RPC_URL: ${{ vars.VITE_ARBITRUM_SEPOLIA_RPC_URL }}
          VITE_TRADINGVIEW_CHARTS_ENABLED: 'true'
        run: npm run build

      - name: Validate TradingView runtime payload
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        run: |
          test -s dist/charting_library/charting_library.standalone.js
          test -d dist/charting_library/bundles
          test -n "$(find dist/charting_library/bundles -type f -print -quit)"
          test ! -e dist/charting_library/sameorigin.html
          test ! -e dist/charting_library/charting_library.d.ts
          test ! -e dist/charting_library/datafeed-api.d.ts
          test ! -e dist/charting_library/package.json
          test ! -e dist/charting_library/charting_library.cjs.js
          test ! -e dist/charting_library/charting_library.esm.js
          test ! -e dist/charting_library/charting_library.js

      - name: Validate testnet AA manifest
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          test -s dist/perps-aa-manifest.json
          jq -e '
            .version == "perps-aa-arbitrum-sepolia-20260906-v2" and
            .chainId == 421614 and
            .entryPointVersion == "0.8" and
            .pimlicoRpcUrl == "/api/perps/v1/aa/pimlico" and
            .orderRouter == "0xbd2f286efca5F761E21452673ab9b8C14e17aad7" and
            .orderLifecycleBook == "0x616aD381Df40047e9b060a1E85085B3Ed2CC6D3C" and
            .policyEvaluator == "0x1ed622ed2Cbd64bd36115dB9D4f4c0006b5894fB" and
            .sponsorshipEnabled == true
          ' dist/perps-aa-manifest.json >/dev/null

          test -n "$SEPOLIA_BACKEND_URL"
          curl --fail --silent --show-error \
            "$SEPOLIA_BACKEND_URL/api/aa/status" > aa-status.json
          jq --exit-status \
            --slurpfile manifest dist/perps-aa-manifest.json \
            '
              .manifestVersion == $manifest[0].version and
              .chainId == $manifest[0].chainId and
              .deploymentBlock == 306119399 and
              .usdc == $manifest[0].usdc and
              .orderRouter == $manifest[0].orderRouter and
              .orderLifecycleBook == $manifest[0].orderLifecycleBook and
              .cfdEngine == $manifest[0].cfdEngine and
              .marginClearinghouse == $manifest[0].marginClearinghouse and
              .housePool == "0x21D52509Bb9b9857DaBc8c7FD36dD7fed9118918" and
              .policyEvaluator == $manifest[0].policyEvaluator and
              .positionProtectionBook == "0x35f495fFDbB4d6ae395691D4632629f67603C926" and
              .perpsPublicLens == "0x53B1B00748E7D1A87dc30433e87c331CeDe30149" and
              .calldataPolicy == "bounded-v2" and
              .bindingsVerified == true and
              .sponsorshipEnabled == true
            ' aa-status.json >/dev/null

      - name: Require deployable Sepolia candle volume
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "$SEPOLIA_BACKEND_URL"
          node scripts/validate-candle-volume-coverage.mjs \
            --backend-url "$SEPOLIA_BACKEND_URL" \
            --manifest dist/perps-aa-manifest.json

      - name: Configure testnet Pages bindings
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          test -n "$SEPOLIA_BACKEND_URL"
          cat > wrangler.toml <<EOF
          name = "plether-testnet"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-06-22"

          [vars]
          SEPOLIA_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          MAINNET_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          EOF

      - name: Ensure testnet Pages project
        if: env.TARGET_ENV == 'sepolia'
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.103.0
          command: pages project create plether-testnet --production-branch=master --compatibility-date=2026-06-22

      - name: Configure testnet AA proxy secret
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AA_PROXY_ORIGIN_TOKEN: ${{ secrets.AA_PROXY_ORIGIN_TOKEN }}
        run: |
          test -n "$AA_PROXY_ORIGIN_TOKEN"
          printf '%s\n' "$AA_PROXY_ORIGIN_TOKEN" |
            npx --yes wrangler@4.103.0 pages secret put AA_PROXY_ORIGIN_TOKEN \
              --project-name=plether-testnet

      - name: Configure testnet faucet proxy secret
        if: env.TARGET_ENV == 'sepolia'
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAUCET_PROXY_ORIGIN_TOKEN: ${{ secrets.FAUCET_PROXY_ORIGIN_TOKEN }}
        run: |
          test -n "$FAUCET_PROXY_ORIGIN_TOKEN"
          printf '%s\n' "$FAUCET_PROXY_ORIGIN_TOKEN" |
            npx --yes wrangler@4.103.0 pages secret put FAUCET_PROXY_ORIGIN_TOKEN \
              --project-name=plether-testnet

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.103.0
          workingDirectory: apps/frontend
          command: pages deploy ${{ steps.target.outputs.directory }} --project-name=${{ steps.target.outputs.project }} --branch=master

      - name: Attach testnet custom domain
        if: env.TARGET_ENV == 'sepolia'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DOMAIN="app.sepolia.plether.com"
          PROJECT="plether-testnet"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"

          if curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/$DOMAIN" >/dev/null; then
            echo "$DOMAIN is already attached to $PROJECT"
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"$DOMAIN\"}" \
            "$API_BASE"

      - name: Configure testnet DNS record
        if: env.TARGET_ENV == 'sepolia'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE="plether.com"
          DOMAIN="app.sepolia.plether.com"
          TARGET="plether-testnet.pages.dev"
          API_BASE="https://api.cloudflare.com/client/v4"

          ZONE_ID=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Could not find Cloudflare zone $ZONE. Ensure CLOUDFLARE_API_TOKEN can read/edit DNS, or create a proxied CNAME from $DOMAIN to $TARGET manually."
            exit 1
          fi

          RECORDS=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/zones/$ZONE_ID/dns_records?name=$DOMAIN")
          RECORD_ID=$(echo "$RECORDS" | jq -r '.result[0].id // empty')
          BODY=$(jq -nc --arg name "$DOMAIN" --arg content "$TARGET" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$RECORD_ID" ]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$BODY" \
              "$API_BASE/zones/$ZONE_ID/dns_records/$RECORD_ID"
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$BODY" \
              "$API_BASE/zones/$ZONE_ID/dns_records"
          fi
