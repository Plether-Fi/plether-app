<text x="320" y="358" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="544" text-anchor="middle">Plether Perps Engine</text>
<text x="320" y="388" font-size="22" font-weight="400" fill="#FFAB96" data-max-width="544" text-anchor="middle">Delayed FIFO · Solvency · VPI &amp; carry</text>
<path d="M320 404 L320 420" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M171 420 L469 420" stroke="#9A8890" stroke-width="2" fill="none"/>
