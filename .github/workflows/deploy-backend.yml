name: Deploy Backend

on:
  push:
    branches: [master]
    paths: [apps/backend/**]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sepolia
          - mainnet

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TARGET_ENV: ${{ github.event_name == 'push' && 'mainnet' || inputs.environment }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$TARGET_ENV" = "mainnet" ]; then
            ECR_REPOSITORY=plether-api
          else
            ECR_REPOSITORY=plether-api-$TARGET_ENV
          fi

          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker buildx build \
            --platform linux/arm64 \
            -f apps/backend/Dockerfile \
            -t $IMAGE \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJson((github.event_name == 'push' || inputs.environment == 'mainnet') && '[{"environment":"mainnet","task_family":"plether-mainnet","service_name":"plether-api","container_name":"plether-api"},{"environment":"mainnet","task_family":"plether-mainnet-workers","service_name":"plether-workers","container_name":"plether-workers"},{"environment":"mainnet","task_family":"plether-mainnet-insights-worker","service_name":"plether-insights-worker","container_name":"plether-insights-worker"}]' || '[{"environment":"sepolia","task_family":"plether-sepolia","service_name":"plether-api","container_name":"plether-api"},{"environment":"sepolia","task_family":"plether-sepolia-workers","service_name":"plether-workers","container_name":"plether-workers"},{"environment":"sepolia","task_family":"plether-sepolia-insights-worker","service_name":"plether-insights-worker","container_name":"plether-insights-worker"}]') }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy target
        id: target
        run: |
          SERVICE_ARN=$(
            aws ecs describe-services \
              --cluster plether-${{ matrix.environment }} \
              --services ${{ matrix.service_name }} \
              --query 'services[?status!=`INACTIVE`].serviceArn | [0]' \
              --output text
          )

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.service_name }} because it is not provisioned in ${{ matrix.environment }}."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest active Terraform task definition
        if: steps.target.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ matrix.task_family }}" \
            --query taskDefinition > task-def.json

      - name: Patch Sepolia task definition network
        if: steps.target.outputs.exists == 'true' && matrix.environment == 'sepolia'
        run: |
          jq \
            --arg container "${{ matrix.container_name }}" \
            '
            def upsert_env($name; $value):
              .environment = (
                ((.environment // []) | map(select(.name != $name)))
                + [{"name": $name, "value": $value}]
              );
            def upsert_secret($name; $valueFrom):
              .secrets = (
                ((.secrets // []) | map(select(.name != $name)))
                + [{"name": $name, "valueFrom": $valueFrom}]
              );

            .containerDefinitions |= map(
              if .name == $container then
                (.secrets // [] | map(select(.name == "PERPS_RPC_URL")) | .[0].valueFrom) as $rpcSecret
                |
                upsert_env("CHAIN_ID"; "421614")
                | upsert_env("INDEXER_START_BLOCK"; "280884700")
                | upsert_secret("RPC_URL"; $rpcSecret)
              else
                .
              end
            )
            ' task-def.json > task-def.patched.json
          mv task-def.patched.json task-def.json

      - name: Update task definition image
        if: steps.target.outputs.exists == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.container_name }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy to ECS
        if: steps.target.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service_name }}
          cluster: plether-${{ matrix.environment }}
          wait-for-service-stability: true
