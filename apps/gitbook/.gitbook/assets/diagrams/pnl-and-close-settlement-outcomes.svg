<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1273" viewBox="0 0 640 1273" role="img" aria-labelledby="pnl-and-close-settlement-outcomes-title pnl-and-close-settlement-outcomes-desc" focusable="false">
<title id="pnl-and-close-settlement-outcomes-title">Price PnL is not cash settlement</title>
<desc id="pnl-and-close-settlement-outcomes-desc">Unrealized price PnL contributes to price-risk equity. A close separates realized price PnL from action costs; positive residual price payouts may be funded or recorded as claims. A net action rebate is limited by available cash. An unpaid rebate is waived; it does not become a trader claim.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1273" rx="16" fill="#FFF5F9"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#250917" data-max-width="576">PLETHER / PNL &amp; ACCOUNTING</text>
<text x="32" y="110" font-size="36" font-weight="700" fill="#250917" data-max-width="576">Price PnL is not cash</text>
<text x="32" y="155" font-size="36" font-weight="700" fill="#250917" data-max-width="576">settlement</text>
<path d="M32 188 L608 188" stroke="#9A8890" stroke-width="2" fill="none"/>
<path d="M32 188 h64" stroke="#FF512F" stroke-width="4" fill="none"/>
<text x="32" y="248" font-size="24" font-weight="700" fill="#250917" data-max-width="576">While the position is open</text>
<circle cx="47" cy="291" r="14" fill="#9A8890"/>
<circle cx="47" cy="291" r="5" fill="#250917"/>
<text x="80" y="300" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Unrealized price PnL</text>
<text x="80" y="337" font-size="24" font-weight="400" fill="#250917" data-max-width="528">From side, entry cost, quantity and current</text>
<text x="80" y="369" font-size="24" font-weight="400" fill="#250917" data-max-width="528">mark.</text>
<path d="M47 312 V393 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="422" r="14" fill="#9A8890"/>
<circle cx="47" cy="422" r="5" fill="#250917"/>
<text x="80" y="431" font-size="26" font-weight="700" fill="#250917" data-max-width="528">Price-risk equity</text>
<text x="80" y="468" font-size="24" font-weight="400" fill="#250917" data-max-width="528">PnL pledge + nettable own claim + unrealized</text>
<text x="80" y="500" font-size="24" font-weight="400" fill="#250917" data-max-width="528">price PnL.</text>
<text x="32" y="556" font-size="24" font-weight="700" fill="#250917" data-max-width="576">When a close executes</text>
<rect x="32" y="582" width="278" height="507" rx="12" fill="#FFF5F9" stroke="#9A8890"/>
<rect x="44" y="586" width="254" height="6" rx="3" fill="#00FF99" stroke="none"/>
<text x="48" y="624" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Price gain</text>
<path d="M48 645 L294 645" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="48" y="675" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Withhold action</text>
<text x="48" y="708" font-size="26" font-weight="700" fill="#250917" data-max-width="246">costs</text>
<text x="48" y="747" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Any residual price</text>
<text x="48" y="779" font-size="24" font-weight="400" fill="#250917" data-max-width="246">payout is funded in</text>
<text x="48" y="811" font-size="24" font-weight="400" fill="#250917" data-max-width="246">full or recorded as a</text>
<text x="48" y="843" font-size="24" font-weight="400" fill="#250917" data-max-width="246">claim.</text>
<path d="M56 860 V879 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="48" y="923" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Credit the right</text>
<text x="48" y="956" font-size="26" font-weight="700" fill="#250917" data-max-width="246">bucket</text>
<text x="48" y="995" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Open remainder: PnL</text>
<text x="48" y="1027" font-size="24" font-weight="400" fill="#250917" data-max-width="246">pledge. No position:</text>
<text x="48" y="1059" font-size="24" font-weight="400" fill="#250917" data-max-width="246">settlement.</text>
<rect x="330" y="582" width="278" height="507" rx="12" fill="#FFAB96" stroke="none"/>
<text x="346" y="624" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Price loss</text>
<path d="M346 645 L592 645" stroke="#9A8890" stroke-width="2" fill="none"/>
<text x="346" y="675" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Net claim, then</text>
<text x="346" y="708" font-size="26" font-weight="700" fill="#250917" data-max-width="246">pledge</text>
<text x="346" y="747" font-size="24" font-weight="400" fill="#250917" data-max-width="246">The terminal cap</text>
<text x="346" y="779" font-size="24" font-weight="400" fill="#250917" data-max-width="246">limits collection.</text>
<path d="M354 796 V815 m-5 -5 5 5 5 -5" stroke="#250917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="346" y="859" font-size="26" font-weight="700" fill="#250917" data-max-width="246">Settle costs</text>
<text x="346" y="892" font-size="26" font-weight="700" fill="#250917" data-max-width="246">separately</text>
<text x="346" y="931" font-size="24" font-weight="400" fill="#250917" data-max-width="246">Fees, carry and VPI</text>
<text x="346" y="963" font-size="24" font-weight="400" fill="#250917" data-max-width="246">use their eligible</text>
<text x="346" y="995" font-size="24" font-weight="400" fill="#250917" data-max-width="246">action funds.</text>
<rect x="32" y="1113" width="576" height="128" rx="12" fill="#250917" stroke="none"/>
<text x="50" y="1151" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">A net action rebate is limited by available</text>
<text x="50" y="1183" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">cash. An unpaid rebate is waived; it does not</text>
<text x="50" y="1215" font-size="24" font-weight="400" fill="#FFF5F9" data-max-width="540">become a trader claim.</text>
</svg>
