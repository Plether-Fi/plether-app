name: Deploy Landing

on:
  push:
    branches: [master]
    paths: [apps/landing/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        working-directory: apps/landing
        run: npm ci

      - name: Build
        working-directory: apps/landing
        run: npm run build

      - name: Verify build outputs
        working-directory: apps/landing
        run: |
          test -s dist/index.html
          test -s dist/manifesto/index.html
          test -s dist/media-kit/index.html
          test -s dist/404.html
          test -s dist/_headers
          test -s dist/_redirects
          test -s dist/og-image.png
          grep -q 'rel="preload" as="font"' dist/index.html
          grep -q 'Settled in USDG.' dist/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/landing/dist --project-name=plether-landing --branch=${{ github.ref_name }}
