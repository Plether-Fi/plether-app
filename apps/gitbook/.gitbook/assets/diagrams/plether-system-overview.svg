<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1028" viewBox="0 0 640 1028" role="img" aria-labelledby="plether-system-overview-title plether-system-overview-desc" focusable="false">
<title id="plether-system-overview-title">How Plether Perps fits together</title>
<desc id="plether-system-overview-desc">Pyth FX feeds set the bounded plDXY price. Traders commit LONG USD or SHORT USD orders via gas-sponsored Trading Accounts, while Senior and Junior LP vaults underwrite bounded payouts. The oracle sets the price. VPI, carry and bounded solvency limits price pool risk without peer-to-peer matching.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="1028" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · OVERVIEW</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">How Plether Perps fits together</text>
