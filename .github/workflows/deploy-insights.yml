name: Deploy Insights

on:
  push:
    branches: [master]
    paths:
      - apps/insights/**
      - .github/workflows/deploy-insights.yml
  workflow_dispatch:

concurrency:
  group: deploy-insights-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: apps/insights/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Validate backend origin
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          node --input-type=module --eval '
            const configuredOrigin = process.env.SEPOLIA_BACKEND_URL ?? "";
            let origin;
            try {
              origin = new URL(configuredOrigin);
            } catch {
              origin = null;
            }

            const isHttpsOrigin =
              configuredOrigin === configuredOrigin.trim() &&
              origin?.protocol === "https:" &&
              origin.username === "" &&
              origin.password === "" &&
              origin.pathname === "/" &&
              origin.search === "" &&
              origin.hash === "";

            if (!isHttpsOrigin) {
              console.error("::error title=Invalid Insights backend origin::SEPOLIA_BACKEND_URL must be an HTTPS origin without credentials, a path, query parameters, or a fragment (for example, https://api.example.com).");
              process.exit(1);
            }
          '

      - name: Verify Insights backend is ready
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 15 \
            "$SEPOLIA_BACKEND_URL/api/insights/v1/status")

          echo "$RESPONSE" | jq --exit-status \
            '.data.competition.scoringVersion and .data.status' >/dev/null

      - name: Validate registration frontend configuration
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.INSIGHTS_TURNSTILE_SITE_KEY }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || {
            echo "::error title=Missing Turnstile site key::Configure the INSIGHTS_TURNSTILE_SITE_KEY GitHub Actions variable."
            exit 1
          }
          test -n "$VITE_WALLETCONNECT_PROJECT_ID" || {
            echo "::error title=Missing WalletConnect project ID::Configure the WALLETCONNECT_PROJECT_ID GitHub Actions variable."
            exit 1
          }

      - name: Install dependencies
        working-directory: apps/insights
        run: npm ci

      - name: Lint
        working-directory: apps/insights
        run: npm run lint

      - name: Test
        working-directory: apps/insights
        run: npm test

      - name: Build
        working-directory: apps/insights
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.INSIGHTS_TURNSTILE_SITE_KEY }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          # Keep this origin aligned with the exact connect-src entry in the
          # Pages Worker CSP. Do not substitute a credential-bearing RPC URL.
          VITE_ARBITRUM_SEPOLIA_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
        run: npm run build

      - name: Configure Pages bindings
        working-directory: apps/insights
        env:
          SEPOLIA_BACKEND_URL: ${{ vars.SEPOLIA_BACKEND_URL }}
        run: |
          cat > wrangler.toml <<EOF
          name = "plether-insights"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-07-17"

          [vars]
          SEPOLIA_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          INSIGHTS_BACKEND_URL = "$SEPOLIA_BACKEND_URL"
          INSIGHTS_REGISTRATION_PUBLIC_ORIGIN = "https://insights.plether.com"
          EOF

      - name: Ensure Pages project
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.103.0
          command: pages project create plether-insights --production-branch=master --compatibility-date=2026-07-17

      - name: Configure registration proxy secret
        working-directory: apps/insights
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGISTRATION_ORIGIN_TOKEN_SLOT: ${{ vars.INSIGHTS_REGISTRATION_ORIGIN_TOKEN_SLOT || 'current' }}
          REGISTRATION_ORIGIN_TOKEN_CURRENT: ${{ secrets.INSIGHTS_REGISTRATION_ORIGIN_TOKEN }}
          REGISTRATION_ORIGIN_TOKEN_NEXT: ${{ secrets.INSIGHTS_REGISTRATION_ORIGIN_TOKEN_NEXT }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          valid_origin_token() {
            [[ "$1" =~ ^[[:graph:]]{32,}$ ]]
          }

          valid_origin_token "$REGISTRATION_ORIGIN_TOKEN_CURRENT" || {
            echo "::error title=Invalid current registration origin token::Configure INSIGHTS_REGISTRATION_ORIGIN_TOKEN as at least 32 printable non-whitespace ASCII characters matching the backend current token."
            exit 1
          }

          if [ -n "$REGISTRATION_ORIGIN_TOKEN_NEXT" ]; then
            valid_origin_token "$REGISTRATION_ORIGIN_TOKEN_NEXT" || {
              echo "::error title=Invalid next registration origin token::INSIGHTS_REGISTRATION_ORIGIN_TOKEN_NEXT must be at least 32 printable non-whitespace ASCII characters."
              exit 1
            }
            [ "$REGISTRATION_ORIGIN_TOKEN_NEXT" != "$REGISTRATION_ORIGIN_TOKEN_CURRENT" ] || {
              echo "::error title=Duplicate registration origin tokens::Current and next registration origin tokens must be distinct."
              exit 1
            }
          fi

          case "$REGISTRATION_ORIGIN_TOKEN_SLOT" in
            current)
              SENDER_TOKEN=$REGISTRATION_ORIGIN_TOKEN_CURRENT
              ;;
            next)
              [ -n "$REGISTRATION_ORIGIN_TOKEN_NEXT" ] || {
                echo "::error title=Missing next registration origin token::The sender slot is next, but INSIGHTS_REGISTRATION_ORIGIN_TOKEN_NEXT is not configured."
                exit 1
              }
              SENDER_TOKEN=$REGISTRATION_ORIGIN_TOKEN_NEXT
              ;;
            *)
              echo "::error title=Invalid registration origin token slot::INSIGHTS_REGISTRATION_ORIGIN_TOKEN_SLOT must be current or next."
              exit 1
              ;;
          esac

          printf '%s\n' "$SENDER_TOKEN" |
            npx --yes wrangler@4.103.0 pages secret put INSIGHTS_REGISTRATION_ORIGIN_TOKEN \
              --project-name=plether-insights

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.103.0
          workingDirectory: apps/insights
          command: pages deploy dist --project-name=plether-insights --branch=master

      - name: Attach custom domain
        id: custom-domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DOMAIN="insights.plether.com"
          PROJECT="plether-insights"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"

          if curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/$DOMAIN" >/dev/null; then
            echo "$DOMAIN is already attached to $PROJECT"
            echo "dns_configuration_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"$DOMAIN\"}" \
            "$API_BASE"
          echo "dns_configuration_needed=true" >> "$GITHUB_OUTPUT"

      - name: Configure DNS record
        if: steps.custom-domain.outputs.dns_configuration_needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE="plether.com"
          DOMAIN="insights.plether.com"
          TARGET="plether-insights.pages.dev"
          API_BASE="https://api.cloudflare.com/client/v4"

          ZONE_ID=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          test -n "$ZONE_ID"

          RECORDS=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/zones/$ZONE_ID/dns_records?name=$DOMAIN")
          RECORD_ID=$(echo "$RECORDS" | jq -r '.result[0].id // empty')
          BODY=$(jq -nc --arg name "$DOMAIN" --arg content "$TARGET" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$RECORD_ID" ]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$BODY" \
              "$API_BASE/zones/$ZONE_ID/dns_records/$RECORD_ID"
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$BODY" \
              "$API_BASE/zones/$ZONE_ID/dns_records"
          fi

      - name: Verify custom domain
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            https://insights.plether.com/ >/dev/null
