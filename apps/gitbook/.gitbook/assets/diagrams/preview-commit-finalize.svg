<svg xmlns="http://www.w3.org/2000/svg" width="640" height="601" viewBox="0 0 640 601" role="img" aria-labelledby="preview-commit-finalize-title preview-commit-finalize-desc" focusable="false">
<title id="preview-commit-finalize-title">One review, two onchain stages</title>
<desc id="preview-commit-finalize-desc">Preview is not a transaction. Commitment and later keeper execution are separate onchain stages. The requested trade happens only if execution succeeds.</desc>
<style>text{font-family:'Uncut Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif}</style>
<rect width="640" height="601" rx="16" fill="#250917" stroke="#3B212D" stroke-width="2"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#FFAB96" data-max-width="576">PLETHER · ORDER LIFECYCLE</text>
<text x="32" y="106" font-size="34" font-weight="700" fill="#FFF5F9" data-max-width="576">One review, two onchain stages</text>
<path d="M32 136 L608 136" stroke="#3B212D" stroke-width="2" fill="none"/>
<path d="M32 136 h72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="47" cy="177" r="13" fill="#3B212D" stroke="#9A8890" stroke-width="2.5"/>
<circle cx="47" cy="177" r="5" fill="#9A8890"/>
<text x="78" y="186" font-size="24" font-weight="700" fill="#FFF5F9" data-max-width="530">Preview</text>
<text x="78" y="219" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Review an estimate. Nothing has been</text>
<text x="78" y="249" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">committed.</text>
<path d="M47 196 V273 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="296" r="13" fill="#3B212D" stroke="#FFAB96" stroke-width="2.5"/>
<circle cx="47" cy="296" r="5" fill="#FFAB96"/>
<text x="78" y="305" font-size="24" font-weight="700" fill="#FFAB96" data-max-width="530">Commit</text>
<text x="78" y="338" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">Authorize an order and reserve its required</text>
<text x="78" y="368" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">funds.</text>
<path d="M47 315 V392 m-6 -6 6 6 6 -6" stroke="#9A8890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="47" cy="415" r="13" fill="#3B212D" stroke="#00FF99" stroke-width="2.5"/>
<circle cx="47" cy="415" r="5" fill="#00FF99"/>
<text x="78" y="424" font-size="24" font-weight="700" fill="#00FF99" data-max-width="530">Execute later</text>
<text x="78" y="457" font-size="22" font-weight="400" fill="#D8CBD0" data-max-width="530">A keeper processes the eligible queued order.</text>
<rect x="32" y="481" width="576" height="88" rx="10" fill="#3B212D" stroke="#9A8890" stroke-width="1"/>
<rect x="36" y="491" width="5" height="68" rx="3" fill="#FF512F" stroke="none"/>
<text x="56" y="515" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">The requested trade happens only if execution</text>
<text x="56" y="545" font-size="22" font-weight="400" fill="#FFF5F9" data-max-width="532">succeeds.</text>
</svg>
